e session could then never escalate again - now installed after the render, keeping the previous known-good set on failure. THIRD: `WriteCodeMap` is NOT never-throw as RefreshCodeSurfaces' comment asserted (its try covers only CodeMap.BuildVariants; RenderPage/ApplyReferenceLinks/EnsureHierarchyEngine/WriteOutput sit outside), and it ran AHEAD of WriteIndex + the IR emit, so one IOException on the 1.5 MB code-map.html cost an ordinary save its index and its IR - now contained and reported. FOURTH: one transient git-insights.html write failure nulled _progress.DeepGit.Insights permanently, disabling the surface for the whole session with the Error event discarded into a throwaway list - now cleared only when the page is genuinely absent. FIFTH: a nested ADR (docs/adrs/decisions/2026/x.md) escalated on EVERY save forever, because the ADR watcher is recursive while EnumerateAdrFiles is bounded to root + one level - a non-convergent full-rebuild loop, latent but invited by that enumerator's own doc comment. OWNER D2: file-level escalations are now labelled with the firing path; `<directory change>` is reserved for genuine directory passes, because that constant's own contract is "do NOT attribute this to some arbitrary contained file" which is backwards when a named file IS the event. OWNER D3: ClearEpicsFamilyOutputs and RemoveFor's Removed branch are UNREACHABLE from the production dispatch (their 8 green tests pass by bypassing FileWatcherService entirely) - accepted, since escalation is measured strictly more correct, and now RECORDED IN ADR 0027 so test reachability is never again read as production reachability. AC AUDIT: AC #2's required per-epic node/edge assertion DID NOT EXIST anywhere despite Task 2's subtask being checked off - the whole-tree byte diff had been silently substituted, and the Auditor rebuilt the fixture to prove the substitute is blind to the very surface the 56-page defect lived on (this fixture renders `Work graph for` only in work-graph.htm