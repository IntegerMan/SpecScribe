nt drift reproduced identically on clean main @ b9582a4 — actual hash 3e0d2bd3…, unrelated to this spike). Follow-up: the RegenerateEpics work-graph over-count is a live `specscribe watch` defect today — standalone fix or fold into 22.5. Full suite at dev time 2162 passed/3 skipped/1 golden drift. CODE REVIEW 2026-07-24: the golden failure does NOT reproduce — full suite green on current main f9b52bd (2336 passed/3 skipped/0 failed, GoldenContentFingerprint stable x2); spike-time failure was transient shared-main drift (pin 36cd7e64 at b9582a4, since re-blessed 5x to 89c8cf0c), no constant bump/code change needed. Report's "green" line confirmed correct.
  22-2-canonical-ir-schema-and-versioning: review # dev-story DONE 2026-07-26 (HEAD 261b300 at start; frontmatter baseline_commit cd7f302 preserved per workflow rule). ALL 7 ACs met. `spa/manifest.json` + `spa/pages-*.json` PROMOTED IN PLACE into the versioned canonical IR (owner D1 — no `ir/` dir, no rename): `schemaVersion: 1` as a monotonically-increasing integer beside MaxChunkBytes/MaxPagesPerChunk (bumps on breaking shape change only; additive fields never bump, which is why the client needed no change — pre-22.2 is version 0 by implication), plus per page a head projection {title, description} with the RenderHeadOpen fallback resolved at emit, a scriptIslands[] strip-or-nonce declaration, a truncated-SHA-256 contentHash and a byte size (owner D2 — ADDRESSING ONLY: no delta transport, no client consumption, no incremental-route change). AC #2 CLOSED PROPERLY: the chunk budget moved from RAW UTF-8 bytes to the EXACT JSON-encoded tokens (pre-encoded once and reused to assemble the file, so the number enforced and the bytes written cannot disagree — pinned by a test asserting the assembled chunk is byte-identical to serializing the equivalent Dictionary<string,string>), so a multi-page chunk can no longer overshoot the 2 MB ceiling; the ONE unsplittable case (a single page whose own encoded size exceeds it — regions are atomic) is now DECLARED in manifest.oversizedPages with the file's REAL measured size, never silent. On this repo that names exactly two: code-map.html 9,139,221 B and git-insights.html 3,107,287 B — the latter reproducing 22.1's "3.08 MB against a 2 MB guard" to the byte. AC #4 CLOSED ON BOTH SURFACES: SiteGenerator :2792 (webview) and :3062 (SPA) both called BuildIndexPage with named args starting at `counts:`, silently skipping the positional codeItemHref; both now pass CodeItemHref, and all 5 Git Pulse bar labels (3 of them code/*.html) are links on static + IR + webview. ⚠️ HONEST CORRECTION to the AC's numbers: 553/548 were 23.1's snapshot counts; this repo renders 1679 anchors in the dashboard <main>, EQUAL on both surfaces — so the tests pin the WHOLE <main> block byte-identical rather than a count that drifts with the data (strictly stronger; fails on any future argument divergence at that call site). Webview link-target hazard DISCHARGED WITH EVIDENCE, no HostRenderExceptions entry needed: the bridge already routes absolute-scheme hrefs to openExternal, and captured surfaces ALREADY ship 2322 code/*.html links on code-map.html + 464 on git-insights.html + 331 on risk-quadrant.html, so the 5 restored links are no new class of behaviour. AC #5 nav context via the RECOMMENDED SLICE (new SpaDelivery.ExtractNavMarkup + one shared SiteGenerator.CapturedNavMarkup helper feeding both capture loops, returning ONE instance per page because the webview loop's ReferenceEquals degrade check depends on it) — no NavLocalContext plumbing needed; an ADR page now carries aria-label="ADRs" on both consumers and about.html is unchanged. AC #3 = new CanonicalIrSerializationTests: the manifest round-trips BYTE-IDENTICALLY through an INDEPENDENTLY DECLARED typed model (a field added on one side and not the other fails loudly) and every chunk as Dictionary<string,string>, with ZERO enumerated exceptions. AC #6 determinism PROVED BY REPEATED RUNS (frozen source snapshot, same output dir: manifest and every chunk byte-identical) and pinned by a test. AC #7 = docs/adrs/0016-ir-carries-rendered-prose-html.md (PROPOSED — ratification is the owner's), cross-referenced from docs/adrs/README.md, ADR 0008 (§Decision 1 + §Decision 4 callouts + References) and epics.md. ⚠️ TWO LIVE FINDINGS FOR LATER STORIES. (1) The story's premise that HierarchyExplorer.cs:349 emits a bare <script> into the body is STALE — that handshake moved to HierarchyExplorer.BootScript on the CHROME seam, and measured across the whole real site there are ZERO executable scripts in the IR and ZERO in the webview bundle. BUT IT IS LATENT: BootScript is emitted BETWEEN the breadcrumb and <main>, and ExtractContentRegion slices FROM the breadcrumb, so any CAPTURED page (all have breadcrumbs) that gains HierarchyEngineNeeded ships it into both consumers — where the webview's JsonDataIsland regex cannot match it. THIS LANDS THE MOMENT 20.7/20.9 MOUNTS A HIERARCHY CHART ON IMPACT MAP / WORK GRAPH / CODE MAP; the new scriptIslands declaration classifies exactly that case `executable` and a test pins it using the real BootScript shape. (2) The webview's `data-island` HostRenderException claims islands "are stripped from the webview content region" — TRUE ONLY of the FAMILY path. Captured surfaces are sliced by ExtractContentRegion and never touch that regex, so impact-map.html reaches the webview carrying its impact-map-data island UN-STRIPPED (measured with `webview --deep-git`). Left unfixed DELIBERATELY: making the webview consume the declaration is 22.4's job. ⚠️ HASH VOLATILITY: NOTHING was normalized, deliberately (a hash describing anything but the shipped bytes would lie to 22.5/22.6). Two false alarms run down — a CONCURRENT SESSION editing 5-5/deferred-work/Commands.cs/SettingsStore.cs mid-run, and my own harness using two different output dirs. The one real caveat 22.5/22.6 must expect: diagnostics.html echoes the configured OUTPUT ROOT inside its own region, so it is THE one page whose contentHash is output-path dependent and will differ machine-to-machine on identical input. Pre-existing trap found in passing: on a NON-GIT fixture FallbackCodeWalk skips dot-dirs/bin/obj/node_modules but NOT the output dir, so a nested output feeds run 1's HTML into run 2's code-map (not IR volatility; the real repo is a git checkout with a gitignored output dir). VERIFIED LIVE in a browser (:8103, app.html): bars are links and navigate client-side, an ADR page swapped in shows the ADRs band with real pills and no generic band, 0 scripts in swapped regions, 0 console errors, content-swapped re-init seam still fires. SCREENSHOTS UNAVAILABLE — the Browser pane is not displayed in this session, so verification was by live computed DOM/navigation state; the owner's verify round should still LOOK at both surfaces. Pre-existing + out of scope, observed: the Plotly chart does not mount in the SPA at all (HtmlRenderAdapter.Render is the only emitter of the bundle tag; BuildEntryShell never emitted it) — the ADR 0013 text twin IS present, which is the contract; that gap is 20.7/22.4's. DEVIATION RECORDED: worked directly on `main`, not a branch/worktree as Task 1 says, per CLAUDE.md § Concurrent work ("isolation is not available and is not the fix") — branching a shared tree would capture another session's auto-committed work; no reset/checkout--/clean was ever run and every edit was grep-verified after writing. SUITE 2427 passed / 0 failed / 3 skipped (baseline 2405/0/3, +22 tests); the 3 skips are the pre-existing symlink-privilege tests. GOLDEN FINGERPRINT UNCHANGED at 2050b586… (not regenerated) — that is what makes "the static site's bytes are unchanged" a measurement. One intermediate run showed 2 failures (BurstOfSaves, GitInsights hub) — both pass in isolation, did not recur, are named members of 23.2's rotating file-write-contention flake, and touch no symbol in this story's File List. PRIOR: create-story 2026-07-25 (baseline cd7f302). Story file 22-2-canonical-ir-schema-and-versioning.md; its 7 ACs SUPERSEDE epics.md's 3 (Task 10 records that drift in epics.md + here, per CLAUDE.md). THREE OWNER DECISIONS locked at elicitation: (D1) PROMOTE spa/ IN PLACE — spa/manifest.json + spa/pages-*.json BECOME the canonical IR, extended not replaced; no new ir/ dir and NO RENAME (that is 22.4's call), so the 5-anchor defect gets fixed where it lives and there is never a second capture path. (D2) PER-PAGE HASH + OVERSIZED-PAGE CAP — manifest gains contentHash + bytes per page so 22.5/22.6 can diff at page granularity; ADDRESSING ONLY, no delta transport, no client change, no incremental-route change. (D3) 22.2 PROPOSES THE ADR — new ADR 0016 (0001-0015 taken) amending ADR 0008 §Decision 1, because 23.1's owner-directed HARD REQUIREMENT (the IR must carry Markdig-rendered prose HTML as strings) contradicts that clause's "view models plus pre-rendered SVG chart fragments" and was recorded ONLY in a spike report; ADR 0013 §5 already amended the SVG half, so the prose half is the remaining gap — a cross-cutting contract change, so CLAUDE.md's ADR-trigger rule applies. ⚠️ epics.md AC #2 is STALE — do NOT implement the byte-blind chunker; the 2 MB cap ships (SpaDelivery.cs:56) and the ONLY real gap is a single page over the cap still producing an over-cap chunk (3.08 MB measured vs a 2 MB guard). ROOT CAUSE of the 5-anchor defect, verified at cd7f302: static passes CodeItemHref (SiteGenerator ≈:3226) but the SPA (≈:3051) and webview (≈:2784) BuildIndexPage calls use NAMED ARGS starting at `counts:`, silently skipping the positional codeItemHref → Charts.GitPulsePanel(pulse, null) → CodeItemLink degrades to plain text; one-arg fix at each site, but the webview needs a link-target check because CodeItemHref can return an EXTERNAL url. NEW FINDING for the island-declaration work: the webview's JsonDataIsland regex strips only `<script type="application/json">`, so the Story 20.5 EXECUTABLE inline handshake script (HierarchyExplorer.cs:349) is NOT covered — dev must verify whether it reaches the webview unhandled. Nav-context fix has no path→NavLocalContext resolver (built inline at ≈:1123/1313/1566/2095/4072 and discarded), so recommended route is slicing the page's own `<nav class="site-nav">…</nav>` out of _spaCapture minus NavToggleScript, preserving the AD-1/AD-2 no-disk-readback boundary. # PRIOR: FOLD-IN from Story 23.1 (owner-directed 2026-07-23, dev-story): the 23.1 spike consumed the shipped SpaDelivery form as a PROXY IR and measured it against the static golden output, surfacing TWO things 22.2 must absorb when it generalises the capture. (1) A LIVE FIDELITY DEFECT, not a design question: the SPA capture DROPS 5 anchors from the dashboard's git-pulse panel — 3 of them `code/*.html` links (`<a href="code/tests/…/SiteGeneratorAdapterTests.cs.html">` renders as plain text in the capture but is hyperlinked in the static page). Golden `<main>` has 553 anchors, the IR 548; this is the entire 277-byte dashboard parity delta, and it silently degrades the SPA and webview surfaces TODAY. Owner chose to fold the fix into 22.2 rather than patch SpaDelivery standalone. (2) WHAT THE FRONT END WISHED THE IR CARRIED (23.1's stated input to this story): a structured head/meta projection (title, description, og tags) so a consumer need not re-derive it; the page-local nav context band (`site-nav-local-context`) that the static renderer computes but the capture discards, replacing it with the generic key-views nav; and an explicit declaration of which embedded `<script>` islands a consumer must strip or nonce (the dashboard carries SpecScribe's own 20.9 KB `sunburst-explorer-data` island, which the webview already strips by hand). ALSO STILL BINDING from 22.1: proceed RE-SCOPED — the byte-cap is already shipped (SpaDelivery.MaxChunkBytes=2MB), so aim at PAGE-LEVEL delta granularity + capping oversized pages. See 23-1-spike-report.md §"Follow-ups outside this story" and 22-1-spike-report.md.
