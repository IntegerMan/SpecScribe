  20-2-zoomable-drill-in-sunburst-navigation: done # code-review 2026-07-24: review → DONE. 3 parallel adversarial layers + live-browser verification on the real generated site; scoped by File List (siblings 21.3/23.1/24.1/5.1 excluded from the shared b8be08d..HEAD range). 2 owner decisions + 22 patches, ALL APPLIED; 0 deferred, 1 dismissed. The core engineering guarantee HELD on verification — payload↔SVG anti-drift confirmed live (wedge count == node count, zero drift either way), zoom-out restores every wedge's server `d` exactly, client arc re-layout lands on the right rings, and the JS budget claim was accurate to the byte (231 code lines / 10,909 B, ES5-clean). Defects clustered in the interaction edges. HIGH: (1) **Space activated nothing on ANY wedge and threw** — `a.click()` on an `SVGAElement`, which has no `.click()`; `preventDefault()` ran first so the key was swallowed too. AC #1 names Space explicitly and leaves open via the same path, so AC #2's keyboard route was broken as well; the dev pass only ever tested Enter, and "zero console errors" was therefore false. (2) **The SPA explorer was dead after ANY client-side navigation** — specscribe-spa.js swaps regions via innerHTML with no re-init hook (the exact failure HostRenderExceptions already records for Mermaid), and the new SPA test asserted only markup survival while its comment claimed live parity. Owner chose FIX-IN-20.2 → new `specscribe:content-swapped` seam + `data-explorer-ready` guard; verified end-to-end (navigate away → back → drill still works). (3) **The text twin went stale on drill** — legend still advertised statuses with zero visible wedges and `aria-label` never changed; under ADR 0013 the twin IS the contract. Owner chose FILTER-TO-SCOPE; implemented so legend presentation stays PURE CSS (script publishes `data-sb-scope`/`data-tok-*` only), which KEEPS the Story 3.5 `Script_DoesNotImplementLegendEmphasis` contract intact rather than weakening its guard — new paired `Stylesheet_HasDrilledLegendScopeRules`. MEDIUM: modifier-click hijacked (open-in-new-tab zoomed instead — repo already had the guard idiom in specscribe-spa.js); payload `kind` implied the WRONG RING for orphan/unplanned aggregates (server draws them on the story band, client mapped them to the aggregate band ~55px out) → `Ring` promoted to an explicit payload fact that 20.3's edge-join inherits; duplicate `data-node-id` stranded a wedge un-restorable (story ids are heading-derived with NO dedupe — fixed both sides); `#sb=constructor` and `#sb=100%` threw uncaught on the popstate path (prototype-less maps + guarded decode); duplicate history entries made Back need several presses; orphan/unplanned open-done arithmetic was COPIED not extracted, the one thing 20.1's seam note forbade; and the anti-drift invariant never once constructed a FollowUpGeometry/UnplannedWorkGeometry, so every branch it could actually drift on was untested. LOW: unrelated URL fragments erased on zoom-out; a 2.12px seam the server's pad:0 never has; island id constant unused by its own client; `size` coupled only by matching defaults; label phrasing drift; `epics.html` shipped 116 dead join hooks (~2.5 KB) — now opt-in via `nodeIds:`; webview island strip registered as a `data-island` host exception with its incorrect CSP rationale corrected (a JSON data block is never executed, so script-src never applied). LIVE-BROWSER CAUGHT WHAT THE SUITE COULD NOT: an SVG `<a>` at display:none stays focusable, so each drill left a phantom tab stop on an invisible wedge. Tests 7 → 24; golden regenerated `aaef12dd…` → `1711700e…` (stable across 2 runs, on a tree also carrying another session's in-flight 5.2 settings work — see CLAUDE.md shared-main). Full suite 2225 passed / 3 skipped; two git-fixture tests flake under parallel load (a DIFFERENT one each run, both green in isolation) — pre-existing, worth its own pass. prior: create-story 2026-07-22: zoom/drill-in half of Epic 20's explorer — makes the dashboard Charts.Su