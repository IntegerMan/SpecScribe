  16-1-release-and-distribution-packaging-spike: review # dev-story 2026-08-07 (worktree-story-16-1-dev, executed at 838d591; story frontmatter baseline_commit 7ff3b13 PRESERVED — main advanced one merge between create-story and dev-story): ready-for-dev -> in-progress -> review. Decision-only spike; NO product code (git status under src/, tests/, web/, extension/ empty; the temporary csproj pack item was reverted and the revert VERIFIED, not assumed). Deliverables = 16-1-spike-report.md + ADR 0040 (Proposed) + one docs/adrs/README.md index line. THE LOAD-BEARING QUESTION IS ANSWERED EMPIRICALLY ON TWO CHANNELS: a `renderer/**` payload packed at tools/net10.0/any/renderer/ lands beside the executing assembly in the dotnet-tool store, AppContext.BaseDirectory resolves there, and `generate` runs to errors=0 (373 routes @ 4.9 ms/route) FROM A FOREIGN REPOSITORY with SPECSCRIBE_RENDERER_DIR unset; PublishSingleFile does NOT move AppContext.BaseDirectory away from a sibling renderer/ (errors=0, 5.0 ms/route) — the case R2 permitted to be left unmeasured is MEASURED. The observed BaseDirectory was obtained by a NEGATIVE CASE (rename the artefact away, read the tool's own error), which is simultaneously the proof the probe repo was genuinely foreign: candidate 3 (web/.output in the repo) did NOT rescue it, so no false pass. COST MEASURED: nupkg 2,515,650 -> 3,757,359 B = +1,241,709 B (+49.4%) for a 3.96 MB / 187-file artefact (23.5's 3.78 MB / 185 REFRESHED, not corrected — this figure has now moved twice, so 16.3 must derive it); single-file exe 79,742,177 B / 76.0 MiB vs ADR 0006's 73.0; artefact gzipped tarball 1,157,973 B. npm shape decided from a MEASURED property (0 native bindings, 0 platform binaries): ONE SHARED specscribe-renderer package, never per-RID — 1.10 MB once vs 5.50 MB across five RIDs; the end-to-end npx install is left explicitly UNMEASURED and seated on 16.8. PREVIEW CUT = dotnet tool -> npx -> self-contained binaries, RID matrix THREE (win-x64/linux-x64/osx-arm64), eleven non-goals named. THE CREDENTIAL FINDING CHANGED A DECISION: R3 called the VS Marketplace PAT "dated" with a 2026-12-01 deadline; live verification found the operative date is 2026-03-15, when Azure DevOps blocked CREATION AND REGENERATION of global PATs — and vsce requires exactly that shape ("All accessible organizations" + Marketplace (Manage)), so for anyone not already holding a pre-March token there is NO PAT PATH AT ALL. VSIX therefore drops OUT of the preview cut and 16.5 targets an ORGANIZATION-owned publisher with Entra federation (vscode-vsce#1023: federated SPs fail on PERSONALLY-owned publishers, closed not_planned — which is why org-vs-personal is decided now, not at 16.5). nuget.org + npm both Trusted Publishing, so AC #2's "no secret committed" is STRUCTURAL for both shipping channels, with one caveat carried deliberately: nuget.org TP is still a GRADUAL ROLLOUT and if it is not visible on the owner's account the NuGet channel falls back to a stored key — CONFIRM BEFORE 16.4 STARTS. All four package IDs re-verified 404 on 2026-08-07 (incl. specscribe-win32-x64); five-name set + per-registry fallbacks recorded. Versioning: 0.MINOR.PATCH-preview.N via MinVer (Nerdbank + -p:Version= both rejected with reasons), <Version> DELETED not replaced; the pre-release label is load-bearing because AboutTemplater.cs:133-135 renders the Preview badge from it; CLI<->renderer pinned as one unit — structural on two channels, EXACT pin (=X.Y.Z, never ^) on npm, which is the rule 16.9 AC #2 inherits. Keep a Changelog 1.1.0, hand-authored per story (generated notes rejected BECAUSE commits here bundle stories). NFR9 claims the WEAKER reading explicitly. THREE FINDINGS RAISED NOT PATCHED: (1) EpicsIndexSurface.vue HARD-THROWS when the epics index has no child pages, so any project SpecScribe cannot extract epics from generates errors=1 with no epics.html — reproduced twice, the same class as 23.5's DashboardSurface.vue, and the first thing a thin/non-BMad external adopter sees; routed to 23.3, GATING 16.7. (2) NuxtPrerender.FindRepoRoot tests Directory.Exists(".git") but in a worktree .git is a FILE (56 B, measured), so it walks past the worktree root — observed resolving C:\Dev\SpecScribe\web\.output from inside a worktree; developer-path only but NEWLY REACHABLE, and CLAUDE.md's "worktrees are unavailable on this machine" is now STALE (five are live; the last four commits on main are worktree merges). (3) `npm ci` FAILS on a clean checkout at 838d591 (Missing: @emnapi/runtime@1.11.3 from lock file) and three CI steps depend on it, breaking even the weak NFR9 reading — but CI's real status is UNVERIFIED (gh is not installed here) and CI pins Node 24.11.1 vs this session's 24.18.1, so it may be npm-version-specific; recorded as unverified-on-CI, routed to 16.2. ADR NUMBERING: 0039 was NOT free (Story 4.9 claimed it 2026-08-06) — the ADR is 0040; 0019 stays claimed-but-unwritten by 18.3. GATE DISCIPLINE: check:ir-content went red TWICE and NO baseline was regenerated — first an environmental precondition (fresh worktree has no IR), then +4/-185 from a generate without --deep-git, the exact signature build-test-analyze.yml:281-290 documents in advance as +4/-182; following the gate's own suggested fix would have DELETED 185 deep-analytics rules and turned it green over a real regression. Regression floor: dotnet test 2962 passed / 1 failed / 3 skipped (FileWatcherServiceTests timing flake, 11/11 green on isolated re-run, no product code changed) and all four web gates OK incl. check:parity 24 routes / 14 families byte-identical. NO STRUCTURAL SCOPE CHANGE, so epics.md and this file needed no structural edit — recorded explicitly so the absent epics.md diff reads as a decision. ⚠️ AC #4 IS NOT FULLY CLOSED: ADR 0040 is authored, indexed and complete but stands at Proposed; AC #4 requires it RATIFIED while the story's own § Owner actions item 5 assigns ratification to the owner — the one AC the implementation cannot close by itself, surfaced at hand-off rather than absorbed. prior create-story 2026-08-06: decision-only spike, no product code. Scope RE-CENTRED at seeding, because ADR 0006 (Accepted) + ADR 0022 (Proposed) have already settled most of the seeded AC #1 — dotnet-tool, self-contained per-RID binaries, npx and VSIX are all decided channels, and ADR 0022 §Decision 5 already fixes each channel's Node posture (standalone binary requires Node as a documented prerequisite, owner decision 2026-07-27). What is NOT decided, and is where the box should go: (a) HOW THE RENDERER ARTEFACT RIDES INSIDE A PACKAGE. `NuxtPrerender.ResolveArtefactDirectory` probes `renderer/` beside the executing assembly and its own doc comment (NuxtPrerender.cs:68) calls that "the Epic 16 packaging shape" — the resolution logic exists and NOTHING populates it, so the story adds AC #5 requiring a real `dotnet pack` + `--tool-path` install + a generate RUN FROM A DIFFERENT REPOSITORY with SPECSCRIBE_RENDERER_DIR unset (running it in this repo lets the third candidate, web/.output at the repo root, succeed and report a false pass). 16.3, 16.8 and 16.9 all block on that answer, and 16.9's epics.md entry says so explicitly. (b) which channels are in the preview CUT and in what order. (c) AC #1's explicit non-goals. CREDENTIAL INVENTORY IS OUT OF DATE IN THE SEEDED AC and was re-verified live 2026-08-06: nuget.org and npm now both support TRUSTED PUBLISHING (OIDC), so those two channels need NO stored secret at all — NuGet/login@v1 exchanges a GitHub OIDC token for a 1-hour single-use key; npm went GA 2025-07-31, needs npm CLI >=11.5.1, publishes provenance by default, must NOT set NODE_AUTH_TOKEN, and policies created after 2026-05-20 must explicitly select allowed actions. The VS Marketplace is the dated risk: Azure DevOps retires global PATs 2026-12-01 (~4 months out) and microsoft/vscode-vsce#1023 reports --azure-credential federated service principals FAILING publish on a personally-owned publisher, closed not-planned — so personal-vs-organization publisher ownership must be chosen before 16.5 wires anything. Both package IDs verified UNCLAIMED the same day (nuget.org registration API 404, registry.npmjs.org/specscribe 404): reserving them is an OWNER action the spike inventories, not a dev-agent action, and the story carries an explicit § Owner actions list (reservations, two trusted-publishing policies, Marketplace publisher, ADR ratification, any signing cert). Two seeded premises corrected: 23.5 open item 3 ("Node detection + actionable error") is only PARTLY open — 23.6 shipped SupportedNodeRange + the assertion + the actionable message, and what remains is placement (ADR 0022 §5 says "at startup"; the shipped check runs at prerender time) plus consumer-facing surfaces, the latter routed to 16.6; and GoldenContentFingerprint is retired (ADR 0034 / Story 23.6) so the regression floor is `dotnet test` + `npm run check` incl. check:parity. NFR9 reproducibility is scoped rather than assumed — 23.5 open item 6 left it "unowned, named so it is inherited knowingly", and this is where it gets an owner: <Version> is a hand-edited literal (csproj:19), no workflow sets SOURCE_DATE_EPOCH though the csproj honors it (csproj:35-41), and there is no <Deterministic>. Story adds AC #4 (ratified ADR, next free number likely 0039 — 0019 stays claimed-but-unwritten by 18.3, VERIFY) and AC #6 (scope guard). Four existing version numbers must all be covered by the policy, incl. the About page's Preview badge which is driven by pre-release-ness (AboutTemplater.cs:133-135) and a hard-coded 0.1.0-preview literal inside README's published CI recipe (README.md:260). 16.2's required-check string is the job name verbatim, `build-test-analyze`; portability-probe must NOT be required.
  16-2-continuous-integration-build-and-test-gate: in-progress # dev-story 2026-08-07 (worktree-story-16-2-dev, executed at 07bdb79; story frontmatter baseline_commit 35437b9 PRESERVED — main advanced FIVE commits between create-story and dev-story and TWO OF THEM DID THIS STORY'S WORK): ready-for-dev -> in-progress. ⚠️ NOT `review` — 7 of 8 tasks are complete and TASK 6 IS BLOCKED ON THE OWNER: `POST /repos/IntegerMan/SpecScribe/rulesets` was REFUSED BY THE SESSION PERMISSION LAYER (twice) as a write to live repository settings; the token is sufficient (permissions.admin true), the block is environmental, and it was NOT routed around. So AC #1/#2/#5 remain open and `main` is still `protected: false` with `rulesets: []`. THREE OF THE STORY'S PREMISES WERE ALREADY STALE AND WERE RE-MEASURED, NOT ASSUMED: (a) R2's "origin/main is RED at 838d591" — run #78 at 07bdb79 is GREEN, all steps; (b) R4/AC #3's "npm ci fails" — already repaired by 0b1f561, so AC #3 was closed by VERIFICATION (npm ci really installed 639 packages in 27s on npm 11.16.0 here, and step `Install web dependencies` is success in run #78 under .nvmrc's pinned Node 24.11.1/npm 11.6.2; committed diff is +18/-24 with exactly ONE added package and ZERO version/resolved churn); (c) R3/Task 4's prescribed fix (JsonException in Evaluate) — ALREADY LANDED by 48c050c AND PROVEN INSUFFICIENT. THE FLAKE'S REAL ROOT CAUSE, found by measurement not reasoning: with JsonException swallowed the same race just failed differently, as a MUTE 20s TIMEOUT. A failure-path-only `Diagnose` helper (deliberately `if (!WaitFor(...)) Assert.Fail(...)`, never `Assert.True(cond,msg)` whose message evaluates eagerly on every pass) caught it — `route in IR: False` plus a generator Error "cannot access pages-root.json because it is being used by another process". `SiteRegion.ReadShared` opened FileShare.ReadWrite, which admits a concurrent reader and writer BUT NOT A CONCURRENT DELETER, and GenerateAll wipes the output root (Directory.Delete recursive) before repopulating; the test's own poll handle made that wipe fail, the pass aborted PART-WAY THROUGH THE WIPE, the route vanished from the IR, and nothing retried — STUCK, NOT SLOW, which is exactly why widening SettleTimeout would never have helped and why the story was right to forbid it. FIX: `FileShare.ReadWrite | FileShare.Delete`, in ONE layer (Read/Exists/Routes/HasRoutesUnder all funnel through ReadShared; Evaluate keeps its guard as the complementary half). MEASURED BEFORE: 1 failure in 16 loaded iterations, 1 in 40 focused, and 1-IN-1 IN A PLAIN UNLOADED FULL-SUITE RUN. AFTER: 25 consecutive loaded iterations 0 failures, two clean full-suite runs at 2978 passed / 0 failed / 3 skipped (16.1's floor was 2962/1/3; this tree before the fix was 2977/1/3 — the pass count moved by EXACTLY the one flaky test, so AC #6 holds). check:parity 24/24 routes / 14/14 families byte-identical; check:tokens and check:assets OK. ALSO CORRECTED: 48c050c calls this "the Linux-only transient state", but RUN #74 IS A WINDOWS RUN with the identical exception — FileShare.ReadWrite is precisely what removes the locking that argument depends on. TASK 3 CLASSIFICATION REFRAMES THE HEADLINE: all 27 failures + 1 cancelled classified from job logs — 20 genuine-regression-since-fixed, 5 environmental, 1 cancelled, and only 2 LIVE-FLAKE (runs #74 and #75, the same defect). The "fails ~1 push in 3" figure is a historical FAILURE rate, NOT a flake rate. Of the 10 drift-gate failures: 1 check:assets, 7 real drift, and 2 (#58 +4/-180, #62 +4/-182) the documented --deep-git corpus signature whose structural cause was in the WORKFLOW not the gate and is ALREADY FIXED by f7e812f; #67's +181/-4 is its mirror, i.e. the CLAUDE.md trap actually happening on a sibling branch. NO BASELINE WAS REGENERATED ANYWHERE: check:ir-content went red locally at +1/-1368 and was proven ENVIRONMENTAL first — this worktree has NO SpecScribeOutput/ at all, extract prunes any selector absent from the IR, neither gate input is modified, and CI runs it green (#78/#79) because CI generates with --deep-git. Regenerating would have deleted ~1368 live rules behind a green gate. FINDING F1 RAISED NOT FIXED (src/** is out of scope per AC #6): a generation pass that fails transiently is NEVER RETRIED and can leave the output root incoherent — asymmetric with the DIRECTORY watcher, whose Error handler already forces a fallback rebuild for exactly this hazard (FileWatcherService.cs:207-215) while the file path only logs (:242-243); real `specscribe watch` impact, routed to EPIC 6, needs a named story. F3: `gh api .../jobs/{id}/logs` DOES NOT WORK (terminal escape sequences); use `gh run view <run> --job <job> --log`; gh is installed but NOT on PATH; --jq string literals need \" escaping under PowerShell — all three matter for 16.3/16.4. AC #5's "before" half IS captured: PR #7 (branch ci/ruleset-block-proof, deliberately-red build-test-analyze at run #80) reports mergeable MERGEABLE / mergeStateStatus UNSTABLE, i.e. a red required check does NOT block a merge today; re-query after applying and it must become BLOCKED. .github/rulesets/main-required-checks.json was DELIBERATELY NOT CREATED — AC #5 requires the EXPORTED LIVE object and the admin actor_id is the very literal the story forbids guessing, so committing a hand-authored file there would assert an unverified id and read as the applied config; the candidate payload is recorded in Task 6 instead. Also NOT modified: web/package-lock.json (already repaired). Docs: docs/CiGate.md NEW (required context is the JOB name; portability-probe must never be required — MEASURED at runs #63 AND #75 where a failing step sat inside a job reporting success; admin bypass; strict policy false; GitHub does NOT read .github/rulesets/; Pages independence; ADR 0040 §9 tag-inheritance query), cross-referenced from docs/SonarCloudSetup.md. DISCLOSURE: AC #6's allow-list names docs/CiGate.md specifically and SonarCloudSetup.md was also edited, because Task 7 instructs it — task-sanctioned but outside the literal list, called out rather than hidden. NFR9: exactly ONE of ADR 0040 §7's three gaps (`npm ci`) is closed and not even by this story; SOURCE_DATE_EPOCH (16.4), version-from-tag (16.3), Deterministic/SourceLink (deferred) all remain — no broader claim made. NO STRUCTURAL SCOPE CHANGE and NO NEW ADR, recorded explicitly so the absent epics.md diff reads as a decision. OWNER OWES: apply the ruleset (or create it in the web UI, which sidesteps the actor_id guess), verify the bypass via `gh api repos/.../rules/branches/main` returning EMPTY, re-query PR #7 for BLOCKED, GET the ruleset back and commit it + replace the <id> placeholders in CiGate.md, close PR #7 and delete ci/ruleset-block-proof, and merge worktree-story-16-2-dev. || prior create-story 2026-08-07 (worktree-story-16-2-create, authored at 35437b9 = local main; ALL CI facts measured against origin/main at 838d591, which is two commits behind): backlog -> ready-for-dev. THE SEEDED ACs ASSUME A GATE THAT NEEDS A CHECKBOX FLIPPED; IT NEEDS THREE THINGS FIRST, AND THE ORDER IS LOAD-BEARING. Measured live via the public GitHub REST API (no auth, 60 req/hr): (1) `main` has NO branch protection and NO rulesets — `branches/main` returns protected:false with enforcement_level "off", `rulesets` returns [] — so this is a greenfield apply, nothing to migrate; 25.1's handoff is still accurate and nothing has happened since. (2) ⚠️ THE GATE IS NOT GREEN AND NEVER RELIABLY HAS BEEN: 27 of 74 runs failed (~36%), 17 of them pushes to `main`, and RUN #74 AT 838d591 — the current tip of origin/main — IS RED. Failing-step taxonomy taken from the platform's own step-level `conclusion` (the /jobs endpoint is public; /logs is 403 unauthenticated): `Test` 13 runs (1,11,12,13,24,33,47,48,49,59,60,61,74), `Check web drift gates` 10 runs (30,35,36,40,51,58,62,63,67,68), `Generate the IR` 1, `SonarScanner end` 1, `Build` 1. NOT all flakes — runs 11-13 sit in the line-ending era .gitattributes was written to close and run 18 predates 25.1's code-review `continue-on-error` — so AC #4 requires CLASSIFICATION per run, not an assumption. A required check that fails 1 push in 3 is a tax that teaches people to route around it, so "green baseline" became a DELIVERABLE (AC #4) rather than an assumed precondition. (3) THE `Test` FLAKE IS ROOT-CAUSED IN THIS STORY, NOT LEFT AS A HUNT: `SiteRegion.ReadShared` opens with FileShare.ReadWrite (SiteRegion.cs:279) — correct, it stopped the test locking the chunk the generator was writing and fixed BurstOfSaves — and THAT FIX IS WHAT CREATED THIS ONE, because a non-contending reader now SUCCEEDS against a mid-write file and returns partial content; Read/Exists/Routes feed it to JsonDocument.Parse (:44,56,66,76) which throws JsonException; and FileWatcherServiceTests.Evaluate (:149-154) — the guard whose whole purpose is to make a mid-rebuild poll mean "not yet" — catches IOException and UnauthorizedAccessException only. JsonException derives from neither, so it escapes WaitFor and fails the test. SettleTimeout is ALREADY 20s and every wait already polls the outcome, so widening it is explicitly forbidden. FileWatcherServiceTests.cs is the ONLY test file using Thread.Sleep/Task.Delay (grepped). (4) 16.1'S `npm ci` BLOCKER: CI IS **NOT** AFFECTED — the unverified-on-CI item is now VERIFIED and the framing flips. CI pins Node 24.11.1 -> npm 11.6.2 and run #73 (7ff3b13) shows "Install web dependencies" GREEN on BOTH Windows and Ubuntu; this machine runs Node 24.18.1 -> npm 11.16.0 and fails. So the lockfile is NOT what makes CI red — `Test` is, and the two must not be conflated. Still a real defect (a contributor on a Node version web/package.json's own engines field permits cannot run `npm ci`) and ADR 0040 §7 names it as 16.2's. ROOT CAUSE ISOLATED: @napi-rs/wasm-runtime@1.1.6 declares peers @emnapi/core ^1.7.1 AND @emnapi/runtime ^1.7.1 (lock:1254-1257), the lockfile carries top-level @emnapi/core@1.11.3 (:570) but NO top-level @emnapi/runtime at all. FIX PROVEN MINIMAL, not asserted: `npm install --package-lock-only` against a scratch COPY produced a 69-line diff = the one missing package + an `engines` mirror the lockfile has lacked since 23.5 + `"peer": true` recomputation; ZERO version bumps, ZERO resolved-URL churn, and anything larger must be reported not committed. (5) THREE OWNER DECISIONS TAKEN AT CREATE-STORY AND LOCKED: ruleset + repo-admin bypass (the owner ships by local merge + direct push to main — the last five commits are merge commits pushed straight there — so full enforcement would break their workflow); DIAGNOSE AND FIX the flakes, with retry-steps and quarantine-now BOTH EXPLICITLY REJECTED; and install `gh` with the owner doing `gh auth login` once (logs are unreadable without it, and 16.3/16.4 need it too). (6) THE RULESET HAS ONE TRAP AND THE STORY REFUSES TO GUESS PAST IT: bypass_actors requires a numeric actor_id for RepositoryRole, GitHub's REST reference NEVER STATES the admin role's id, OrganizationAdmin does not apply to a user-owned repo, and public values disagree — so the story mandates create-in-UI-then-GET-and-commit rather than a hand-authored literal, which also yields AC #5's reviewable .github/rulesets/main-required-checks.json. Bypass verified EMPIRICALLY in both directions (direct push still lands; a red PR cannot merge), never by reading settings. Required context is the JOB NAME VERBATIM `build-test-analyze`; `portability-probe (ubuntu, non-gating)` must NOT be required and the reason is now MEASURED not just documented — run #63 shows its `Test` step FAILED while the job reported success, so requiring it would be a check that cannot fail. No second build+test workflow (epics.md AMENDED 2026-07-25). NO STRUCTURAL SCOPE CHANGE and NO NEW ADR — recorded explicitly so the absent epics.md diff reads as a decision; ADR 0040 §9 already decides the tag/gate relationship and a ruleset that enforces a ratified decision is not itself an ADR trigger. Six ACs: #1/#2 epics.md verbatim, #3 npm ci under BOTH toolchains, #4 classify-and-fix + two consecutive green runs before enforcement, #5 exported+committed ruleset with empirical bypass proof, #6 scope guard (tests/, web/package-lock.json, .github/, docs/CiGate.md only). NFR9: this story closes exactly ONE of ADR 0040 §7's three gaps (`npm ci`); SOURCE_DATE_EPOCH is 16.4's, version-from-tag is 16.3's, Deterministic/SourceLink stay deferred — the completion notes must not claim more.
