line 811ba17): backlog -> ready-for-dev. Its 8 ACs SUPERSEDE epics.md's 3; recorded in epics.md § Story 22.5 in the SAME change per CLAUDE.md. THIS IS A CORRECTNESS STORY, NOT A PERFORMANCE ONE — the latency case is already won (3×–84×, measured by 22.1) and the 22.1 gate says "RE-SCOPE (required)". HEADLINE: `RegenerateEpics` is NOT oracle-faithful at NO-OP (56 stale pages; Epic 1 renders 16 items/20 links incrementally vs 13/12 from a full regen), so `specscribe watch` shows a different, inflated work-graph than `specscribe generate` until restart — a LIVE SHIPPED DEFECT, independent of the IR pivot. ROOT-CAUSED IN CODE at 811ba17: `ResolveFollowUpWork` (SiteGenerator.cs:4542) does `WorkInventory.Build(_docs.Values)` FIRST and only falls back to source conversion when that is empty — `GenerateAll` CLEARS `_docs` at :214 and builds `_workGraph` at :247 (source-fallback inventory), while `RegenerateEpics` runs `SyncDeferredDocFromDisk` at :754 and builds it at :767 with `_docs` FULLY POPULATED from the prior build (docs-derived inventory). Same function, two inputs. FOUR OWNER DECISIONS 2026-07-28: (D1) 22.5 is GATED ON 22.4 — 22.4's AC #5/Task 3 fixes the SAME `_docs`-ordering seam and shares one WorkInventory across RenderEpicsPages/BuildSpaBundle/RenderWebviewSurfaces, so Task 1 RE-MEASURES the gap after it lands and the residue may be only the :247 build (which 22.4 does NOT touch, since it runs before nav); DO NOT START until 22-4 is done. (D2) CORRECTNESS FIRST — epics.md AC #1's "and re-emitted" half is NOT in scope: `EmitSpaSite` already rewrites the WHOLE manifest + every chunk on every route (:554/:573/:599/:715/:788/:1039) and KEEPS doing so; selective emission is 22.6's, using the per-page contentHash+bytes 22.2 already shipped for it. Adding it here would stack a SECOND silent-staleness class on top of the recompute defect. (D3) FIX PARITY, THEN KEEP THE NARROW EPICS ROUTE — full rebuild escalates for TOPOLOGY only; a story-file save is the dominant edi