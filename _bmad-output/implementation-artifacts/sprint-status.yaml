  18-1-bmad-module-landscape-and-coverage-spike: done # -> done 2026-07-26 (owner accepted after the code-review patch round). dev-story 2026-07-25: spike complete, NO src/tests changes — deliverable is the coverage map in Completion Notes. The create-story hypothesis was HALF WRONG in the load-bearing direction: detection is NOT already generic. ModuleContext.BuildContext:346-348 infers the module from the SKILL PREFIX, and every first-party BMad module except GDS prefixes its skills `bmad-` (verified against the real module-help.csv of cis/tea/bmb/gds/bmm), so a CIS/TEA/BMB-only repo is silently identified as BmadModule.BmadMethod and served BMM's ENTIRE glossary — unconditionally on how-to-read.html AND site-wide via AbbreviationExpander (module DOCS are safe: SiteNav:206-215 file-gates them). Proven empirically with a scratchpad probe over 8 fixtures, not by inspection. Same root cause yields a live REGRESSION: with cis/tea ahead of bmm in manifest order, ChoosePrimary demotes BMM and ALL BMM command suggestions vanish while IsMethodPresent still reports True (contradictory portal state, install-order-dependent). Extend-vs-registry ANSWERED: extend — Epic 18 is the ONE framework epic that does not need the registry (AppliesTo markers `_bmad/` wholesale, so a 2nd adapter would have an identical AppliesTo); no competing ADR. Difference #3 resolved: the ideation skills are BMM/Core-native, and CIS ships Core's own `bmad-brainstorming`, so CIS is LESS novel than hypothesized. GDS re-confirmed CORRECT after checking the real module against docs advertising `/bmgd-*` (module.yaml says `code: gds`; BMGD is branding) — but repo tests use synthetic gds-* fixtures and would not have caught a divergence. PRIORITY: identity fix FIRST, then TEA (structured traceability-matrix.csv + nfr-report.md overlapping SpecScribe's existing 21.1/9.2 surfaces); CIS deferred (its output already renders via the generic pass — near-zero marginal value); BMB non-goal for rendering BUT drives