ould have shipped unstyled on a real GSD site; fixed via the existing CONDITIONAL_CLASSES seed (same seam as the sunburst-black-fill incident) and pinned in ir-content-harvest.test.mjs. EVERY remaining framework epic will hit this. Two pre-existing issues found and REPORTED not patched: (F2) Nuxts crossorigin attribute makes the portal render fully unstyled from file:// in Chromium (NFR-3/ADR 0012), found because the first live-browser run reported 19 style failures that vanished over HTTP; (F5) ADR 0037 is missing from docs/adrs/README.md. Watch-test flake investigated and proven NOT this storys (varying test, 3/3 isolated, pristine-HEAD bisect green). ir-content.css regenerated THREE times: run 1 (no --deep-git) silently removed 1557 lines with the gate green, run 2 added false-drift .status-badge.diag-error from an unbuilt renderer, run 3 correct (+7 selectors, 0 removed) and confirmed stable across two repeated runs. || create-story 2026-08-06 (baseline 9580f62): backlog -> ready-for-dev. FIVE owner decisions elicited up front, taken against a REAL GSD Core repo (C:/dev/CORA, a .planning/ tree of 168 files) instead of the vendor docs Story 12.1 was limited to -- and the live repo OVERTURNED several of 12.1's derived claims. Headline corrections: (1) phase numbers are DECIMAL in practice (02.1, 04.5, and backlog 999.1/.2/.3) while EpicInfo.Number is an int; (2) PLAN.md files carry NO markdown task checkboxes at all (tasks are <task> XML blocks and the `## Verification` boxes stay unchecked even on completed plans), so TaskListParser returns 0/0 and 12.1's "Task -> TasksDone/TasksTotal is not a compromise at all for Core" is FALSE -- the real completion signals are ROADMAP's `- [x] NN-YY-PLAN.md` checkbox and the presence of a sibling -SUMMARY.md; (3) requirement ids are project-defined prefixes (CONV-01, RAG-03, FUT-01 -- twelve distinct prefixes in one repo), NOT the documented REQ-001, and RequirementInfo.Id THROWS on an unmodeled kind; (4) REQUIREMENTS.md DOES