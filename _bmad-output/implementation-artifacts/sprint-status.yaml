rilledLegendScopeRules`. MEDIUM: modifier-click hijacked (open-in-new-tab zoomed instead — repo already had the guard idiom in specscribe-spa.js); payload `kind` implied the WRONG RING for orphan/unplanned aggregates (server draws them on the story band, client mapped them to the aggregate band ~55px out) → `Ring` promoted to an explicit payload fact that 20.3's edge-join inherits; duplicate `data-node-id` stranded a wedge un-restorable (story ids are heading-derived with NO dedupe — fixed both sides); `#sb=constructor` and `#sb=100%` threw uncaught on the popstate path (prototype-less maps + guarded decode); duplicate history entries made Back need several presses; orphan/unplanned open-done arithmetic was COPIED not extracted, the one thing 20.1's seam note forbade; and the anti-drift invariant never once constructed a FollowUpGeometry/UnplannedWorkGeometry, so every branch it could actually drift on was untested. LOW: unrelated URL fragments erased on zoom-out; a 2.12px seam the server's pad:0 never has; island id constant unused by its own client; `size` coupled only by matching defaults; label phrasing drift; `epics.html` shipped 116 dead join hooks (~2.5 KB) — now opt-in via `nodeIds:`; webview island strip registered as a `data-island` host exception with its incorrect CSP rationale corrected (a JSON data block is never executed, so script-src never applied). LIVE-BROWSER CAUGHT WHAT THE SUITE COULD NOT: an SVG `<a>` at display:none stays focusable, so each drill left a phantom tab stop on an invisible wedge. Tests 7 → 24; golden regenerated `aaef12dd…` → `1711700e…` (stable across 2 runs, on a tree also carrying another session's in-flight 5.2 settings work — see CLAUDE.md shared-main). Full suite 2225 passed / 3 skipped; two git-fixture tests flake under parallel load (a DIFFERENT one each run, both green in isolation) — pre-existing, worth its own pass. prior: create-story 2026-07-22: zoom/drill-in half of Epic 20's explorer — makes the dashboard Charts.Sunburst SVG zoomable (activate wedge → client-side arc RE-LAYOUT + child expansion + breadcrumb, keyboard/AT parity), degrading to the static Story 10.7 sunburst + 9.13 destinations (NFR8). Built against Story 20.1's RECOMMENDED defaults (20.1 still ready-for-dev/NOT executed — its Completion Notes empty; reconcile at dev-start). LOAD-BEARING insight recorded: sunburst drill-in needs angular arc re-computation (port AnnularSector/InsetStart/InsetEnd presentation math to JS), NOT the codemap's viewBox-pan (codemap rects are pre-rendered; sunburst children must expand to fill the ring). ONE inline JSON payload island {nodes:[{id,parentId,weight,label,statusClass,href,kind}], edges:[] (20.3 fills edges)} projected from the SAME EpicWeight/StoryWeight/FollowUpGeometry the SVG uses — no second geometry, no ProjectCounts recount, no authoring schema, no fetch (file://-safe). New guarded block in specscribe.js (opt-in via explorer root marker, mirror codemap idiom: motionFastMs/reduce-snap/role=button/renderCrumbs), ≤~8-10KB, ZERO deps (d3/Plotly = ADR fork, escalate). Zoom-vs-open rule: non-leaf wedge→zoom, leaf→open its 9.13 dest, center/crumb→zoom out, group dest via explicit affordance. NOT blocked on Epic 19 (that's the 20.3 pane). Golden fingerprint WILL move (new island/markup); RenderParity coverage owed. Epic 7 ownership/freshness sunbursts = separate follow-on, NOT this story.
