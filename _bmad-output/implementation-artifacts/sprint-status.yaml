  20-9-colorized-hierarchies-code-map-and-ownership: ready-for-dev # create-story 2026-07-26: seeded ready-for-dev, baseline 261b300 (tree was CLEAN at draft open — the first Epic 20 story for which that was true — and TWO other sessions landed work in it before this one finished; sprint-status.yaml itself changed under me mid-edit). THREE OWNER DECISIONS locked: (D1) the DIMENSION CONTRACT is a per-node METRIC BAG + a declarative per-dimension rule, not a precomputed class-per-dimension payload, because TWO of the eleven dimensions cannot be precomputed AT ALL — staleness takes a free 1-60 month threshold from a number input and spotlight takes an arbitrary contributor from a roster, so a baked payload would have to drop or freeze both; the bucketing math already lives in JS (specscribe.js:956 mirrors Charts.Bucket exactly), so this NAMES what ships rather than moving logic client-side, and every value in the bag is generation-time embedded (asof is the tree's most-recent commit day, never wall-clock — FR31). (D2) Code Map KEEPS its four filter panels and LAZY-MOUNTS ON REVEAL, because the pure-CSS exclude-spec/exclude-tests toggle is the one filter on that page that works with JS OFF, and collapsing to one instance + a client filter would buy bytes by taking information from a no-JS visitor. (D3) Git Insights takes the component's GENERIC NESTED TWIN — not a per-directory rollup (shorter and more readable, but it would not enumerate every node the chart draws, failing ADR 0013 §2 completeness) and not a restored per-file table (re-litigates a design Story 7.11 deleted on owner feedback). EIGHT CODE-VERIFIED FINDINGS none of the ADRs or sibling stories carry: (F1) THREE OF THE FOUR CODE MAP PANELS ARE ALWAYS display:none (specscribe.css:4222) AND PLOTLY CANNOT LAY OUT IN A ZERO-WIDTH CONTAINER — the component ships responsive:true (specscribe.js:1977) and sets only height (:2301), and a CSS-only reveal fires no resize event, so D2 REQUIRES a reveal hook on the two .codemap-filter-checkbox change events; the same pass collapses 8 Code Map charts to FOUR instances and 2 ownership charts to ONE, because the component's own selector also replaces .codemap-shape-* (:4321-4323) and .ownership-view-* (:6243-6245). (F2) tokenFor (specscribe.js:1799) composes only {fill,stroke} while FIVE states of the new families carry fill-opacity (.codemap-cell.level-0 0.35, .level-none/.type-other 0.55, .owner-author-other 0.55, .owner-spotlight-off 0.35) — they render at FULL opacity with no test able to see it — and THREE carry stroke-dasharray (.type-other, .owner-author-other, .owner-stale), a non-color channel marker.line cannot express, so PATTERN_SHAPE (:1790) must extend past its four sb-* keys; VERIFIED that a bare class-list probe DOES resolve both families (no rule needs an ancestor). (F3) the non-color channel here is TEXT REWRITTEN ON EVERY SWITCH — per-node accessible names plus a legend swap — not hatching; a dimension whose fill changes and whose aria-label does not is a UX-DR17 failure that ships green, and the shipped wording's honesty must be ported verbatim (bucket LEVEL not raw value; "not among this file's most-active tracked contributors" not the stronger false claim; explicit "(date unknown)" never coerced into the oldest bucket). Same area: .ownership-legend[hidden] (:6329) exists ONLY because display:flex (:6316) ties the UA [hidden] rule and author CSS wins — any new legend inherits that. (F4) TWO HASH SCHEMES — Code Map's #dir= vs the component's hashKey — and four instances on one page need four distinct DomId/HashKey pairs; ownership gains DRILL-IN for the first time, which is the epic's own logged owner request from the Story 7.11 session. (F5) HierarchyExplorerConfig.Size is ONE square int applied as HEIGHT while Code Map's treemap is 1000x640. (F6) MEASURED TODAY: this repo's roster is ["Matt Eland","dependabot[bot]"] so the solo-repo reframe does NOT trip and the chart renders — but the bot touched exactly TWO files, so three of four modes are near-degenerate and "all four modes verified" would overstate the evidence; and the golden fixture is not a git repo, so NEITHER PAGE RENDERS IN IT and the fingerprint is not this story's net. (F7) 58 entry-point test refs (20/13/14/11) PLUS 68 CSS-CLASS assertions (codemap-cell 31, ownership-wedge 20, ownership-cell 17) — bigger than 20.7's F4, and the class half is the trap because it fails at RUNTIME not compile time. (F8) Charts.BuildSunburstSvg (:3650) has exactly TWO callers, both this story's, so THIS STORY DELETES THE LAST HAND-ROLLED ARC GEOMETRY IN C#; and the 2,712 + 2,220 rich hover cards are where the byte accounting actually lands. MEASURED STARTING STATE from a real --deep-git run (714 pages, 68.4 s): code-map.html 6,020,916 B (spike projected -3,493,000) and git-insights.html 2,129,514 B (spike projected -1,510,735) — together EXCEEDING the whole -4,787,124 B portal net, so this is the story that settles whether the Plotly adoption paid for itself. BLOCKED BY 20.7 (its F3 capabilities are this story's foundation, its Task 10.4 allowlist is what this story empties), itself blocked by 20.6 and by 20.5 reaching done. prior: ADDED 2026-07-25 (create-story 20.7, owner decision D1) — the OTHER HALF of the rollout, seated in epics.md and here in the same change. Converts Code Map (CodeMapTemplater.cs:152,158 — 7 colorize dimensions x 4 filter variants = 8 charts, plus the drill breadcrumb and the per-variant file table) and Git Insights ownership (GitInsightsTemplater.cs:173,178 — 4 live modes + contributor select + staleness threshold), then DELETES the last four Charts.cs entry points (CodeTreemap, CodeMapSunburst, CodeOwnershipSunburst, CodeOwnershipTreemap) and the last two client renderers (initCodeMapPanel, initOwnershipSunburst). AC#1 is the new capability: a DIMENSION CONTRACT on the component (fill resolved from any token family through the shipped cascade, never a re-typed token value — AD-7; non-color channel holds