  26-7-future-service-integration-investigation: backlog # INDEPENDENT — schedulable any time. Surveys GitHub code
                   # scanning/Dependabot, coverage + vuln services, other quality platforms, and LOCAL compiler/
                   # analyzer output (the owner's language-dependent case). Key question: does 26.2's design
                   # generalize to a PLUGGABLE external-signal provider seam, or is each service bespoke? Must carry
                   # an explicit "none of these" option and name the ADR trigger if a seam is warranted. Feeds
                   # deferred-work.md / the epic backlog — does NOT auto-seat stories.
                   # SCOPE REFINED 2026-07-29 by 26.1's ideation record (section 8.6) — this story's CENTRAL
                   # QUESTION CHANGED SHAPE and it is narrower than seeded. 26.1's refreshed measurement found that
                   # 859 of 1,534 observations (56%) are already `external_roslyn:` rules: Roslyn analyzer output
                   # ALREADY reaches the portal THROUGH SonarCloud as an external engine (CA1861 x355,
                   # SYSLIB1045 x283, CA1859 x76, CA1816 x48). So the owner's "language-dependent" case is not a
                   # future candidate — it is over half the CURRENT payload. Ask the narrowed question: "is there
                   # value in ingesting analyzer/compiler output DIRECTLY, given the configured provider already
                   # carries it?" The concrete NFR8 figure to carry: a non-.NET project loses those 859 and sees
                   # roughly 44% of this repo's density. 26.1 also decided AC #3 as IN-SCOPE-AS-IS with NO engine
                   # distinction rendered anywhere — so if this story recommends a second provider, the engine
                   # question reopens as a PRESENTATION question, not only an ingestion one.
  epic-26-retrospective: optional

  epic-27: backlog # Test-Coverage Insights - per-file coverage on code pages + hierarchy surfaces (FR42).
                   # ADDED 2026-07-26 (owner-directed, during Story 25.1's dev pass). Owner scope call: ROLLUPS AND
                   # ANALYTICS, not per-line marks (covered/total line COUNTS are kept as numbers; per-line gutter
                   # marks are OUT - 27.6 revisits on evidence). AD-4 applied to a purely LOCAL provider: a coverage
                   # report on disk, so NO network / NO credential / NO service dependency - the sharp difference
                   # from Epic 26. SpecScribe NEVER runs the user's tests; it reads a report they already produced.
                   # KEPT SEPARATE FROM EPIC 26 DESPITE SHARING SURFACES: coverage is a per-file METRIC with a local
                   # credential-free path; findings are discrete SEVERITY-BEARING items from a networked service.
                   # Coordination is real and owned by 27.4 AC#2 - whichever epic lands SECOND extends the first's
                   # code-page section rather than adding a second one.
                   # NAMING COLLISION, LOAD-BEARING: ArtifactCoverage.cs / RefreshCoverage() / the "Planning
                   # Artifacts" panel ALREADY mean PLANNING-ARTIFACT coverage. 27.2 must fix a distinct vocabulary
                   # via ADR BEFORE any surface ships. Same class as the unresolved PRD-vs-epics.md NFR collision.
                   # NO new NFR: opt-in/absent-not-broken is AD-4; the link-out is already governed by NFR12.
  27-1-ideation-how-coverage-reads: backlog # IDEATION, no code. 2-3 NAMED design directions per surface (Code Map
                   # treemap / sunburst / code file pages) per the create-story visual-intent convention. Must decide
                   # how coverage reads WITHOUT color (UX-DR17), whether it gets a new scale or reuses a token family
                   # (must stay distinguishable from the six --status-* stage tokens), and what UNKNOWN coverage
                   # looks like - a file absent from the report is NOT 0%, and conflating them is a lie the eye
                   # cannot catch. GATES 27.4/27.5.
  27-2-coverage-ingestion-spike: backlog # SPIKE, decision-first, throwaway, NO production code. Durable output =
                   # spike report + RATIFIED ADR. Picks formats (Cobertura / OpenCover / lcov; Cobertura is the
                   # cross-ecosystem default) and the discovery mechanism via SettingsResolver, NOT a new config
                   # surface. Path mapping MUST be proven against a REAL report from a real repo, not a fixture, and
                   # unmatched entries surface as a DIAGNOSTIC - a coverage surface that silently omits half the
                   # codebase is worse than none (the lesson 25.1 paid for when its exclusion list was ~26% wrong).
                   # Also owns the ArtifactCoverage naming collision and the staleness-disclosure decision.
                   # GATES 27.3-27.6.
  27-3-coverage-metric-spine: backlog # NON-VISUAL metric spine, mirroring Story 24.1's pattern - lands first and
                   # gates every surface. Per-file covered/total/percentage (the COUNTS the owner asked to keep, not
                   # just the %), directory rollups LINE-WEIGHTED not a mean-of-percentages (a 3-line file must not
                   # outvote a 3000-line one), and UNKNOWN representable distinctly from 0%. Extends the existing
                   # FileInsight seam hotspots/coupling already ride - NOT a parallel per-file model. With no report
                   # configured, output must be BYTE-IDENTICAL (fingerprint unmoved).
  27-4-coverage-on-code-file-pages: backlog # % AND covered/total line counts so the number is auditable; link out
                   # to the external tool's page for THAT file, absent-not-broken when unconfigured (NFR12).
                   # OWNS THE EPIC 26 COORDINATION CONSTRAINT (AC#2): whichever of 26/27 lands second EXTENDS the
                   # existing code-analysis section rather than adding a second one. Designed empty state must
                   # distinguish "not measured" from "0% covered" (UX-DR22).
  27-5-coverage-on-treemap-and-hierarchy: backlog # Encode coverage on the Code Map treemap + Hierarchy Explorer at
                   # file AND directory level, never color-alone (UX-DR17), with UNKNOWN visually distinct from LOW.
                   # ADR 0013: the server-rendered TEXT TWIN must carry the coverage figures too - a twin that omits
                   # the new signal silently breaks the contract that made the SVG retirement acceptable. Per-node
                   # byte cost MUST be MEASURED against 20.7's budget, not assumed (20.5 found the twin cost
                   # ~180 B/node its own spike never modelled). UX-DR21: state what coverage replaces or coexists
                   # with rather than stacking a third meaning on one wedge.
  27-6-coverage-x-churn-analytics: backlog # "Changes often AND poorly tested" - ranks files by churn x coverage.
                   # Reuses GitMetrics.TryComputeDeep, NOT a second git traversal. Ranking rule must be STATED and
                   # defensible, not an unexplained composite score. Degrades absent-not-broken when either signal
                   # is missing. Also records whether the analytics work changed the case for PER-LINE marks, so
                   # that scoped-out decision is revisited on EVIDENCE rather than silently dropped or expanded.
  epic-27-retrospective: optional

  epic-28: backlog # Text-Twin & JS-Off Standardization - one proven pattern, then a verified rollout. SEATED
                    # 2026-07-29 at the Epic 20 retrospective, via ADR 0031. Retires ADR 0013's hard per-story
                    # gate (no surface retires its SVG until its twin is audited complete) for NEW work - NFR-5's
                    # wording is unchanged, only the delivery sequencing moves from per-story to per-epic. Resolves
                    # ADR 0030's named open item (no Epic 24 story owns Charts.ReferenceGraph's text-twin audit) -
                    # Epic 24 does not own that audit; this epic does. Same spike -> component -> site-wide-rollout
                    # shape Epic 20 used for the chart engine, applied to the accessibility contract. UNSCHEDULED,
                    # NO STORIES YET - story breakdown deferred to its own create-epics-and-stories / create-story
