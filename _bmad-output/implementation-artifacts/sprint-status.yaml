  18-4-forged-ideas-list-page: done # code-review 2026-07-28: review -> done, 12 patch findings applied (full detail on the last_updated key). prior: dev-story 2026-07-27 DONE -> review (baseline 32fd282; HEAD at start 40c7ee9). The Ideas surface over bmad-forge-idea ships: `ideas.html` grouped by verdict (Hardened -> In progress -> Killed, empty sections omitted), `ideas/{slug}.html` synthesized detail pages, and verbatim-carried `ideas/{slug}-report.html` leaves. New `Memlog` (the ONE reader of the shared-CORE `.memlog.md` shape - `BuildMemlogMap`'s `updated:` regex moved into it, no second regex), `IdeaDiscovery` (path -> marker -> `idea:`-corroboration cascade, reject-only), pure `IdeaDerivation`, `IdeasTemplater`. 41 new tests; full suite 2538 passed / 0 failed. THREE THINGS THE STORY GOT WRONG, corrected in flight: (1) SPA capture does NOT "come free" - `ExtractContentRegion` degrades a landmark-less foreign page to nav-markup-only, so the carried report is written with a new `WriteOutput(capture:false)` or the bundle ships a content-empty route; (2) suppressing the orphan `forged-idea.md` pages left `BuildReferenceMap` (which optimistically maps EVERY *.md to `ToOutputRelative`) handing out 18 dead `code-map.html` links - forge workspaces now route to the idea detail page like story artifacts already did; (3) 18.4 was NOT gated by 18.3 (the memlog carries its own `goal:`) - epics.md seating comment corrected in the same change. S7(a) RESOLVED BY EXCLUDING forge memlogs from `BuildMemlogMap`: a scoped memlog demotes the root journal from every-family fallback, so one forge run would silently strip the memlog date from every coverage card; both halves tested. AC #6 gate widened to inline handlers / `javascript:` / iframe-object-embed and rejects ALL external origins (stated, not silent). Live-browser verified incl. real CSP `script-src 'none'` (specscribe.js blocked, page fully readable) and the carried report proven chrome-free (1 html / 0 main / 0 footer). GOLDEN GATE: the failure was BISECTED to a concurrent session's uncommitted `specscribe.js` (pristine HEAD passes; HEAD + that one file fails) and NOT re-baselined here - Story 20.8 regenerated it to 3171cf5c... and named this story's deltas in its provenance; confirmed stable across two fresh runs after. epics.md amended: AC #4/#5/#6 seated, FR36 stretch accepted-and-noted (Open Question 2 default (c)). ADR 0021 PROPOSED (foreign artifacts carried verbatim as gated dead-end leaves; 0019 is double-claimed by 18.3+22.3 and 0020 pre-claimed by 18.5). Owner verify round: badge SHAPE is inconsistent inside In-progress (FreeTextBadge routes the known word to a canonical `.status-badge` while the three unknown words degrade to `.pill`) - two ways out, both with costs, left to the owner. | create-story 2026-07-27 (baseline 32fd282): backlog -> ready-for-dev. THE HEADLINE: `bmad-forge-idea` writes to `{output_folder}/forge/{slug}/`, and `{output_folder}` IS SpecScribe's SourceRoot (`ForgeOptions.SourceDirName = "_bmad-output"`) — so a repo that has run the forge is ALREADY in an undesigned state today: `forged-idea.md` renders as an ORPHAN generic page linked from nowhere; `.memlog.md` is dotfile-ignored by `PathUtil.IsIgnoredSourceFile` so it is never a page, YET `SiteGenerator.BuildMemlogMap` already globs it SourceRoot-wide for the coverage panel's freshness date; `forge-report.html` — the file that actually holds AC#1's "persona-objections/rationale content", always rendered on every exit — is INVISIBLE because `EnumerateSourceFiles` globs `*.md` only; and the `forge/` folder raises an "unrecognized structure" notice (`UnrecognizedTopLevelFolders` → `DashboardViewBuilder.IsWellKnownTopLevelFolder`). FOUR OWNER DECISIONS (elicited 2026-07-27, all locked): D1 synthesized idea DETAIL page + the original `forge-report.html` CARRIED ALONGSIDE (chosen over forged-idea.md-only, which leaves killed/clarified/in-progress ideas with NO target since `forged-idea.md` exists only on a