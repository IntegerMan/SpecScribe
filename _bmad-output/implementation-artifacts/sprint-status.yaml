  5-3-watch-regeneration-safety-and-scope-aware-rebuilds: done # CODE REVIEW 2026-07-25 (3 adversarial layers, scoped to this story's File List — sibling Story 20.3 hunks in the same commit range excluded): 12 findings → 8 patches applied, 2 deferred, 2 dismissed. Production fixes: _codeFiles assignment moved INSIDE GenerateAll's _gate (a pre-existing race that only became reachable because RegenerateTopology is the first caller able to run GenerateAll against another in-flight route); CopyEmbeddedAsset now writes a .tmp + atomic File.Move so a partial copy can never be accepted as "already correct" by the Length>0 fallback; DeleteOutputFile/DeleteOutputDirectory evict _spaCapture only AFTER the delete succeeds, and a partial directory delete reconciles per-file against real disk state (new ReconcileSpaCapturePrefix) instead of evicting all-or-nothing; RunDebouncedPass fully wrapped (Path.GetRelativePath sat outside RunGuarded on a bare Timer callback); the directory watcher's Error handler now ESCALATES to a rebuild (new ForceTopologyRebuild) rather than only logging — a buffer overflow means events were DROPPED, so logging alone leaves output silently stale, short of AC #5. Test fixes: the config-dir crash-guard test never reached the branch it was named for (new OnConfigDirCreated factory seam + a success-path counter-test); the burst test never asserted the coalescing it claimed (now pins the event count — trap: RelativePath is the SOURCE-relative .md path w/ OS separator, not the normalized .html output path); the self-trigger-loop test's two fixed sleeps replaced with a stable-plateau poll. Full suite GREEN 2391/0/3 — including GoldenContentFingerprint and the git-fixture set that historically flakes. Deferred to deferred-work.md: hand-maintained EpicsFamilyPages list, CopyEmbeddedAsset retry sleeping under _gate. # FOLLOW-UP PASS 2026-07-24 (owner-requested audit of the crash-guard class): THE ORIGINAL FIX WAS INCOMPLETE. RunGuarded guarded the generator call and then handed the result to _onEvent OUTSIDE the try — and _onEvent is a caller-supplied delegate invoked on the SAME unguarded ThreadPool thread (in production ConsoleUi.LogEvent, which writes to the console; piping `specscribe watch` into a process that exits first closes stdout → IOException from the write → process death). That failure is WORSE than the one first fixed because it fires on the SUCCESS path: a perfectly good rebuild kills the session while reporting itself. Every event now leaves through ONE SafeNotify seam (the swallow is deliberate — the reporting channel IS the thing that failed, so there's no second channel; losing a log line beats losing the session). Same pass also closed: all raw FileSystemWatcher Changed/Created/Deleted/Renamed handlers across all three watcher kinds were unguarded on the watcher's own dispatch thread (→ SafeHandle), and OnConfigDirCreated's EnableRaisingEvents sat outside its own try. Three scattered watcher-label literals promoted to FileWatcherLabel/DirectoryWatcherLabel/BmadDirWatcherLabel. TESTABILITY: the timer bodies were extracted to internal RunDebouncedPass(path)/RunTopologyPass() seams because these guards only matter where there is NO CALLER — testing them through a real Timer means a REGRESSION takes down the TEST HOST rather than failing an assertion, turning one broken guard into a lost suite run reported as infrastructure noise; driving the bodies synchronously keeps an unguarded throw an ordinary attributable failure (mirrors the OnConfigDirCreated seam 6.11 added for the same reason). 11 new tests incl. the nastiest ordering (route fails AND reporter fails — where a route-only guard still dies) + 2 counter-tests so the suite can't be satisfied by swallowing everything. TRAP RECORDED: the first fault injection created a DIRECTORY named as-directory.md assuming the read would fail — it does not, File.Exists returns false for a directory so the route takes RemoveFor and returns a tidy Skipped; that test p