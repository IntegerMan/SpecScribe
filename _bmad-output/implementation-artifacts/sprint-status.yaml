  5-7-fixed-as-of-date-page-cutoff-policy: done # CODE-REVIEW 2026-07-28 (baseline d1722f17): review -> done. Scoped to this story's own File List, excluding bundled Story 18.2/18.6/20.9/accessibility-sweep churn in the same two commits. 5 patch findings applied: (1) `ConfigurePaths` ignored `settings.AsOf` when pre-selecting the current cutoff — an `--as-of`-only launch reopening the menu silently reverted to machine-local, contradicting Task 3's own "never silently flips it" guarantee; fixed with the same AsOf-first precedence `ResolveDateCutoff` uses. (2) `DatePolicies.Label`/`Token` disagreed for a dateless `AsOf` cutoff (library-caller-only, unreachable via CLI); `DiagnosticsTemplater` gained an explicit arm rendering the true MachineLocal-degrade row. (3) The interactive date prompt discarded `TryParseAsOfDate`'s success bool; now checked, throwing on disagreement with its own validator. (4) A comment overclaiming byte-identical parity with `DeliveryCadenceHeatmap`'s empty state was corrected. (5) AC #2a's console echo line had zero automated coverage; extracted into pure `ConsoleUi.FormatPinnedCutoffLine` (matching the existing `CliFeedbackTests`/`GenerationSummary.FormatLine` "don't test Spectre, test us" convention) and covered by new `ConsoleUiTests.cs`. 2 pre-existing findings deferred to deferred-work.md (a `DateCutoffJsonConverter.Read` crash risk on a non-string JSON token, inherited unchanged from Story 5.5; the tautological `OneResolvedToday_MakesEveryConsumerAgree` test, also inherited from 5.5). 3 dismissed as noise (DateCutoff's non-self-validating construction, matching this codebase's boundary-validation convention; SettingsStore.Capture's doc-claim only holding for the gated CLI path, matching its own documented never-throw design; AC #2b's conflict check comparing the whole DateCutoff rather than just Policy, a disclosed and tested deliberate widening). Full suite 2662 passed / 1 failed (unrelated — IdeaDiscovery.cs/IdeasModel.cs mid-edit by a concurrent session's Story 18.4 work at review time) / 3 skipped. prior: DEV-STORY 2026-07-28 (story baseline d1722f17): in-progress -> review. `--as-of <DATE>` ships end to end. Suite 2657 passed / 0 failed / 3 skipped; golden fingerprint NOT moved. Headline risks recorded on this key: (1) the story's quoted golden literal `2bd1c18e30c16…` was ALREADY STALE — that is the value at baseline d1722f17, but HEAD carries `f4a7cbac5bee0f…`, moved by a SIBLING session's committed work between create-story and dev-story; per the story's own "do not regenerate, find out why" rule the current constant was left untouched and is green, which is what AC #1b actually asks. (2) ONE existing test had to change and it is a REAL behavior change, not a test fix: `ChartsTests.CommitHeatmap_FutureDatedFirstCommit_KeepsValidGridWithoutOrphanCaption` fed an ALL-future series and asserted a positive-width grid; that series now has no visible day and correctly takes the new empty state — which IS the pre-existing future-skew overclaim D2 says this story also fixes (the old render drew a zero-cell grid whose aria-label still announced "2 commits"). Split into two tests plus a deterministic explicit-cutoff third. Consequence for review: `if (start > end) start = end;` in `CommitHeatmap` is now UNREACHABLE (firstCommit is drawn from `visible`), kept only because the already-migrated `DeliveryCadenceHeatmap` keeps the identical line — "delete both or keep both" is a legitimate review question. (3) A guard the story did NOT name was required: `SettingsStore.ApplyTo` had to learn about `--as-of`, or a saved "utc" restored on top of an explicit `--as-of` would manufacture exactly the disagreement `Validate()` rejects, turning a valid command line into an error because of a file the user never mentioned. (4) The story's conflict rule was ambiguous — read literally, `--today-policy as-of:2026-01-01 --as-of 2026-07-27` (same policy, DIFFERENT dates) is not a conflict and no rule says which date wins; both surfaces now compare the whole `DateCutoff`, so disagreeing dates are rejected while the story's explicit identical-values non-conflict case is preserved. (5) Task 3 (interactive parity) is IMPLEMENTED BUT NOT VERIFIED and must not be claimed as such — the permanent Spectre-TTY blind spot (every agent harness captures stdout ⇒ `Interactive == false` ⇒ `AnsiConsole.Prompt` cannot run), recorded independently by Stories 5.1/5.2/5.5 and logged at deferred-work.md:1020; left for the owner. Live-verified in the real portal: the console echo, `--show-config` canonicalizing a forgiving `07/20/2026` to `as-of:2026-07-20`, all four rejection/acceptance CLI paths, and the D2 pre-history pin (0 date pages, 0 `aria-label="Commit activity:`, 0 `href="commits/`, empty state naming the cutoff, errors=0 on both the dashboard and git-insights). Question 1 (Git Pulse strip) now carries measured numbers: 376 commits / 25 active days in the strip beside a heatmap correctly bounded to 301 / 17 — but the last-commit link IS correctly suppressed (plain text, no dead link), so it is a truthfulness question, not a broken-link one. prior: CONTEXTED 2026-07-27 (create-story, baseline d1722f17): 6 tasks, 2 ACs (verbatim from epics.md) with 5 owner-decision sub-points, story file `5-7-fixed-as-of-date-page-cutoff-policy.md`. The shape prescribed: keep the `DatePolicy` enum (gaining `AsOf`) and add `readonly record struct DateCutoff(DatePolicy Policy, DateOnly? AsOf)` — a record STRUCT deliberately, so `default(DateCutoff)` == (MachineLocal, null) and Story 5.5's "the default is the status quo by construction" guarantee survives the shape change verbatim. `ForgeOptions.DatePolicy` renames to `DateCutoff` and retypes; only THREE read sites (SiteGenerator.cs:73, SettingsResolver.cs:153, DiagnosticsTemplater.cs:158). `--today-policy as-of:<iso>` is accepted but unadvertised (it falls out of the single parse path, and the persisted value must round-trip through exactly that path), mirroring how the forgiving spellings are already accepted-but-not-advertised at DatePolicy.cs:34; `as-of:<date>` must NOT be added to `CanonicalTokens`, which is consumed as a list of things that would have worked — extend `RejectionMessage` with a sentence naming the flag instead. Also flagged for the dev pass: two existing tests enumerate the enum and need updating not deleting (`Label_IsDistinctNonEmptyTextForEveryPolicy` at DatePolicyTests.cs:169, `OneResolvedToday_MakesEveryConsumerAgree` at :102); `Validate()` can return only ONE error so its three checks need a documented order; `HeatLevel` is already divide-by-zero safe at maxCount==0 (verified — do not "fix" it); and three existing heatmap-text assertions (ChartsTests.cs:1437, GitInsightsTemplaterTests.cs:250, HtmlTemplaterTests.cs:298) must be VERIFIED not assumed after Task 4. Owner questions raised at close, non-blocking: the out-of-scope GitPulse signal strip, and whether `watch` with a pinned cutoff deserves a How-to-use note. prior status: backlog # SEATED 2026-07-27 at the Epic 5 retrospective (owner decision on Story 5.5's Open Question #3, "is a fixed explicit --as-of <date> override desirable now, or defer?" -> ADD IT). Story 5.5's other two open questions were CONFIRMED AS IMPLEMENTED at the same retrospective and must NOT be re-opened by this story: the `--today-policy` option name and its `machine-local`/`utc`/`last-commit` tokens stand as shipped, and `LastCommit` remains `series.Max(day)` = latest AUTHORED commit day (chosen for symmetry with LinkedCommitDays, which filters the same series). 5.7 therefore EXTENDS that vocabulary with a fourth, argument-bearing policy rather than renaming or redefining the existing three. THE LOAD-BEARING INVARIANT IS 5.5's, INHERITED WHOLE: one policy-resolved `_today` computed ONCE per run and threaded to all five cutoff consumers (Charts.LinkedCommitDays / date-page generation / artifact-skew / the heatmap grid / the GitPulse guard) — a second resolution anywhere is the defect this design exists to prevent. Two further 5.5 constraints carry: the dashboard's artifact-STALENESS today stays a separate value from the date cutoff (the `dateCutoff` parameter split), or `--as-of` on a long-idle repo would falsely report every planning artifact as freshly updated; and commit TIMESTAMPS are still never re-zoned (Story 10.4 honesty). Persistence must reuse `DatePolicyJsonConverter`'s forgiving vocabulary, NOT a generic JsonStringEnumConverter — 5.5's code review found the generic converter fails WHOLE-DOCUMENT deserialization on one unrecognized token, silently discarding Source/Adrs/Output/ProjectName/DeepGit/CodeUrl/IncludeReadme; a policy that now carries an arbitrary date STRING widens that blast radius, so this is a red-green requirement, not a nicety. Note `DatePolicy` is currently a bare enum: an argument-bearing policy is the first case that cannot be represented by an enum member alone — expect a shape change (enum + optional date, or a small record) across DatePolicy.cs/SiteSettings.cs/SettingsStore.cs/SettingsResolver.cs/DiagnosticsTemplater.cs/Commands.cs. Rejection belongs at the existing `SiteSettings.Validate()` gate with `ResolveDatePolicy()`'s throw kept as the defense-in-depth backstop for interactive/library callers that bypass Spectre. Provenance + `--show-config` + the Diagnostics config row + the interactive SelectionPrompt all need the new policy (NFR7 / Story 5.2 parity). Epic 5's `in-progress` key is CORRECT and deliberate — the epic reopened for this story at its own retrospective. Seated in epics.md + this file in the same change (Epic 6 action-item standing rule).
