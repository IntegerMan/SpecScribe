LE and contradicts the emitter), and live-browser verification caught three defects the suite structurally could not see. prior: "2026-07-27" # create-story 18.6 (2026-07-27, baseline 6017c2c): 18-6-module-aware-artifact-coverage-families backlog -> ready-for-dev. ADR 0015 Decision 5a — the last un-closed surface from the 18.1 spike. Headline: the defect's usual framing is WRONG and the real one is narrower but genuinely reachable. `ArtifactCoverage.IsEmpty` is `!Families.Any(Present)` and the panel renders only on `Coverage is { IsEmpty: false }`, so a repo matching NONE of the eight already omits the panel — "a TEA-only repo shows eight missing families" does not happen. But `bmad-spec` is a **CORE** skill (verified in this repo's `_bmad/core/module-help.csv`; NOT in `_bmad/bmm/module-help.csv`) and Core ships with every module install, so a cis/tea/bmb repo that ran `/bmad-spec` has a genuine `specs/*/SPEC.md`, Spec Kernel is Present, and the panel renders **1 present + 7 missing BMM families** on a project with no PRD, epics, stories or FR/NFR catalog. Second finding, a live trap: `SiteGeneratorCoverageTests`' fixture creates **no `_bmad/` at all**, so its five generation tests run at `BmadModule.Unknown` — which is exactly the state owner decision D1 preserves; adding `_bmad/bmm/` fixtures to make them pass means the wrong decision was implemented. Three owner decisions locked: D1 an UNDETECTED repo keeps the eight families (only a DETECTED-but-unmodeled module loses the panel); D2 an `Unmodeled` primary declares an EMPTY family set and the panel omits entirely, ADR-literal, rejecting a core-only Spec-Kernel set despite the Core-skill finding; D3 silent omission on the page but recorded as ONE `Informational` diagnostic (departing from 18.2's Decision 2c named acknowledgement, because that slot is prose on an explainer page and this is a data panel). Implementation shape decided: the family set stays in `ArtifactCoverage` (a private `SpecsFor(BmadModule)`, keep