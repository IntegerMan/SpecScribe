Exception), SiteGeneratorOutline. | prior: create-story 2026-07-27 (baseline 6017c2c): backlog -> ready-for-dev. Its 9 ACs SUPERSEDE epics.md's 3; recorded in epics.md § Story 22.4 in the SAME change per CLAUDE.md. HEADLINE: epics.md AC #1 is ALREADY SATISFIED and near-vacuous — `spa/` IS the IR (ADR 0008 seated it, Story 22.2 promoted it IN PLACE), so the SPA client already consumes the IR and there is nothing to migrate. The real duplication measured in code: `BuildSpaBundle` (SiteGenerator.cs:3101) and `RenderWebviewSurfaces` (:2810) are two ~200-line builders sharing an IDENTICAL prelude (docs -> WorkInventory -> ProjectCounts -> BuildFollowUpGeometry -> UnplannedWorkGeometry -> BuildIndexPage), an IDENTICAL epics-family iteration and an IDENTICAL captured-region loop (CapturedNavMarkup + ExtractContentRegion) — Story 22.2's codeItemHref fix had to be applied TWICE, in both files. OWNER DECISIONS 2026-07-27: D1 one region seam + both inherited defects, with the slicers SURVIVING (still the IR's producer for ~853 pages until 23.4) so this story retires the DUPLICATE, not the SLICE; D2 22.4 RUNS BEFORE 23.4 — 23.4 then inherits ONE region producer to preserve and its "delete the page render first and the IR goes dark for 82% of the site" circularity is answered in advance, discharging 23.4 AC #7's restatement obligation; D3 the STATIC page moves to converge the 46-delta, honouring 23.3's measurement that the IR is the more complete render. BOTH INHERITED DEFECTS RE-ROOT-CAUSED at 6017c2c (22.3's line numbers were ~40 lines stale within one day): the 46-delta is `RenderEpicsPages` at :365 building its follow-up geometry from `ResolveFollowUpWork(files)` because `_docs` stays empty until :3289, vs `BuildSpaBundle` at :3109 building it from `_docs.Values`; the two-region-shapes defect is `HtmlRenderAdapter.RenderWayfinding` (:424) emitting a `page-wayfinding` wrapper ONLY when a pager renders, while `SpaDelivery.ExtractContentRegion` slices from the INNER breadcrumb 