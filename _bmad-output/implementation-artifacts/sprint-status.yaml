  23-5-packaging-reconciliation-node-build-step: review # dev-story 2026-07-27 (baseline 86b35c2, HEAD at start 40c7ee9): ready-for-dev -> in-progress -> review. DECISION: ADR 0022 (Proposed) — Node is a build-time toolchain and a generate-time runtime, NEVER a shipped toolchain. Full measured basis in 23-5-packaging-strategy-report.md. THE 23.1 GATE'S BINARY WAS FALSE: it conflated the toolchain that BUILDS the projection layer with the runtime that RENDERS with it. Measured asymmetry — build toolchain 201.9 MB / 16,791 files / 14 native .node bindings (Rolldown, Oxc, Rollup, LightningCSS) requiring process.dlopen; shipped artefact 3.78 MB / 185 files / ZERO native bindings. THE TWO-IR EXPERIMENT (AC#4, never run before): ONE artefact built with NO IR PRESENT AT ALL, isolated to a dir holding only .output/, rendered 1056/1056 routes of this repo AND 32/33 of a DIFFERENT project (CORA) via SPECSCRIBE_IR_DIR, ~4 ms/route, full 1056-route pass in 6.3 s vs `nuxt generate` 25-30 s vs the spike's ~130 s cold. Net new shipped bytes ~2.40 MB (1.46 MB of the artefact is plotly/prism/specscribe.js the C# portal ALREADY ships). Harness COMMITTED (web/scripts/experiment-two-ir.mjs) because 23.1's "every number is reproducible" claim was false at review. AC#5 ADJUDICATION: the two forces were NEVER in conflict — "build time, module scope" means SSR render time INSIDE Nitro, which in a prebuilt .output/ IS runtime; verified by READING THE BUILT BUNDLE (process.env.SPECSCRIBE_IR_DIR survives verbatim, all 3 readFileSync sites intact), not inferred. Only the ROUTE TABLE was a genuine build-time coupling and it yielded to SPECSCRIBE_PACKAGE_BUILD=1. 23.2's 1.00x payload measurement PRESERVED. CHANNELS: npx + extension host BOTH run on Node by construction; standalone binary (16.3) is the ONLY channel a Node dep breaks and takes a DOCUMENTED PREREQUISITE (owner decision) — bundling a runtime (+50-100 MB/RID) kept only as an escape hatch. NO Epic 16 channel is built yet (every 16-* key backlog) so AC#2's "continue to function" is a design constraint, not a non-regression check. OWNER DECISIONS 2026-07-27: (a) Nuxt 3->4 ABSORBED here (EOL 2026-07-31) — 3.21.9 -> 4.5.1 held 23.3's contract EXACTLY at 190/190 byte-identical <main>, 190/190 verbatim, 0 link regressions; (b) FULL CI scope incl. authoring a web/ test suite. AC#7: `app.baseURL: './'` EVALUATED AND REJECTED (baseURL is one global string but the correct prefix is PER-PAGE-DEPTH — './_nuxt/' resolves to 'epics/_nuxt/' on a nested page); fixed with a Nitro render:html depth-aware rewrite, VERIFIED IN A LIVE BROWSER from file:// at depth 0 and depth 3, zero absolute /_nuxt/ remaining. AC#8: TWO OF THE THREE DRIFT GATES WERE RED AT HEAD when this story first ran them (check:ir-content 48 rules dropped/3 added; check:assets stale specscribe.js) — drifted from a concurrent story in 40c7ee9 and caught by nothing, which IS the argument for AC#8. Now wired into build-test-analyze.yml (NOT a 2nd workflow) with setup-node + npm ci + generate --spa + npm run check + Vitest 80 tests -> lcov. SONAR PREMISE WAS STALE: the story says web/** is ABSENT from the exclusion list, but Story 25.2 decision 1b had since added sonar.coverage.exclusions=web/** — now NARROWED to web/scripts/**, web/server/plugins/**, web/**/*.vue (mirroring vitest.config.ts) with sonar.javascript.lcov.reportPaths wired; ALSO added web/node_modules/** to sonar.exclusions, which was absent and would have ingested 16,791 files now that CI runs npm ci there. web/ coverage is 51.19% stmts / 53.40% lines — EXPECTED to show new_coverage RED (non-blocking; qualitygate.wait stays unset); fix is component tests, NOT re-widening the exclusion. FIXED A GATE THAT COULD NEVER STAY GREEN: ir-content.manifest.json carried migratedPages/totalPages/passThroughUncoveredClasses — WHOLE-CORPUS stats that changed on any docs commit; removed from the committed artifact (still printed by the extractor), verified green across TWO different IR generates. TWO FINDINGS RECORDED NOT SMOOTHED: (1) an artefact carrying prerendered pages returned PROJECT A'S DASHBOARD FOR PROJECT B at HTTP 200 (Nitro serves public/ AHEAD of the SSR route) — a wrong answer with a success status; fixed structurally + the harness now refuses such an artefact; (2) DashboardSurface.vue HARD-THROWS on any project whose dashboard has no Hierarchy Explorer (CORA: 0 occurrences) — a real project-independence defect RAISED TO STORY 23.3, not patched here, per this story's scope instruction. AMENDS ADR 0006 §Decision's "self-contained packaging ... stand[s]" clause: still self-contained w.r.t. .NET, but acquires an external Node runtime prerequisite — stated rather than left to drift; ADR 0006's NFR6 ruling UPHELD IN FULL (nothing client-renders; 23.3's noScripts:true asserted PER ROUTE by the experiment). ADR NUMBERING: 0019 is double-claimed (18.3 + 22.3), 0020 pre-claimed by 18.5, 0021 taken by 18.4 -> 0022 is the first uncontested slot. SCOPE GUARD HELD: zero C# touched, HtmlRenderAdapter intact, slnx still 2 projects, full suite 2538 passed / 0 failed / 3 skipped incl. GoldenContentFingerprint GREEN (the golden test uses a FIXTURE that is not a git repo, so new tracked web/** files cannot reach it via the dogfood Code Map). src/ and tests/ modifications in git status are CONCURRENT Epic 18 work (IdeaDiscovery/IdeasModel/IdeasTemplater/Memlog/ADR 0021), scoped by File List NOT by diff range. CONCURRENCY: SpecScribeOutput/spa was WIPED TWICE mid-experiment by a concurrent `generate` without --spa; experiment moved onto scratch IRs. UNBLOCKS 23.4. prior: create-story 2026-07-26 (baseline 86b35c2): backlog -> ready-for-dev. Requested as 23.4; REDIRECTED to 23.5 on owner decision because Epic 23's execution order is 23.2 -> 23.3 -> 23.5 -> 23.4 and the 23.1 gate blocks 23.4 until packaging is settled. SEEDED WITH A CODE-VERIFIED THIRD OPTION the 23.1 gate's binary ("Node at generate time OR a client-rendered SPA") misses: toolchain and runtime are SEPARABLE. `nuxt generate` needs 174.8 MB of node_modules + a Vite build, but a prebuilt `.output/` is self-contained (Nitro traces deps into .output/server/node_modules) and measures ~2.83 MB, rendering ~4 ms/route. Story 23.3's in-flight `web/ir/adapter.ts:142-143` resolves IR_DIR from `process.env.SPECSCRIBE_IR_DIR` at module scope with computed-path readFileSync at :188/:222/:339 — so the RENDER path is already runtime-resolvable and cannot be inlined. The only genuine build-time coupling is `nuxt.config.ts` executing `import { site } from './ir/adapter'` at CONFIG LOAD to bake one project's `nitro.prerender.routes`, which is expected to be IRRELEVANT when SpecScribe drives the prerender itself (it emitted the manifest, so it knows every route). AC #4 is the two-IR experiment that proves or kills this; a refutation is a valid outcome. AC #5 forces explicit adjudication of the conflict between 23.2's payload finding (build-time module scope = 1.00x vs 1.36x/1.99x) and packaging's need for runtime resolution. AC #3 corrects the epic's AC #2: THREE channels not two, and the standalone self-contained binary is the only one a Node runtime dep genuinely breaks (npx runs on npm; the extension host IS Node per ADR 0005:30) — and NO Epic 16 channel is built yet (all 16-* backlog, no story files), so "continue to function" is a design constraint, not a non-regression check. AC #6 requires a PROPOSED ADR (next free number, 0016 is highest; distinct from the ADR 0005 CSP amendment 23.4 owns, which ADR 0012 §5 says lands once). AC #7 carries a VERIFIED defect: emitted output references assets absolutely (`href="/_nuxt/PageShell.BFy9n7kb.css"`) because `app.baseURL` is unset, while the portal is a relative-path tree opened from `file://` (ADR 0012 §1). AC #8 inherits the unowned 2026-07-26 owner decision from the 23.2 review (:86) to add a Node CI step + sonar lcov — `web/**` is absent from the Sonar exclusion list, so the next scan pulls ~1,800 lines of untested first-party code at 0% and reds the gate 25.1 just turned green. Four owner questions saved in the story (Nuxt 3 EOL is 2026-07-31 — FIVE DAYS OUT; the standalone-binary fallback; CI scope; ADR count). Scope guard: HtmlRenderAdapter stays intact and no surface migrates — that is 23.4. prior: GATED by 23.1 spike: RE-SCOPED and RESEQUENCED AHEAD OF 23.4 — no longer an end-of-epic tidy-up, it is Epic 23's LOAD-BEARING UNKNOWN. Prerendering is inherently PER-PROJECT (routes come from the user's IR), so "build Nuxt at CI time and ship pre-built assets" does NOT cover rendering the user's own project. Must decide between per-project prerender-at-generate-time (Node in the critical path) and a client-rendered shipped SPA (forfeits the NFR6 baseline 23.1 just proved) BEFORE 23.4 retires the C# renderer that today satisfies both. SCOPE ON CORRECTED PREMISES (code review 2026-07-23): the spike's claim that "neither npx (16.8) nor the Marketplace channel (16.5) could stay Node-runtime-free" was WRONG — both ALREADY require Node by construction (npx is invoked by npm; the extension host IS Node). The channel variant (c) genuinely breaks is the STANDALONE SELF-CONTAINED BINARY, and the real currency is ~184 MB of build toolchain plus a ~130 s COLD build (the headlined +57%/37.1 s is the WARM number), not Node's availability. Evaluate npx on its merits rather than excluding it.
  23-4-migrate-remaining-surfaces-retire-c-sharp-html-adapter: review # REVIEW 2026-07-30 (dev-story session 4, baseline 32fd282 preserved, executed at HEAD 70b72ab): in-progress -> review. OWNER DECISION D7 - the .html-writer DELETION is RE-HOMED to a new Story 23.6, carved OUT of this story rather than left as an open checkbox. NO production code changed this session; the whole session is the descope, its justification and the bookkeeping. TWO FINDINGS DROVE IT. (1) AC #5's answer changed under the story AFTER session 3 wrote it: the successor gate Task 7 records - GoldenIrFingerprint - was REMOVED on 2026-07-30 (70b72ab) because it produced THREE different hashes across the local box, CI-Windows and CI-Ubuntu for one identical commit (one cause found and still fixed - FallbackCodeWalk's unsorted directory walk, 7510a70; a second never identified). GoldenContentFingerprint is unaffected but hashes output .html, so the deletion voids it too => NO content-drift gate on either side. AC #5 is satisfied in the RECORD and NOT in the TREE; 23.6 inherits the hole; deferred-work.md:22 already carries the action. (2) The blast radius is a story's worth of work, not a checkbox: the written document is the oracle for FOUR gates - _spaCapture (without which RegionCompositionDeltas, and therefore BOTH proof gates this story landed, go VACUOUS rather than red - the worst failure mode), GoldenContentFingerprint, GoldenOutputInventory, and EnsureHierarchyEngine's host-marker scan. Good news traced in the same pass: WritePage composes the region from the PageView INDEPENDENTLY of the page render, so the region path needs nothing from the writer - the circularity that shaped all of 23.4 is already broken. NEW ADR 0033 (Proposed) records the owner's cross-cutting gate constraint rather than burying it as a story note: content-drift gates must be TARGETED (a failure names the artifact), REGENERABLE BY COMMAND (not a hex-literal bump), proven deterministic ACROSS CI OPERATING SYSTEMS (two local runs is a floor - 23.4's IR fingerprint passed three local runs and still differed on three platforms), and LOUD rather than vacuous when the oracle vanishes. GoldenContentFingerprint is GRANDFATHERED, not blessed. Reference shape already committed: web/measurements/parity.json's per-page sha256 over 1,469 pages. VERIFICATION RAN IN AN ISOLATED TREE and the reason is recorded: git status was CLEAN at session start, then a Story 24.2 session went live DURING it, leaving uncommitted CodeFileTemplater.cs (+313 lines), GitMetrics.cs, SiteGenerator.cs and two untracked files (CouplingLayout.cs, RelationshipGraph.cs) that do NOT compile (CS0103 ToGraphNodes - the call survives, the definition is mid-edit). Nothing of theirs was fixed, reverted, reset or cleaned; --no-build was NOT used (it would have run the stale dll - session 2's recorded trap); verification ran against `git archive HEAD` in the scratchpad. Suite there: 2,835 passed / 0 failed / 3 skipped, no contention flake. A grep for ToGraphNodes also returned two DIFFERENT answers 60 s apart - the transient mid-write read from shared-main-concurrent-edit-loss-verify-after-edit, observed live for the second time in this story; git diff HEAD was the arbiter both times, not a re-read. WHAT SURVIVES UNCHANGED AND STILL SHIPPING: HtmlRenderAdapter.Render's page composition, WriteOutput's .html writes, SpaDelivery.ExtractContentRegion and the whole Extract* family. prior: STILL IN PROGRESS 2026-07-29 (dev-story session 3, run at 94b8e56, clean tree; baseline 32fd282 preserved). AC #3 LANDED: the IR is now built from a region COMPOSED from each page's own PageView at the write seam (new WritePage seam; ~30 call sites moved off the WriteOutput+ApplyReferenceLinks+RenderPage idiom), PROVEN byte-equal to the old ExtractContentRegion slice across 1,469 pages with 0 unexpected deltas; SpaDelivery.Extract* survives only as that proof's oracle. Task 3 DONE: all 1,276 remaining pages migrated to 10 new Vue family components keyed to TEMPLATER boundaries (not path prefixes) via a new ir/families.ts resolver plus a completeness gate that asserts the real manifest leaves pass-through EMPTY; emitted HTML confirms 14 families, 0 pass-through. Task 5 DONE: measure:parity widened 193 -> 1,469 pages, 1469/1469 on all four measures (golden=IR, IR=Nuxt, golden=Nuxt, verbatim); per-page sha256 ORACLE now committed in web/measurements/parity.json (a byte LENGTH would not survive a length-preserving rewrite), stable across two runs; check:links 0 regressions (1,181 dangling on BOTH sides, inherited); check:a11y 0 failures over 1,474 pages; 0 Nuxt runtime scripts and 0 _payload.json across all 1,469 IR routes. Task 6 DONE as ADR 0032 (the next free number is 0032, NOT the 0023 the story file quotes - 0019 is still unwritten and 0020-0031 exist): no relaxation of the CSP policy string, measured; restates ADR 0005 section 4 body-carries-no-scripts as an enforced claim about the REGION (0 executable, 163 inert data islands). Task 7: GoldenContentFingerprint NOT retired and did NOT move - deliberate, since the C# writer still ships - and AC #5 satisfied by its SUCCESSOR instead: a new GoldenIrFingerprint over spa/ manifest+chunks, landed in the same story that switched the producer so the drift gate never lapses (3acee6c2...). The two-run rule caught real nondeterminism first - the manifest's derived contentHash for diagnostics.html embeds the output path - stable across THREE runs after folding it. D3/D5 AMENDED - ir-content.css is NOT retired and its when-it-is-empty condition is UNREACHABLE as written: only 6.5% of rules are prose/authorable, 93.5% style bespoke vocabulary INJECTED as rendered HTML across 651 classes, and the 97 chrome rules never empty because D2 + ADR 0024 keep C# composing the region permanently. AC #4 SECOND branch taken: per-rule residue enumerated with a named blocker (npm run report:ir-content-residue, committed), ADR 0018 amended with an addendum, 1,420 is the owner-visible debt, remainder raised as an EPIC 22 view-model ask. A worse defect fixed in the same area: the extractor was still bounded to 23.3 FOUR families, so the 1,276 newly-migrated pages had only 42% of their classes styled and the rest rendered BARE; widened to the whole site gives 100% coverage while still dropping 393 of 1,814 source rules, so still bounded/scoped/gated. THREE LAYERS had independently dropped the same content: deep-analytics.html :target lightbox sits after </main>, and the C# slicer, then the TS region splitter, then the CSS extractor each truncated there. Invisible to every harness (parity compares <main> only, check:links sees a same-page fragment as resolved, a11y has no opinion on a missing overlay) - found by opening the page in a browser. New IrRegion.trailingHtml carries it end to end; verified live: display:none -> :target -> display:flex position:fixed z-index:1000 covering the viewport -> closes again. D6 discharged and re-homed: DashboardSurface.vue hard-throw on a chart-less dashboard (the one route that failed 23.5 two-IR run, CORA 32/33) now degrades with a build-log warning while the ADR 0013 text-twin check stays FATAL; contract extracted to ir/contracts.ts so it is testable without a component harness (no new npm dep, ADR 0010). 23.5 open-items row 1 moves from Story 23.3 to 23.4. Also fixed: this story OWN page emitted a stray <main> and a premature </body></html> - a code span broken across a line break whose continuation line began with </body>, which CommonMark treats as an HTML block. 1 of 1,469 pages; a11y one-main now 0 failures. Live verification (file:// - the Browser pane 5-server-per-folder cap was full with other chats servers, so none was stopped): CSSOM 1,463 rules parsed (no comment truncation), dashboard Plotly explorer mounted plus sr-only text twin present, code pages 34,149 Prism tokens with #L{n} :target highlighting, JS-off pass shows 0 scripts / twin 221 items / pure-CSS nav - and JS-off chart behaviour is IDENTICAL to golden (host display:none, twin sr-only), i.e. inherited, with ADR 0031 already owning it. Mobile 375px: code pages scroll sideways (.code-tablist 447px) - measured IDENTICAL on the golden site, so INHERITED, not a migration regression. NOT DONE, deliberately: HtmlRenderAdapter.Render page composition and the .html writes REMAIN. Deleting them destroys the live golden side the owner verify-and-iterate pass needs in order to re-measure anything they ask for, so deletion should FOLLOW owner verification. Suite: 2,826 passed / 0 failed / 3 skipped on a clean run (one earlier run lost FileWatcherServiceTests to the documented rotating contention flake - green 3/3 in isolation; 5 preview servers from other chats were live, the recorded cause). web suite 125 passed. prior: IN PROGRESS 2026-07-28 (dev-story, baseline b696485). Task 1 DONE: true `--deep-git --spa` inventory = 1,408 IR pages / 1,409 .html on disk; all three deep-git surfaces + 300 `commit/` pages PRESENT (the 3,000 ms GitMetrics budget did NOT eat them — measured 2.42 s warm, so the hazard is real but did not fire this run). Two `oversizedPages` now, not one: `code-map.html` 8,012,656 B (grown from the story's 6,758,631) AND `git-insights.html` 2,508,588 B. Task 2 UNDER WAY: `JsonSpaRenderAdapter.RenderContent(PageView)` is already exactly the AC #3 region composer, so Task 2 = put every page on `PageView`; 8 of ~25 templaters migrated byte-identically (risk-quadrant, traceability, work-graph, cadence, how-to-read, about, design-system, diagnostics), golden fingerprint STATIONARY throughout (correct for now — it must not move until Task 2 finishes). TWO STRUCTURAL FINDINGS: (1) pages emitting `<header class="doc-header">` BEFORE `<main>` require `BodyHtml` to start at that header, else the region silently drops the page's own title block; (2) `deep-analytics.html`'s `:target` lightbox sits AFTER `</main>` and is therefore ALREADY MISSING from today's IR — a pre-existing capture defect the composed region fixes. Prior status: ready-for-dev, REVISITED 2026-07-28 (create-story 23.4 re-run at 811ba17): story FILE reconciled `blocked` -> `ready-for-dev` — it had been left saying `blocked` while this key said `ready-for-dev`, a one-artifact drift, now closed. Gate confirmed cleared and the story re-measured against what actually shipped. WHAT CHANGED FOR 23.4: (1) NEW GATE — Story 22.4 runs BEFORE 23.4 (owner D2), so Task 2 inherits ONE region producer instead of two, and 22.4 also lands the 46-delta convergence and the one-marker RenderWayfinding fix that deletes web/ir/adapter.ts's wayfindingRepaired + stillUnbalanced throw; confirm 22.4 is at least `review` before starting Task 2. (2) The RETIRED Story 22.3 file is now Task 2's SPEC, not just provenance — the `NavLocalContext` blocker (NO `path -> NavLocalContext` resolver exists; ~8 call sites of plumbing is the real cost of correctness, and two named tests fail byte-for-byte the moment the region stops being sliced), the 25-templater inventory with six axes of variation (extraHead used EXACTLY once; 12 distinct `<main>` class values; 6 templaters render a pager), eight pre-resolved traps, and a ranked test-gate map. (3) STALE PREMISES CORRECTED: Nuxt 3 -> ^4.5.1 with `engines.node` pinned (the EOL trap is CLOSED); `web/` now HAS a vitest suite + coverage gate (the "zero tests under web/" fact is false — write tests with new code); next uncontested ADR number is 0023 (0019 claimed-unwritten by 18.3, 0020/0021/0022 exist); golden fingerprint moved FOUR times in two days to f4a7cbac… at SiteGeneratorAdapterTests.cs:1242 — READ it, never quote a sibling story's; and the golden fixture generates WITHOUT --spa, so an IR-region change alone cannot move it (Task 2's byte-equality proof is the ONLY check on that work). (4) Q1/Q2 in the story file are ANSWERED (documented Node prerequisite; Node detection is Story 16.3's open item), Q4 is discharged by 22.4's ordering, and a NEW Q5 asks whether 23.4 fixes the DashboardSurface.vue hard-throw it now touches. prior: UNBLOCKED 2026-07-27 (dev-story 23.5): its stated precondition — that packaging is settled — is settled by ADR 0022 (Proposed). Node is a build-time toolchain and a generate-time runtime; the shipped artefact is a project-independent 3.78 MB prebuilt .output/ proven to render a DIFFERENT project's IR (1056/1056 this repo, 32/33 CORA) at ~4 ms/route; the standalone binary takes a documented Node prerequisite. Read 23-5-packaging-strategy-report.md before starting. TWO THINGS 23.4 INHERITS: (a) DashboardSurface.vue hard-throws on any project whose dashboard has no Hierarchy Explorer — a project-independence defect 23.5 raised rather than patched, and 23.4 touches this surface; (b) the ADR 0005 CSP amendment is STILL 23.4's and must land ONCE (ADR 0012 §Decision 5) — ADR 0022 is a DIFFERENT ADR and deliberately does not touch CSP. prior: create-story 2026-07-27 -> BLOCKED (owner decision D1): story file written and fully contexted at `23-4-migrate-remaining-surfaces-retire-c-sharp-html-adapter.md`, but the gate is Story 23.5 (`ready-for-dev`, not done) and specifically its Q2 — what the standalone binary does when Node is absent — because 23.4 DELETES the C# HTML writer that currently answers it. Do NOT flip to ready-for-dev because the file looks complete. FOUR OWNER DECISIONS locked at create-story: (D1) seed now, blocked; (D2) "retire the HtmlRenderAdapter" = C# stops WRITING .html while KEEPING a region-composition path (nav + wayfinding + <main>) that feeds the IR and the webview/SPA — the full-page assembly at HtmlRenderAdapter.cs:27-69 dies, the ~7,000 LOC of *Templater.cs do NOT; (D3) FULL componentization of the remaining 857 pass-through pages with `ir-content.css` retired to EMPTY per ADR 0018, or an enumerated residue with a named blocker per rule; (D4) Story 22.3 RETIRED, 23.4 is the answer to "who renders static HTML from the IR". ACs 3-8 extend the epic's two — same drift recorded in epics.md. THREE STRUCTURAL FINDINGS drove the shape: (1) the IR for 857 of 1,046 pages is PRODUCED BY THE CODE THIS STORY RETIRES — SpaDelivery.ExtractContentRegion slices nav+breadcrumb+<main> back out of the C# renderer's own full-page string captured at SiteGenerator.WriteOutput:3017 — so the region path must be stood up and proven BYTE-EQUAL before any deletion, or the IR goes dark for 82% of the site; (2) D2 and D3 are in APPARENT TENSION (D2 keeps rendered region HTML in the IR; D3 wants nothing monolith-derived in web/) and are reconciled on PROVENANCE — after C# stops writing pages, specscribe.css serves only the webview/SPA, so web/ owning AUTHORED scoped styles completes rather than reverses 23.2's decision; ADR 0016 means prose can never be fully decomposed without structured per-family IR data, which is a NAMED Epic 22 ask, not silent scope creep; (3) the owed ADR 0005 CSP amendment is PROBABLY DOCUMENTATION-ONLY now — 23.1's 'strict-dynamic' finding was about Nuxt HYDRATION, and 23.3 shipped `noScripts: true` so IR routes carry no Nuxt runtime at all, while ADR 0012's addendum already measured "no relaxation of the policy string is required"; re-measure before writing, and it still lands ONCE per ADR 0012 §Decision 5. INVERSION TO WATCH: GoldenContentFingerprint was 23.3's stationary assertion; here it must MOVE or be RETIRED by design, with a stated replacement drift gate for the C#-side region output. AC #8 hazard: build the surface inventory from a --deep-git run and VERIFY git-insights/deep-analytics/impact-map/commit-* are present — the 3,000 ms GitMetrics budget silently drops 3 surfaces and ~300 pages at errors=0. prior note: GATED by 23.1 spike: proceed but BLOCKED until 23.5 answers packaging (see the sequence note above) — retiring HtmlRenderAdapter is irreversible. 23.4 also OWNS the webview CSP change as a TWO-KNOB ATOMIC EDIT ('strict-dynamic' + experimental.payloadExtraction:false) with a regression test asserting prerendered content SURVIVES: the half-applied fix