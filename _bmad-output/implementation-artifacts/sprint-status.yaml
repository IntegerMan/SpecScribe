ving it while escalating other deletes means two teardown paths with different rules. Its `_progress` SPLIT (zero the epics roll-ups, KEEP the git pulse) is load-bearing — do not "simplify" it. (5) `diagnostics.html` echoes the configured OUTPUT ROOT inside its own region, so it is THE one page whose bytes are output-path dependent — the oracle harness runs two different output dirs and will diff on it in every class unless handled (22.2 finding). (6) on a NON-GIT fixture `FallbackCodeWalk` skips dot-dirs/bin/obj/node_modules but NOT the output dir, so a nested output feeds run 1's HTML into run 2's code-map. ⚠️ WHICH SIDE IS CANONICAL IS AN OPEN ANALYTICAL QUESTION, deliberately not pre-answered: 23.3 measured the IR/`_docs`-derived side as THE MORE COMPLETE render and 22.4 D3 already moved the STATIC page toward it — but the incremental counts are LARGER (16/20 vs 13/12), which 22.1 calls an OVER-count, not a richer render. Resolving that contradiction (genuinely more complete, or double-counting because `SyncDeferredDocFromDisk` ran on top of an already-populated `_docs`?) is the FIRST analytical task of the fix; Task 1's post-22.4 re-measure is the instrument. ⚠️ 22.1's STRANDED-SURFACE LIST IS A LOWER BOUND — its correctness matrix ran with deep-git OFF (the sandbox never copies `.git`), so per-commit pages, hotspot/coupling, impact-map and git-derived cadence were STRUCTURALLY INVISIBLE to that diff; AC #1 requires a deep-git-ON re-run, and memory `gitmetrics-3s-timeout-silent-deep-git-loss` warns that `GitMetrics`' hard-coded 3000 ms budget silently drops git-insights/deep-analytics/impact-map/commit pages at errors=0 (6496 ms measured cold), so a matrix run that lost 3 surfaces + ~300 pages would size the topology inventory from an incomplete site and call it complete. Known stranded set (deep-git OFF): code-map.html on add/rename/delete (NO route re-renders it), cadence.html on delete-story, the `_referenceMap`/`_codeReverseMap` citation seam (`epics/story-