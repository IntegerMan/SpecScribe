ree layers found it independently. Owner chose to adopt the saturated borders in specscribe.css (as for the fills); the audit then WIDENED it: only pending and deferred differed in VALUE, while done/active/review/ready differed only in which token NAME they bound (--status-done IS var(--moss-light), etc.), so all six now bind the semantic token on both surfaces and four are a zero-visual-change rebinding. .epic-status mirrors followed. REAL portal-visible change: pending border #d4c4a8 -> #b8b2a8, deferred #d4c4a8 -> #7a6250. SECOND HEADLINE: a live a11y defect on EVERY IR route — PageShell's scoped .skip-link tied at (0,2,0) with the generated .ir-content .skip-link (IrSurface puts class="ir-content" on PageShell's OWN ROOT), so chunk order decided the winner and BOTH outcomes broke UX-DR16 (PageShell's z-index:10 sits under the sticky nav's 100; the generated rule reinstates position:absolute). Owner chose promotion to a shared primitive: SHARED_PRIMITIVES is now ['pill','skip-link'], PageShell's copy is DELETED, and specscribe.css's .skip-link was corrected absolute->fixed so promotion did not regress the 2026-07-28 fix — one definition now protects both surfaces. ADR 0029 amended (allowlist "of one" -> two, new § Admissions, plus the note that its cascade reasoning never covered a scope class applied TO a component root). THIRD: AC #6 is SUPERSEDED BY ADR 0034 — C# no longer writes design-system.html (SiteGenerator.WritePage says so outright), Node does, and under PACKAGE_BUILD the Vue /design-system route was never prerendered, so its "parallel Nuxt route becomes the portal's surface" half was UNREACHABLE, not pending. Owner chose to retire the Vue showcase now: pages/design-system.vue DELETED, routes removed, /component-library re-pointed at design-system.html — and AC #5's live :deep() demonstrator, which lived on that page, was MOVED INTO CONVENTIONS.md §3 rather than lost. ⚠️ I CORRECTED ONE OF MY OWN LAYERS: the Acceptance Auditor claimed no live surface i