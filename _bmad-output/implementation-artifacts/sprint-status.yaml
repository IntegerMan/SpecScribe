ns **0 hits** (control query proves the search works) — no confirmed skill-generated index.md exists anywhere reachable; (d) BMad's OWN org ships **64% dangling entries** (bmad-module-game-dev-studio docs/how-to/index.md lists 11 local entries; the folder holds 4 files) which also PROVES those files are hand-authored, since a directory listing cannot invent entries — §3's "plausibly hand-authored" is upgraded to fact by contradiction; and the most representative real sample (cregis-dev/apex `_bmad-output/index.md`) carries **ZERO descriptions on all 22 entries**, so a perfect parser extracts nothing; (e) **`docs/index.md` is INVISIBLE to SpecScribe** — SourceRoot is `_bmad-output` and AdrSourceRoot is `docs/adrs`, so the one path the tooling most naturally writes to is never enumerated; the only two visible locations are anywhere under `_bmad-output/**` (renders, listed nowhere) and `docs/adrs/index.md` (already occupies the ADR landing slot, already regression-tested). §6's collision ANSWERED: an index.md is the PAGE, never the landing's data source, and landingPathAlreadyWritten already enforces it. §5 CONFIRMED and strengthened with two fossils of the removed home-index bands: `BuildIndexPage(IReadOnlyList<DocModel> docs, …)` **never reads `docs`** (dead parameter threaded through RenderIndex and every call site) and GenerateReadmeInternal's comment still cites a "document-grid card" that no longer exists anywhere in src/. D1 REJECTED on a11y (the only doc description rendering today is a hover-only `data-tooltip` on a quick-link pill — generalizing it scales a defect from 8 filenames to every doc); D3 rejected on reader value (subsumed by D2); **D2 NOT rejected but DEFERRED** — highest value and the only option closing the "generic docs are listed nowhere" gap, but it needs D0's cascade first or it is an empty list on every repo. Delivered surface-agnostically per 18.4's dependency: an entry grammar (bold OPTIONAL — the real downstream samples omit `**`; separator accepts em-dash/en-dash/spaced-hyphen since 6 of 8 samples use an em-dash against the documented ASCII hyphen; link text is the human title in every sample and is NEVER a filename fallback; description OPTIONAL), the `./`-relative → source-root → output-relative chain (⚠️ `_docs` is keyed on `Path.GetRelativePath` which yields **backslashes on Windows**, so a forward-slashed parsed href MISSES unless normalized; reuse PathUtil.EscapesRepoRoot for `../`, and CollapseSummary rather than a second collapser), and a **14-row failure taxonomy where every reporting row carries an AdapterDiagnosticCategory, DRAFTED WORDING, and its anchor root** (all DiagnosticAnchorRoot.Source; dangling/non-md/directory/escaping entries AGGREGATE to one Skipped per index, not one per entry — 18.1's review failed exactly this clause). Staleness: **not reliably detectable** — mtime is destroyed by git clone and entry-count diverges in BOTH directions across real samples, so no heuristic is proposed; per-entry existence resolution is the honest mitigation. **ADR 0019 PROPOSED (not written): "LLM-Generated Artifacts Are Enrichment-Only Inputs, Never Authoritative Ones"** — AD-4 covers optional-and-non-blocking but every existing input is human-authored or git-derived and therefore REPRODUCIBLE; a non-reproducible, unversioned, producer-anonymous input is a third class needing its own invariant. Follow-on scope boundary written (proposed Story 18.6: Frontmatter.Description + DocModel.Description + generalized extractor + the parser, NO page/nav/module-identity touch; D2 sequenced after; **18.4 must consume precedence 3, not the parser**, since `_bmad-output/forge/` will have no index.md on any real repo). ⚠️ 8 src/** files were modified by a CONCURRENT Epic 20 hierarchy-rollout session (20.7/20.9) during this story and were left untouched; the tree was clean at story open. Also corrected: docs/ has 6 loose .md files, not 7. ⛔ **THE SUITE COULD NOT BE RUN — the working tree does not compile, 