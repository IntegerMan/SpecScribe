  20-1-interactive-explorer-architecture-spike: done # code review 2026-07-24 (3 parallel adversarial layers: Blind Hunter, Edge Case Hunter, Acceptance Auditor; scoped to this story's own File List — siblings 19.2/20.2/21.3/23.1/24.1/5.1 excluded from the same b9582a4..HEAD range). BOTH ACs PASS on substance; all 6 decision-table rows answered; every Debug Log line-number citation re-verified at baseline 81897ea and CORRECT (unusually clean); the no-production-code invariant holds through review. 1 decision resolved (owner: correct the contract in place, not hand the payload question to 20.5), 13 patches applied — ALL DOCUMENTATION, zero src/tests touched — 7 deferred, 3 dismissed. FIVE FINDINGS THAT MATTER DOWNSTREAM: (1) **the §1 edge-join contract was WRONG and Story 20.3 binds it** — `epic-20`/`20.2` (SunburstExplorer.cs:71,102) vs `e20`/`s20.2` (WorkGraph.cs:208,214) are DISJOINT id spaces, most edge endpoints (d*/a*/src:/res:/retro:) have no wedge at all, and _workGraph is PER-EPIC SUBGRAPHS not one graph (dedup + MaxFollowUpsPerEpic=40 overflow + IsEmpty NFR8 gate + Reprefixed hrefs), so the promised "verbatim" join returns ZERO MATCHES and the pane would render empty with no error; the real translation rule is now recorded in new §1a. (2) **the zero-dependency premise was FALSE WHEN WRITTEN** — assets/prism.js is a 100,409-byte vendored Prism 1.30.0 shipped via CopyEmbeddedAsset (SiteGenerator.cs:1779), and it was the load-bearing argument for declining Plotly; its guarded copy is exactly the pattern that makes a vendored Plotly tractable. (3) **the size ceiling failed all three measurable counts** — unenforceable unit ("≤~8-10 KB … measured as added LINES"), false "comparable to the codemap block" justification (that block is 13,597 bytes), and a SILENT 36-70% overrun (shipped explorer block 13,602 bytes) with 20.3 unbuilt, against a contract that named overflow as a trigger; WITHDRAWN not re-numbered, since ADR 0012 supersedes hand-written JS — the surviving budget question is a PAYLOAD byte ceiling, which the spike never asked (→ deferred to 20.5/20.6). (4) **ADR 0010 §1 was re-read when it needed AMENDING** (Ratified #1 says charting JS is "not for baseline/default pages"; ADR 0012:116 supersedes it outright) **and §6's shared-engine invariant was DROPPED** while only its file-location clause survived — the anti-pattern list bans a second WEIGHT geometry and is silent on ARC geometry, the exact gap 20.2's third arc renderer went through. (5) supersession banner added: ADR 0012/0013 reverse 5 recorded decisions. Also corrected: `kind` is 6 values not 4 and does NOT drive activation (the rule is structural has-children → new §1b); the RenderParity "a dropped island fact must make the forms differ" guarantee did not hold (RenderParity.cs has zero island awareness; what shipped is 2 string asserts in SiteGeneratorSpaTests.cs:158) and its "(or documented equivalent)" hatch carries no documentation obligation; the webview "non-goal" framing left INHERITED island markup undispositioned (nonce-locked CSP → 20.2 had to add unnamed stripping) and a new island fact needs a HostRenderException or webview parity fails on a sanctioned omission; 3 [x] subtasks re-opened and completed (19.1 planned-vs-shipped 5-vs-4 edge table back-filled — `covers`/`cites` need requirements-coverage and code-citation maps, two DIFFERENT sources, so epics.md AC1's 5-kind prose still needs correcting there); stale "Story 10.7 in active dev" (it was done 2026-07-20, BEFORE this story was drafted) and specscribe.js "~1058 lines" (1573) fixed in 3 places each. DEFERRED → deferred-work.md: payload byte ceiling + DOM-level test strategy (none exists; repo has no JS runner; load-bearing for 20.6's text-twin gate) + island `</script>` escaping (20.2 safe only via System.Text.Json's DEFAULT encoder — incidental, not contracted) → 20.5/20.6; epics-host divergence (contract named 2 island hosts, only dashboard shipped; Epics.cs:32 has orphan explorer attrs)