sion SURVIVED adversarial verification. Patch round applied all 18 open [Review][Patch] items (the one [Review][Defer] stays deferred to create-story 18.2's review) — headline corrections: the "command panels degrade correctly" row was FALSIFIED (HowToReadTemplater.AppendCommandLegend gates on commands.IsEmpty, not on a Command() miss, so the always-rendered how-to-read.html names the module — the LOSING one in a dual install); ArtifactCoverage.Specs is a FOURTH un-gated BMM-vocabulary surface that the identity fix does NOT reach because it never reads ModuleContext.Module (now ADR Decision 5a, its own slice); the Informational diagnostic's EMISSION SEAM does not exist (Detect takes no diagnostics sink, detection runs TWICE with the un-diagnosed BuildNav path winning, and the repo-root subject path mis-anchors against source-root RelativePath); AC #2's category+wording for the four declared non-goals was missing and is now supplied; ADR citations converted to SYMBOL anchors after line drift was confirmed inside ModuleContext.cs and SiteGenerator.cs within days. prior: create-story 2026-07-21: coverage-map spike over BMad's OWN module ecosystem beyond BMM/GDS (BMad Builder, Test Architect, Creative Intelligence Suite) — distinct from the third-party-framework Epics 11-15. Key finding to confirm: BMM+GDS already Supported:true in AboutSddTemplater; ModuleContext already reads module-help.csv/manifest generically, so a new module likely EXTENDS BmadArtifactAdapter/ModuleContext rather than needing the not-yet-built adapter registry (opposite assumption from 11.1-15.1). No src/tests changes; no ADR unless a genuine fork is found. Downstream: 18.2 (already seeded in epics.md, not yet detailed).
