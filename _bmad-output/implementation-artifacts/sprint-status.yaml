ing deep-git flake, every one confirmed passing in isolation and none in a class this story touches. Non-goals held: no `ArtifactCoverage` change (still Story 18.6, seated in BOTH artifacts and re-verified), no `config.yaml` read, no `BmadModule.TestArchitect`, no About-SDD roster row, no second adapter or registry, no sixth diagnostic category, no new `--status-*` token, no hard-coded module label, no widened glob, no chart. ⚠️ **OWNER ITEM CARRIED FORWARD, NOT ACTIONED**: `epics.md`'s stale "strongly GDS-oriented … requires generalization" clause still lives at TWO sites that must move together (`:173` and Story 18.1's AC #2 at `:3082`) — surfaced as instructed, deletion is the owner's call. GATED BY 18-2 (`review`), whose `ModuleContext` this story widens twice. prior: create-story 2026-07-27 (baseline 40c7ee9): backlog -> ready-for-dev. THREE OF 18.1'S TEA FACTS WERE CORRECTED AGAINST UPSTREAM and the corrections change the story's shape, so do not implement from 18.1's coverage map: (a) the filenames are **traceability-matrix.md** and **nfr-assessment.md**, NOT `traceability-matrix.csv`/`nfr-report.md` — read from each skill's own workflow.yaml, the same doc-site-prose-vs-real-file trap 18.1 was itself burned by; (b) TEA's `module.yaml` declares `test_artifacts` default `{output_folder}/test-artifacts` and `{output_folder}` **IS** `ForgeOptions.SourceDirName` (`_bmad-output`), so in a DEFAULT install TEA's markdown ALREADY RENDERS today as generic pages — this story is *interpret and label*, not *make visible*, and reading `_bmad/tea/config.yaml` drops from "the first thing 18.2 must resolve" to an explicit NON-GOAL (it only matters under an overridden path, and closing it needs the same cross-cutting config/TOML decision 18.4 defers for `forge_output_path`); (c) **TEA also writes two JSON artifacts SpecScribe structurally cannot see** — `gate-decision.json` (the actual PASS/CONCERNS/FAIL verdict, the single most decision-relevant thing TEA produces) and `e2e-trace-summary.json` — because `SiteGenerator:4480` globs `*.md` only, the identical invisible-artifact class as 18.4's `forge-report.html`. FOURTH FINDING, load-bearing for the design: **the realistic target repo is BMM + TEA, not TEA-only** — TEA's own module-help.csv declares `bmad-testarch-atdd` as `preceded-by: bmad-create-story:create`, i.e. TEA is designed to COMPOSE with BMM's story workflow, so the primary scenario is the dual-install case 18.2 just made safe, and TEA-only is the honest-degradation path. FOUR OWNER DECISIONS (elicited 2026-07-27, all locked): D1 **BOTH** a `test-artifacts.html` list page (ListRow grammar per 10.8, page+nav omitted entirely when empty, top-level path per 18.4's `ideas.html` landing-collision rationale) **AND** a dashboard Module Coverage panel, the panel built module-agnostically for reuse but with NO second module implemented; D2 **PARSE** `traceability-matrix.md` into the existing Story 21.1 traceability surface (not render-and-label, not summarize-only); D3 **WIDEN discovery to the two TEA JSON filenames** — exact-filename, module-scoped, schema-versioned — which makes SpecScribe ingest a non-markdown source for the first time and therefore **REQUIRES AN ADR (number 0020; 0019 is claimed-but-unwritten by 18.3)**; D4 ADR 0015 **Decision 5a is NOT this story** — split out to the new 18-6 key below, seated in epics.md and here in the same change. ⚠️ **THE JOIN IS THE HARD PART AND IT IS UNRELIABLE — the story's design rule is non-negotiable**: SpecScribe's traceability.html is a REQUIREMENT × COVERING-EPIC matrix built from RequirementsModel, which is parsed from **epics.md's "## Requirements Inventory"**; TEA's matrix is an ORACLE-ITEM × TEST matrix keyed P0–P3. Different axes. Upstream `step-03-map-criteria.md` states the criterion ID format is **not specified** (an Oracle Item may be a formal requirement, an OpenAPI endpoint, or a synthetic journey — `inventory_basis` says which), and `gate-decision.json`'s `target.id`/`tar