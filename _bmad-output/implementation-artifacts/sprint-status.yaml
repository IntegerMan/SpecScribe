utRoot guard are single-root assumptions (AD-5 / ADR 0027 "safe" = proven byte-identical); settings persistence is single-valued so a shape change amends ADR 0014/0003 and inherits Story 5.5's whole-document-deserialization blast radius; and ADR 0017 makes ANY output-path scheme a PUBLIC URL change with no href rewriter to compensate plus the Nitro ".." substring guard disqualifying up-level schemes outright. Four source-discovery options are pre-framed for pricing (A status quo / B auxiliary document roots on the AdrSourceRoot pattern / C raise root to RepoRoot — likely disqualifying, price it precisely enough to kill it / D root-qualified SourceRef path type). DELIVERABLES FIXED AT TWO and the story SHIPS NO PRODUCTION CODE (Task 7 proves it, per Story 25.3's pattern): ADR docs/adrs/0039-*.md amending ADR 0038 — NOT a second registry ADR, 0038 §Inherited-by binds Epics 11/12.3/13/14/15 to one registry decision — plus _bmad-output/implementation-artifacts/4-9-spike-report.md. 0019 remains claimed-but-unwritten by Stories 18.3 and 22.3; do not take it. TWO HANDOFFS RECORDED RATHER THAN ADOPTED per CLAUDE.md hunk attribution (12.2 is still `review`, so its hunks are live for its own code review): ForgeOptions.Resolve's walk-up comment says markers at the same level resolve "by SourceDirNames order (BMad first)" when the array is .planning/.gsd/.specify/_bmad-output and BMad probes LAST — contradicting both the array above it and ADR 0038 §3; and ADR 0037 is still missing from docs/adrs/README.md's index (12.2 §F5). Two pre-existing issues flagged as NOT-YOURS so the dev agent does not chase them: the FileWatcherServiceTests load flake (12.2 §F7) and the crossorigin/file:// unstyled-portal defect (12.2 §F2, NFR-3-relevant). Timebox ~2 days. Epic 4 stays in-progress and epic-4-retrospective stays `done` deliberately. prior status: backlog # Story 4.9 added 2026-08-06 (create-story 12.2, owner-directed) — see the comment block above for the seating rationale.

