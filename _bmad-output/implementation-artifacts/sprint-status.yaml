  22-1-spike-incremental-recompute-and-ir-delta-transport: done # code-review 2026-07-24 → done (1 decision-needed resolved, 5 patch fixed, 3 deferred, 12 dismissed; no prod code — spike). dev-story 2026-07-23: measurement spike done. Quarantined probe spike/ir-incremental/ drove the real SiteGenerator against a mutable copy of this repo's artifacts; incremental watch-route output diffed byte-for-byte vs a cold full-regen oracle. HEADLINE (AC#1): RegenerateEpics is NOT oracle-faithful even at NO-OP — 56-page work-graph over-count on every epic (Epic 1: 16 items/20 links incr vs 13/12 oracle) — the primary correctness risk ADR 0008 named, MEASURED (pre-existing shipped-watch defect, not Epic-22-introduced). Correctness (AC#2): holds ONLY for content-only generic-doc edits (GenerateOne = byte-perfect); every topology change strands the surfaces no narrow route refreshes (Code Map, delivery cadence, reference-graph citations `epics/story-9-4.html`, ADR code-view pages, orphan/prune gaps) → full-rebuild fallback required for those. Latency: incremental 3×–84× vs full; deep-git increment only ~14% of gen-time at 1211 pages (updates ADR-0008 "git-dominated ~3.2s" premise — page rendering now dominates). IR-delta (AC#2): "byte-blind chunker" premise STALE — SpaDelivery.MaxChunkBytes=2MB already ships; but chunk-level delta is coarse (1-line edit re-ships 9 chunks/19.3MB/39.9% of a 48MB IR). GATE (AC#3): 22.2 proceed RE-SCOPED (byte-cap done → aim page-level delta granularity + cap oversized pages); 22.3/22.4 proceed as scoped; 22.5 RE-SCOPE required (fix _workGraph parity + add topology invalidation for cross-artifact seams, full-rebuild fallback until proven, adopt the spike's oracle-diff harness as acceptance test); 22.6 gated on 22.2's finer delta. Durable deliverable = 22-1-spike-report.md (NOT a new ADR — ADR 0008 already decided). NO production code shipped (src/tests untouched, site byte-identical; the 1 golden-fingerprint test failure is a PRE-EXISTING stale-constant drift reproduced identically on clean main @ b9582a4 — actual hash 3e0d2bd3…, unrelated to this spike). Follow-up: the RegenerateEpics work-graph over-count is a live `specscribe watch` defect today — standalone fix or fold into 22.5. Full suite at dev time 2162 passed/3 skipped/1 golden drift. CODE REVIEW 2026-07-24: the golden failure does NOT reproduce — full suite green on current main f9b52bd (2336 passed/3 skipped/0 failed, GoldenContentFingerprint stable x2); spike-time failure was transient shared-main drift (pin 36cd7e64 at b9582a4, since re-blessed 5x to 89c8cf0c), no constant bump/code change needed. Report's "green" line confirmed correct.
  22-2-canonical-ir-schema-and-versioning: done # code-review 2026-07-29 (/bmad-code-review 22.2, three layers: Blind Hunter + Edge Case Hunter + Acceptance Auditor): review -> done. 1 decision-needed resolved by owner + 5 patches applied + 5 deferred + 4 dismissed. SCOPING: `SiteGenerator.cs`'s 1,402-line raw diff is almost entirely SIBLING work (22.4's BuildSpaBundle/RenderWebviewSurfaces unification, plus 18.4/18.5/18.6/20.7/20.8/20.9), so it was reviewed by CURRENT-STATE SYMBOL READ, not diff — and the review's own first package MIS-LABELED `SpaDelivery.cs`/`SiteGeneratorSpaTests.cs`/`SiteGeneratorWebviewTests.cs` as "clean" when they carry 22.4's schemaVersion 1->2 bump + two-marker ExtractContentRegion rewrite and 20.7/20.9/22.4/23.2/23.3-tagged tests; both review layers caught it independently, confirming CLAUDE.md's attribution-by-hunk tier. THE DECISION (owner chose exact-encoded): the manifest's per-page `bytes` still carried RAW UTF-8 content bytes — the very approximation Task 7 closed for the chunk ceiling — so 22.5/22.6 could have under-read wire cost by up to 6x on escape-heavy regions; now reuses the pre-encoded `EncodedPage.ValueJson` token, with `ManifestOversizedPage.ChunkBytes`' doc comment restated (both exact-encoded, differing only in SCOPE: whole chunk vs one page's value). 5 PATCHES: whitespace-only MetaDescription now falls back to title (`{ Length: > 0 }` was true for `" "`); `ExtractNavMarkup` gained the anchor-before-`<main>` guard its sibling `ExtractContentRegion` always had, via a new SHARED `MainLandmarkMarker` constant so the two extractors cannot diverge on "where chrome ends"; a new `Manifest_RoundTrips_WhenAPageIsDeclaredOversized` closes AC #3's blind spot (the round-trip suite had only ever seen `oversizedPages` EMPTY, so a shape regression in that record — the one field this story invented to declare an exception — would have passed silently); obsolete `string.Copy` (SYSLIB0050) -> `string.Concat`; `ChunkBytes` long -> int to match `ManifestEntry.Bytes` (value already originates from GetByteCount). AC #4's literal "553 vs 548 anchors" is formally UNMET and that is FINE — real count is 1679, disclosed in Completion Note 1, replaced by a strictly stronger byte-identical `<main>` assertion; the AC text itself was never amended, so a future reader diffing ACs against tests will find no "553" anywhere. AC #7's epics.md cross-ref VERIFIED directly at epics.md:4031 (it was absent from the review package, not from the repo). Full suite 2812 passed / 0 failed / 3 skipped (all 3 pre-existing symlink-privilege gated — NOT the "zero skips" 25.1 records for CI); GoldenContentFingerprint unaffected. 5 deferred to deferred-work.md § code review of story-22.2. prior: dev-story DONE 2026-07-26 (HEAD 261b300 at start; frontmatter baseline_commit cd7f302 preserved per workflow rule). ALL 7 ACs met. `spa/manifest.json` + `spa/pages-*.json` PROMOTED IN PLACE into the versioned canonical IR (owner D1 — no `ir/` dir, no rename): `schemaVersion: 1` as a monotonically-increasing integer beside MaxChunkBytes/MaxPagesPerChunk (bumps on breaking shape change only; additive fields never bump, which is why the client needed no change — pre-22.2 is version 0 by implication), plus per page a head projection {title, description} with the RenderHeadOpen fallback resolved at emit, a scriptIslands[] strip-or-nonce declaration, a truncated-SHA-256 contentHash and a byte size (owner D2 — ADDRESSING ONLY: no delta transport, no client consumption, no incremental-route change). AC #2 CLOSED PROPERLY: the chunk budget moved from RAW UTF-8 bytes to the EXACT JSON-encoded tokens (pre-encoded once and reused to assemble the file, so the number enforced and the bytes written cannot disagree — pinned by a test asserting the assembled chunk is byte-identical to serializing the equivalent Dictionary<string,string>), so a multi-page chunk can no longer overshoot the 2 MB ceiling; the ONE unsplittable case (a single page whose own encoded size exceeds it — regions are atomic) is now DECLARED in manifest.oversizedPages with the file's REAL measured size, never silent. On this repo that names exactly two: code-map.html 9,139,221 B and git-insights.html 3,107,287 B — the latter reproducing 22.1's "3.08 MB against a 2 MB guard" to the byte. AC #4 CLOSED ON BOTH SURFACES: SiteGenerator :2792 (webview) and :3062 (SPA) both called BuildIndexPage with named args starting at `counts:`, silently skipping the positional codeItemHref; both now pass CodeItemHref, and all 5 Git Pulse bar labels (3 of them code/*.html) are links on static + IR + webview. ⚠️ HONEST CORRECTION to the AC's numbers: 553/548 were 23.1's snapshot counts; this repo renders 1679 anchors in the dashboard <main>, EQUAL on both surfaces — so the tests pin the WHOLE <main> block byte-identical rather than a count that drifts with the data (strictly stronger; fails on any future argument divergence at that call site). Webview link-target hazard DISCHARGED WITH EVIDENCE, no HostRenderExceptions entry needed: the bridge already routes absolute-scheme hrefs to openExternal, and captured surfaces ALREADY ship 2322 code/*.html links on code-map.html + 464 on git-insights.html + 331 on risk-quadrant.html, so the 5 restored links are no new class of behaviour. AC #5 nav context via the RECOMMENDED SLICE (new SpaDelivery.ExtractNavMarkup + one shared SiteGenerator.CapturedNavMarkup helper feeding both capture loops, returning ONE instance per page because the webview loop's ReferenceEquals degrade check depends on it) — no NavLocalContext plumbing needed; an ADR page now carries aria-label="ADRs" on both consumers and about.html is unchanged. AC #3 = new CanonicalIrSerializationTests: the manifest round-trips BYTE-IDENTICALLY through an INDEPENDENTLY DECLARED typed model (a field added on one side and not the other fails loudly) and every chunk as Dictionary<string,string>, with ZERO enumerated exceptions. AC #6 determinism PROVED BY REPEATED RUNS (frozen source snapshot, same output dir: manifest and every chunk byte-identical) and pinned by a test. AC #7 = docs/adrs/0016-ir-carries-rendered-prose-html.md (PROPOSED — ratification is the owner's), cross-referenced from docs/adrs/README.md, ADR 0008 (§Decision 1 + §Decision 4 callouts + References) and epics.md. ⚠️ TWO LIVE FINDINGS FOR LATER STORIES. (1) The story's premise that HierarchyExplorer.cs:349 emits a bare <script> into the body is STALE — that handshake moved to HierarchyExplorer.BootScript on the CHROME seam, and measured across the whole real site there are ZERO executable scripts in the IR and ZERO in the webview bundle. BUT IT IS LATENT: BootScript is emitted BETWEEN the breadcrumb and <main>, and ExtractContentRegion slices FROM the breadcrumb, so any CAPTURED page (all have breadcrumbs) that gains HierarchyEngineNeeded ships it into both consumers — where the webview's JsonDataIsland regex cannot match it. THIS LANDS THE MOMENT 20.7/20.9 MOUNTS A HIERARCHY CHART ON IMPACT MAP / WORK GRAPH / CODE MAP; the new scriptIslands declaration classifies exactly that case `executable` and a test pins it using the real BootScript shape. (2) The webview's `data-island` HostRenderException claims islands "are stripped from the webview content region" — TRUE ONLY of the FAMILY path. Captured surfaces are sliced by ExtractContentRegion and never touch that regex, so impact-map.html reaches the webview carrying its impact-map-data island UN-STRIPPED (measured with `webview --deep-git`). Left unfixed DELIBERATELY: making the webview consume the declaration is 22.4's job. ⚠️ HASH VOLATILITY: NOTHING was normalized, deliberately (a hash describing anything but the shipped bytes would lie to 22.5/22.6). Two false alarms run down — a CONCURRENT SESSION editing 5-5/deferred-work/Commands.cs/SettingsStore.cs mid-run, and my own harness using two different output dirs. The one real caveat 22.5/22.6 must expect: diagnostics.html echoes the configured OUTPUT ROOT inside its own region, so it is THE one page whose contentHash is output-path dependent and will differ machine-to-machine on identical input. Pre-existing trap found in passing: on a NON-GIT fixture FallbackCodeWalk skips dot-dirs/bin/obj/node_modules but NOT the output dir, so a nested output feeds run 1's HTML into run 2's code-map (not IR volatility; the real repo is a git checkout with a gitignored output dir). VERIFIED LIVE in a browser (:8103, app.html): bars are links and navigate client-side, an ADR page swapped in shows the ADRs band with real pills and no generic band, 0 scripts in swapped regions, 0 console errors, content-swapped re-init seam still fires. SCREENSHOTS UNAVAILABLE — the Browser pane is not displayed in this session, so verification was by live computed DOM/navigation state; the owner's verify round should still LOOK at both surfaces. Pre-existing + out of scope, observed: the Plotly chart does not mount in the SPA at all (HtmlRenderAdapter.Render is the only emitter of the bundle tag; BuildEntryShell never emitted it) — the ADR 0013 text twin IS present, which is the contract; that gap is 20.7/22.4's. DEVIATION RECORDED: worked directly on `main`, not a branch/worktree as Task 1 says, per CLAUDE.md § Concurrent work ("isolation is not available and is not the fix") — branching a shared tree would capture another session's auto-committed work; no reset/checkout--/clean was ever run and every edit was grep-verified after writing. SUITE 2427 passed / 0 failed / 3 skipped (baseline 2405/0/3, +22 tests); the 3 skips are the pre-existing symlink-privilege tests. GOLDEN FINGERPRINT UNCHANGED at 2050b586… (not regenerated) — that is what makes "the static site's bytes are unchanged" a measurement. One intermediate run showed 2 failures (BurstOfSaves, GitInsights hub) — both pass in isolation, did not recur, are named members of 23.2's rotating file-write-contention flake, and touch no symbol in this story's File List. PRIOR: create-story 2026-07-25 (baseline cd7f302). Story file 22-2-canonical-ir-schema-and-versioning.md; its 7 ACs SUPERSEDE epics.md's 3 (Task 10 records that drift in epics.md + here, per CLAUDE.md). THREE OWNER DECISIONS locked at elicitation: (D1) PROMOTE spa/ IN PLACE — spa/manifest.json + spa/pages-*.json BECOME the canonical IR, extended not replaced; no new ir/ dir and NO RENAME (that is 22.4's call), so the 5-anchor defect gets fixed where it lives and there is never a second capture path. (D2) PER-PAGE HASH + OVERSIZED-PAGE CAP — manifest gains contentHash + bytes per page so 22.5/22.6 can diff at page granularity; ADDRESSING ONLY, no delta transport, no client change, no incremental-route change. (D3) 22.2 PROPOSES THE ADR — new ADR 0016 (0001-0015 taken) amending ADR 0008 §Decision 1, because 23.1's owner-directed HARD REQUIREMENT (the IR must carry Markdig-rendered prose HTML as strings) contradicts that clause's "view models plus pre-rendered SVG chart fragments" and was recorded ONLY in a spike report; ADR 0013 §5 already amended the SVG half, so the prose half is the remaining gap — a cross-cutting contract change, so CLAUDE.md's ADR-trigger rule applies. ⚠️ epics.md AC #2 is STALE — do NOT implement the byte-blind chunker; the 2 MB cap ships (SpaDelivery.cs:56) and the ONLY real gap is a single page over the cap still producing an over-cap chunk (3.08 MB measured vs a 2 MB guard). ROOT CAUSE of the 5-anchor defect, verified at cd7f302: static passes CodeItemHref (SiteGenerator ≈:3226) but the SPA (≈:3051) and webview (≈:2784) BuildIndexPage calls use NAMED ARGS starting at `counts:`, silently skipping the positional codeItemHref → Charts.GitPulsePanel(pulse, null) → CodeItemLink degrades to plain text; one-arg fix at each site, but the webview needs a link-target check because CodeItemHref can return an EXTERNAL url. NEW FINDING for the island-declaration work: the webview's JsonDataIsland regex strips only `<script type="application/json">`, so the Story 20.5 EXECUTABLE inline handshake script (HierarchyExplorer.cs:349) is NOT covered — dev must verify whether it reaches the webview unhandled. Nav-context fix has no path→NavLocalContext resolver (built inline at ≈:1123/1313/1566/2095/4072 and discarded), so recommended route is slicing the page's own `<nav class="site-nav">…</nav>` out of _spaCapture minus NavToggleScript, preserving the AD-1/AD-2 no-disk-readback boundary. # PRIOR: FOLD-IN from Story 23.1 (owner-directed 2026-07-23, dev-story): the 23.1 spike consumed the shipped SpaDelivery form as a PROXY IR and measured it against the static golden output, surfacing TWO things 22.2 must absorb when it generalises the capture. (1) A LIVE FIDELITY DEFECT, not a design question: the SPA capture DROPS 5 anchors from the dashboard's git-pulse panel — 3 of them `code/*.html` links (`<a href="code/tests/…/SiteGeneratorAdapterTests.cs.html">` renders as plain text in the capture but is hyperlinked in the static page). Golden `<main>` has 553 anchors, the IR 548; this is the entire 277-byte dashboard parity delta, and it silently degrades the SPA and webview surfaces TODAY. Owner chose to fold the fix into 22.2 rather than patch SpaDelivery standalone. (2) WHAT THE FRONT END WISHED THE IR CARRIED (23.1's stated input to this story): a structured head/meta projection (title, description, og tags) so a consumer need not re-derive it; the page-local nav context band (`site-nav-local-context`) that the static renderer computes but the capture discards, replacing it with the generic key-views nav; and an explicit declaration of which embedded `<script>` islands a consumer must strip or nonce (the dashboard carries SpecScribe's own 20.9 KB `sunburst-explorer-data` island, which the webview already strips by hand). ALSO STILL BINDING from 22.1: proceed RE-SCOPED — the byte-cap is already shipped (SpaDelivery.MaxChunkBytes=2MB), so aim at PAGE-LEVEL delta granularity + capping oversized pages. See 23-1-spike-report.md §"Follow-ups outside this story" and 22-1-spike-report.md.
  22-3-static-html-rendered-from-the-ir: retired # RETIRED 2026-07-27 (owner decision D4 at create-story 23.4). 22.3 said static HTML becomes an IR projection rendered IN C#, byte-identical to golden. Story 23.4 says the Nuxt projection layer writes every .html and the C# page render is retired. Both cannot be true, and Nuxt-over-IR is the RATIFIED direction (ADR 0009). Replacement: Story 23.4 (23-4-migrate-remaining-surfaces-retire-c-sharp-html-adapter). Recorded in epics.md §Story 22.3 in the SAME change per CLAUDE.md. NOTE for Story 22.4: 23.4 AC #3 deliberately KEEPS one C# region-composition path (nav + wayfinding + <main>) feeding the IR and the webview/SPA — so 22.4's "retire the duplicate, non-IR data paths" must be restated against that surviving path, not read as contradicting it.
  22-4-spa-and-webview-as-ir-consumers: done # | ✅ CODE REVIEW 2026-07-28 (/bmad-code-review 22.4, scoped by File List per CLAUDE.md; sibling Stories 18.2/18.5/25.3/18.4 excluded from the same 6017c2c..HEAD range): review -> done. 2 decision-needed, 7 patch, 7 defer, 3 dismissed. ⚠️ TWO Task 3 subtasks were marked [x] but had NOT been done — "share ONE WorkInventory instance across RenderEpicsPages/SPA/webview" and AC #5's required work-graph agreement test. Owner resolved both decisions (DR1 build the shared instance; DR2 consumer skips degraded pages) and directed all 9 patches applied. 8 applied in full; DR1 PARTIALLY: BuildSurfacePrelude is now memoized so the SPA and webview share ONE instance (a --webview run previously built two equal ones — the exact defect Task 3 named, live inside the seam built to end it), but RenderEpicsPages cannot join without moving the golden fingerprint, which AC #7 forbids; that residual third IS Story 22.5's Trap 1 and is re-homed there by owner decision. AC #5's test now exists and its VACUITY GUARD FIRED FIRST, proving the old fixture rendered no work graph at all — which is exactly why 22.4 could report AC #5 as zero-delta on the golden fixture; the fixture gained a deferred-work.md resolved by a SPEC DOC (the real ResolvingHref path the defect nulled). Also fixed: a stale-v1 IR now THROWS instead of warn-then-corrupt (the balance repair was deleted, leaving no detector); the story-fragment degrade now emits one GenerationEvent instead of forking the IR from the static HTML at errors=0; the webview's exclusions moved INSIDE CapturedRegions as a skip predicate so an excluded page is never sliced; BuildOutline's silent story-drop became an invariant throw; ADR 0024's "exhaustively five" corrected to six (BuildOutline was omitted). ⚠️ epics.md's 22.5 gate clause CORRECTED — it claimed 22.4 "shares one WorkInventory across the epics-page, SPA and webview builders" (false) and that the pre-nav _workGraph build is one "which 22.4 does not touch" (also false — BuildWorkGraphModel calls the rerouted ResolveDeferredModel). ⚠️ VERIFICATION CAVEAT, measured not assumed: the full suite is NOT a usable regression instrument in this tree — two consecutive UNCHANGED baseline runs failed 15 and 19 tests with barely-overlapping sets (memory gitmetrics-3s-timeout-silent-deep-git-loss firing under parallel load; run 2 took 7m27s vs 3m54s). Targeted runs used instead: 92 passed / 0 failed across SPA/webview/epics-removal/SPA-parity/file-watcher, and 88/88 web tests. The golden fingerprint DID move mid-session, attributed to a CONCURRENT specscribe.css edit at 15:56:40 and proven not-ours because the golden fixture never enables EmitSpa/CapturePages, making every path touched here unreachable in it. prior: ✅ DELIVERED dev-story 2026-07-28 (baseline 6017c2c, run on 06b300c): in-progress -> review. All 9 ACs met. ADR **0024** proposed (NOT the 0023 the story file predicted — a concurrent session took 0023 for Story 25.3 and had it ratified the same day; 0019 is still claimed-but-unwritten), cross-referenced from README + ADR 0005/0008/0016. ONE SEAM = 3 members (`BuildSurfacePrelude` + `BuildFamilySurfaces` + `CapturedRegions`); both surfaces are FILTERS over it, and the webview’s entire remaining surface-specific behaviour is exhaustively its exclusion set, degrade skip, island strip, SourcePath join and WrapDocument entry doc. ⚠️ MEASUREMENT METHOD MATTERS: parity was measured against a purpose-built BASELINE BINARY (HEAD versions of this story’s 3 files restored into a copy of the live tree) because the naive before/after straddled a concurrent session’s commits. The first diff attempt reported a VACUOUS "822/822 identical" — the webview payload’s surface field is `content`, NOT `contentHtml`, so it was comparing undefined to undefined. Do not trust a bundle diff without asserting the field name exists. RESULTS: webview **828/828** surfaces identical in set + emission order, byte-identical `entryDocument`, 0 title/sourcePath diffs; the 45 content movers are 33 wrapper-only (+30 B each: 11 retro + 22 ADR pages, i.e. the pager-bearing captured set) + 10 work-graph (9 epic pages + `work-graph.html`) + 2 harness artifacts (`diagnostics.html` = different --output root; `about.html` = +15 B " · 06b300c" because the baseline copy is not a git checkout). TWO-REGION-SHAPES was BIGGER than epics.md estimated: not "~853 captured pages" but **594 of 1,400** IR pages unbalanced (the rest carry no pager, so their bare breadcrumb was already balanced) -> **0** after the fix; wrapper-bearing regions 189 -> 783; every mover EXACTLY +30 B, the literal `<div class="page-wayfinding">\n` opener. 46-DELTA root cause was NARROWER than "pipeline ordering" implied, and the story’s line numbers were stale (:326/:339/:3052 -> :396/:409/:3150). The WHOLE divergence was `ResolveDeferredModel` handing an EMPTY `_docs` to `FollowUpRefs.BuildHrefMap`, so every spec resolver’s href came back null and `WorkGraph.BuildStory` dropped the resolver node AND its edge. Fixed with a source-derived href-map overload — NO `_docs` pre-population, so Trap 2’s `alreadyExisted` flip never fires (updated=0 on every run). Static-vs-IR `<main>` divergence 47 -> 0 across 1,406 pages; `measure:parity` 191/191 on all four axes. ⚠️ THE FIX REACHES FURTHER THAN 23.3 REPORTED: 9 EPIC pages + `work-graph.html` carried the same dropped-resolver defect at epic scope (Epic 1: 13 items/12 links -> 16/20). 23.3 only ever named the 46 story surfaces. schemaVersion BUMPED 1 -> 2 (ADR 0016 Decision 5) with BOTH `EXPECTED_SCHEMA_VERSION` constants moved in the same change (the adapter only console.warns, so a missed one is silent). ⚠️ GOLDEN FINGERPRINT DID NOT MOVE. AC #4 cannot move it (the fixture generates without --spa) and AC #5 is legitimately ZERO-delta there — that fixture’s deferred work carries no spec-doc resolver. The live static delta was enumerated page-by-page instead: **1,350 of 1,407 byte-identical**, 57 movers = 46