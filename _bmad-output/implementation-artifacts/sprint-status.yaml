  5-3-watch-regeneration-safety-and-scope-aware-rebuilds: done # CODE REVIEW 2026-07-25 (3 adversarial layers, scoped to this story's File List — sibling Story 20.3 hunks in the same commit range excluded): 12 findings → 8 patches applied, 2 deferred, 2 dismissed. Production fixes: _codeFiles assignment moved INSIDE GenerateAll's _gate (a pre-existing race that only became reachable because RegenerateTopology is the first caller able to run GenerateAll against another in-flight route); CopyEmbeddedAsset now writes a .tmp + atomic File.Move so a partial copy can never be accepted as "already correct" by the Length>0 fallback; DeleteOutputFile/DeleteOutputDirectory evict _spaCapture only AFTER the delete succeeds, and a partial directory delete reconciles per-file against real disk state (new ReconcileSpaCapturePrefix) instead of evicting all-or-nothing; RunDebouncedPass fully wrapped (Path.GetRelativePath sat outside RunGuarded on a bare Timer callback); the directory watcher's Error handler now ESCALATES to a rebuild (new ForceTopologyRebuild) rather than only logging — a buffer overflow means events were DROPPED, so logging alone leaves output silently stale, short of AC #5. Test fixes: the config-dir crash-guard test never reached the branch it was named for (new OnConfigDirCreated factory seam + a success-path counter-test); the burst test never asserted the coalescing it claimed (now pins the event count — trap: RelativePath is the SOURCE-relative .md path w/ OS separator, not the normalized .html output path); the self-trigger-loop test's two fixed sleeps replaced with a stable-plateau poll. Full suite GREEN 2391/0/3 — including GoldenContentFingerprint and the git-fixture set that historically flakes. Deferred to deferred-work.md: hand-maintained EpicsFamilyPages list, CopyEmbeddedAsset retry sleeping under _gate. # FOLLOW-UP PASS 2026-07-24 (owner-requested audit of the crash-guard class): THE ORIGINAL FIX WAS INCOMPLETE. RunGuarded guarded the generator call and then handed the result to _onEvent OUTSIDE the try — and _onEvent is a caller-supplied delegate invoked on the SAME unguarded ThreadPool thread (in production ConsoleUi.LogEvent, which writes to the console; piping `specscribe watch` into a process that exits first closes stdout → IOException from the write → process death). That failure is WORSE than the one first fixed because it fires on the SUCCESS path: a perfectly good rebuild kills the session while reporting itself. Every event now leaves through ONE SafeNotify seam (the swallow is deliberate — the reporting channel IS the thing that failed, so there's no second channel; losing a log line beats losing the session). Same pass also closed: all raw FileSystemWatcher Changed/Created/Deleted/Renamed handlers across all three watcher kinds were unguarded on the watcher's own dispatch thread (→ SafeHandle), and OnConfigDirCreated's EnableRaisingEvents sat outside its own try. Three scattered watcher-label literals promoted to FileWatcherLabel/DirectoryWatcherLabel/BmadDirWatcherLabel. TESTABILITY: the timer bodies were extracted to internal RunDebouncedPass(path)/RunTopologyPass() seams because these guards only matter where there is NO CALLER — testing them through a real Timer means a REGRESSION takes down the TEST HOST rather than failing an assertion, turning one broken guard into a lost suite run reported as infrastructure noise; driving the bodies synchronously keeps an unguarded throw an ordinary attributable failure (mirrors the OnConfigDirCreated seam 6.11 added for the same reason). 11 new tests incl. the nastiest ordering (route fails AND reporter fails — where a route-only guard still dies) + 2 counter-tests so the suite can't be satisfied by swallowing everything. TRAP RECORDED: the first fault injection created a DIRECTORY named as-directory.md assuming the read would fail — it does not, File.Exists returns false for a directory so the route takes RemoveFor and returns a tidy Skipped; that test passed while exercising NOTHING. Injection now replaces the output ROOT with a plain file so EnsureScaffold's Directory.CreateDirectory throws. GOLDEN FINGERPRINT NOW PASSES — 20.3 regenerated it on their side, CONFIRMING the drift was theirs and that declining to regenerate here was correct. FINAL SUITE 2277 passed / 4 failed / 4 skipped (2285); all 4 are the pre-existing git-fixture load flake, green in isolation 35/35, and AGAIN a different set than the two prior runs. --- prior dev-story 2026-07-24: TASKS 1+2 WERE ALREADY SHIPPED BY STORY 6.11 — the story's Dev Notes predate it (the watcher already admits *.yaml/*.yml/*.toml via the Filters collection, and the dispatch already checks IsDataSource FIRST → RegenerateFromDataSource, precisely so sprint-status.yaml isn't claimed by IsEpicsRelated and routed to RegenerateEpics, which skips sprint state by design/AD-5). A narrower RegenerateSprint() was DELIBERATELY NOT ADDED: RegenerateFromDataSource runs a full GenerateAll which wipes OutputRoot, so it satisfies AC#4's REMOVAL half for free, whereas the targeted refresh the task sketches would re-introduce the exact write-but-never-remove asymmetry Task 2's own second bullet exists to fix; 6.11 already recorded family-scoped re-render as deferred R6.4 PERF work, "not correctness". AC#4 instead closed with the end-to-end coverage genuinely missing (add/edit/REMOVE of the yaml through a real FileSystemWatcher). REAL DELTA: (Task 3) epics.md deletion now tears down its whole output family — epics.html + epics/ + requirements.html + requirements/ PLUS traceability/cadence/impact-map/work-graph (the task named four; all eight ride the same `_epicsModel is null` gate and are ONE staleness class) — nav rebuilt AFTER the clear because SiteNav's Work Graph gate reads _workGraph, and returns `Removed` ONLY when something was actually torn down so a project with no epics.md keeps its long-standing `Skipped`; (Task 4) new filter-less NotifyFilters.DirectoryName watcher per root — a bare folder name matches NO file filter, so folder rename/create/delete produced NO event at all — coalescing on sentinel key "<topology>" (illegal in a Windows path → cannot collide) into new SiteGenerator.RegenerateTopology(). THREE DEFECTS THE TESTS FOUND THAT INSPECTION DID NOT: (1) the debounce Timer callback ran UNGUARDED on a ThreadPool thread — any escaping exception killed the whole `watch` PROCESS, not one rebuild → new RunGuarded → Error event (NFR2); (2) CopyEmbeddedAsset threw a reproducible IOException "used by another process" under contention — it's re-run by EVERY route so it's the one file a live session rewrites on every save → bounded retry + accept-if-already-present-and-non-empty (bytes are fixed at build time so an existing copy cannot be stale); (3) the task list's literal `_progress = null` is wrong in BOTH directions — the dashboard's "Progress by Epic" mosaic reads ProgressModel.PerEpic NOT _epicsModel, so leaving it keeps cards linking into the just-deleted epics/ subtree, but nulling it strips the Insights nav while the git-mined deep-analytics pages stay valid on disk → _progress is now SPLIT (roll-ups zeroed, Git/DeepGit kept). Also: sprint.html/action-items.html degrade IN PLACE = RE-RENDERED not left alone (their old bytes carried live links into the deleted subtree — Open Question #2's wording didn't distinguish); new IsUnderOutputRoot guard closes a hazard the directory watcher introduces (a nested --output would have each rebuild's own dir writes re-arm the topology timer FOREVER). Open Q#1 → named RegenerateTopology() wrapper (log reads `<directory change> · full rebuild`). AC#6's optional coalescing clause NOT done and flagged: its two conditions conflict — the only cheap collapse is a shared sentinel key, which IS an observable event-stream change; correctness half done+tested, efficiency half belongs with deferred R6.4. Scope held: no Commands/ConsoleUi/SiteSettings/SettingsResolver (5.1/5.2), no new discovery heuristics (