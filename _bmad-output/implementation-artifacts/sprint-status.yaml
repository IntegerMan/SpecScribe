  18-5-priority-bmad-module-baseline-coverage: done # code review 2026-07-28: 1 decision-needed + 9 patch findings, all resolved and applied (heading-reader colon split, WithJoin synthetic fail-closed fallback via oracleResolutionMode, join-table row grouping by target id, softened non-recursive-scan diagnostic wording, empty-directory notice parity, e2e-trace-summary.json gate_criteria surfaced, unrecognized coverage word no longer defaults to NONE, Coverage-Summary-scoped priority-row reader, Ordered() tier-rank precompute); 3 dismissed as unreachable/low-likelihood; 74/74 tests green, golden fingerprint unmoved. review -> done. dev-story 2026-07-27 DONE -> review (story baseline 40c7ee9; HEAD at start 6017c2c — 18.4 landed in between, so its IdeaDiscovery precedent was COMMITTED rather than in-flight and the predicted merge friction on SiteNav/SiteGenerator/DashboardViewBuilder did not materialize). BOTH D1 surfaces shipped: `test-artifacts.html` (ListRow rows, tier badges carrying their WORD, a tier legend, gate section, coverage tables, attributed join) and a MODULE-AGNOSTIC dashboard Module Coverage panel. The coverage-tier vocabulary is now a real type (`CoverageTier`/`CoverageTiers`, the single classifier) and **the PRD's and SPEC.md's open question "how should coverage tiers be communicated" is ANSWERED and struck through in both**. D3 landed as **ADR 0020** (proposed; `docs/adrs/README.md` entry added and the whole index re-counted 20 -> 21 with every prior parenthetical intact, per Story 18.1's blanked-ADR-0014 finding) — non-markdown ingest scoped to four simultaneous conditions plus a MAJOR-version gate applied before any field is touched; §5 states the enrichment-only constraint as DEFERRING to 18.3's still-unwritten ADR 0019 rather than competing with it. ⚠️ **TASK 1'S RE-PIN CONFIRMED EVERY FILENAME BUT CORRECTED FOUR OF THE STORY'S OWN FACTS**: (a) `traceability-matrix.md`'s Detailed Mapping is an **h4-heading-per-criterion structure, NOT the five-column table the story described** — a table parser would have found nothing; (b) `inventory_basis` has a **FOURTH** value the story's table omitted, `synthetic_requirements` (non-joinable); (c) `gate_status`/`gate_criteria` are **OPTIONAL** on `e2e-trace-summary.json` (upstream appends them only inside `if (gateEligible)`), and `gate-decision.json` is written only when gate-eligible at all, so a repo can have a summary and no gate file; (d) **`trace/workflow.yaml`'s own inline schema comment is STALE** — it documents `schema_version: 1`/`generated_at`/`coverage_statistics` while `steps-c/step-05-gate-decision.md`, which actually writes the files, emits `schema_version: '0.1.0'`/`snapshot_at`/`coverage`; **the step file is the authority**, and this is the same doc-vs-reality trap that produced 18.1's wrong filenames one level deeper. A useful find: `trace-template.md`'s FRONTMATTER carries `coverageBasis`/`oracleConfidence`/`oracleResolutionMode`, so a Phase-1-only run that wrote no JSON still exposes everything the join-admissibility rule needs. **TWO REAL DEFECTS CAUGHT BY THE TESTS BEFORE SHIPPING**: the dashboard panel named the run's PRIMARY module — in the realistic BMM+TEA repo that is BMad Method, so TEA's own artifacts were labelled "BMad Method", the exact misattribution class ADR 0015 exists to prevent (fixed by adding `ModuleContext.ForCode(repoRoot, code)`, which answers "what does module X declare?" and is explicitly NOT a second `Detect` call); and the join table rendered EMPTY in a TEA-only repo (admissible basis, zero resolvable ids), which reads as "covered by nothing" — a claim, not an absence. **LIVE-BROWSER VERIFICATION FOUND THREE MORE THE SUITE STRUCTURALLY COULD NOT SEE**: the panel computed to `display: none` on the default dashboard (it lacked `wm-show-overview`, so the "at-a-glance signal" only appeared after switching work modes); the page overflowed horizontally at 375 px (422 px document vs 375 px viewport) while every sibling standalone