  24-2-per-file-ego-coupling-graph: review # dev-story 2026-07-30 (baseline 94b8e56, executed at HEAD 70b72ab): ready-for-dev -> in-progress -> review. SHIPPED: the code page's relationship surface is ONE interactive ego graph (new RelationshipGraph.cs + CouplingLayout.cs, Plotly `scatter` over a generation-time C# layout, ZERO marginal bundle bytes) plus the server-rendered sr-only twin it carries. AC#3's GATING TWIN AUDIT PASSED, live, with every <script> stripped from the document: 35 citing artifacts enumerated while the graph draws 14 (the +N more disclosure reconciles exactly: ranking caption says "21 further ... not drawn"), 20 coupled files all carrying support + directional confidence + lift + cross-boundary/process words, 52 resolving links, host display:none, controls+legend hidden, no stranded "Initializing...". THE AUDIT FOUND A REAL TWIN-COMPLETENESS DEFECT AND THIS STORY FIXED IT: the graph draws process coupling as a dotted spoke and the twin could not SAY it (RelatedNode carried no CouplingKind) - exactly the "fact existing only inside the chart" ADR 0013 sec-2 forbids. So Charts.ReferenceGraph + RefGraphArtifactNodeCap + the four pre-rendered .ref-graph-view panels + the whole .ref-*/.refgraph-toggle* CSS family are RETIRED (Charts.cs 3,969 -> 3,647 lines); 15 test methods / 43 assertion statements deleted and ACCOUNTED FOR (the story estimated 37), zero orphans. OPEN QUESTION 2 HAS A THIRD ANSWER: BuildAside's "second ReferenceGraph call site" was UNREACHABLE - its only caller is the placeholder page's !hasExtraTabs branch, which requires NO citers, so that graph could never draw; neither offered option applied and the dead branch died with the SVG. Pinned by a test rather than left as reasoning. CA1859 on ToGraphNodes RESOLVED BY DELETION (its only consumer was the SVG); retiring ReferenceGraph also killed Charts.cs's worst finding, an S3776 at cognitive complexity 89. D2's PREDICTED CONSEQUENCE LANDED: coupledCap threaded through ParseNumstatLog/TryComputeDeep, SiteGenerator passes RelationshipGraphCoupledCap=20, so THE SR-ONLY COUPLED LIST GROWS 8 -> 20 ON EVERY CODE PAGE - a deliberate visible behaviour change; FileInsightCoupledCap=8 unchanged for anything that does not ask; still ONE git call, and a test pins that the support floor + confidence sort run BEFORE the cap. ADR 0013 sec-6 FINGERPRINT REPLACEMENT landed as THREE named GoldenReplacement_* tests over a REAL generated site (payload / component configuration / twin) - deliberately three tests not one hash, because a fingerprint says SOMETHING moved and these say WHAT. ⚠ THE LIVE PASS FOUND FOUR DEFECTS THE SUITE STRUCTURALLY COULD NOT SEE, as 24.1 predicted for this same panel: (1) the control bar was emitted `hidden` correctly and NOTHING EVER REVEALED IT - every assertion about the attribute passed because emitting it was never the missing half; (2) the LEGEND rendered with JS OFF, eight rows explaining gold circles and dash patterns above a display:none host, and the ranking caption said "the strongest are drawn nearest the centre" on a page where nothing is drawn; (3) NODES DRAWN OUTSIDE THE HOST - yaxis.scaleanchor:'x' on a wide-short panel (886x420) makes Plotly SHRINK the y range to match x's px-per-unit, leaving y showing 0.55 units, measured as a 618px spread inside a 420px box; anchoring X TO Y instead keeps the short axis whole; (4) 20 OVERLAPPING MARKER PAIRS, worst at 40% of needed separation - the 203 ring-to-ring cross edges dragged the coupled arc into a knot AND 40 markers did not fit a 420px ring; fixed by degree-normalised attraction + a BOUNDED drift of ±35% of natural spacing (which makes non-collision ARITHMETIC, not empirical) + host 420 -> 520 + a 24px marker cap; re-measured 4 grazing pairs, worst ratio 0.82. LIVE RESULTS: zero-width mount trap HANDLED (deferred, not mis-sized; data-relgraph-reveal on the tab radios flushes it); a11y layer survives 5/5 re-render events incl. the adversarial bare Plotly.react and the shipped specscribe:content-swapped seam; asserted on GEOMETRY not attributes (0 empty `d`, 0 zero-box markers, real overlap arithmetic); REAL ArrowRight/Enter keys; tooltip has ZERO clipping ancestors and is body-parented; 0 PAINTED foreign colours under a hardened opacity-aware predicate (1 raw hit reported, Plotly's rect.bg at fill-opacity:0, so the 0 is defensible not lucky); FILTERS HIDE AND NEVER RE-LAY-OUT verified on real pixels - 35->40 nodes, 34->250 edges, 0 of 35 survivors moved a pixel (an earlier "20 moved" was a genuine transient between two restyle calls, now closed by putting node geometry + marker arrays in ONE call); 0 transitions anywhere in the chart (UX-DR18); mobile 375px clean, the page's sideways scroll is the INHERITED .code-tablist at 449px. PAYLOAD MEASURED THEN HALVED: 55,012 B -> 27,003 B after moving the per-kind filter+phrase facts into ONE config row per kind (56% of the island was 203 cross-edge sentences re-spelling paths already in the node array); wording still authored once, in C#. SIZE DELTA over 263 code pages common to a git-archive-HEAD throwaway tree: +7,958,858 B (+36.4%, avg +30,262 B/page); specscribe.css +45 B (retired SVG rules ~= new graph rules); specscribe.js +32,365 B once. Everything else differing between the trees is population drift, stated as such. OPEN Q1 (lift vs confidence) MEASURED AND RESOLVED ITSELF: 24.1's watch item was a top-10 all at 100%; at the cap of 20 this repo's Charts.cs reads 15 DISTINCT values across 13%-75%, so confidence discriminates and no ranking-policy change is proposed. DEVIATION RECORDED: rove order is the SERVER'S EMISSION ORDER, not the story's "degree-descending" - the requirement that clause serves is "twin and graph must agree", and degree ordering would put a high-degree coupled file ahead of the citers and DISAGREE with the listing directly beneath it. WEBVIEW takes the ADR 0013 sec-7 text-twin fallback (StripDataIslands still removes every island) and ships no empty box; narrowing that exception stays a joint decision with the hierarchy family. Golden fingerprint dbfa172b -> 142a2132 (implementation) -> 70070c39 (after the live fixes), EACH measured twice after `dotnet build --no-incremental`; provenance split in the constant's comment (every modified src/SpecScribe/* file is this story's; the concurrent session's ADR 0033 + epics.md + story files render nothing through this fixture). Suite 2,859 passed / 0 failed / 3 skipped (two runs each lost ONE different test to the documented preview-server git-SPAWN flake; both green in isolation). Gates 24.3. prior: create-story 2026-07-29 (baseline 94b8e56): blocked -> ready-for-dev. ALL THREE GATES CLEAR: 24.1 `review` (metric spine shipped), 20.7 `done`, 24.6 `review` with ADR 0030 ACCEPTED. Engine is DECIDED, do not re-open: already-vendored Plotly `scatter` over a GENERATION-TIME C# layout, 0 marginal bytes; ADR 0012 EXTENDED not superseded; NO new dependency, NO new engine family. FOUR OWNER DECISIONS ELICITED UP FRONT, all taken at their recommended defaults (so the verify round does not spend a round on them): D1 VISUAL = **evolved hub-and-spoke** (focal pinned dead-center and never moving, both populations on a relaxed ring, today's gold-circle/solid + neutral-diamond/dashed vocabulary preserved) - free-constellation and concentric-orbit were offered and NOT chosen. D2 CAP = **top-20 by confidence via a NEW graph-scoped cap**, FileInsightCoupledCap=8 left unchanged as the const default (21 nodes/210 edges/20,253 B ~= 23.1's accepted 20,915 B sunburst island; uncapped ego is 360 NODES). ⚠ D2 HAS A TWIN-COMPLETENESS CONSEQUENCE the story spells out: FileInsight.CoupledFiles feeds THREE consumers that are all the SAME surface (graph, sr-only twin, the 2 index-aligned cross-edge builders), so ADR 0013 sec-2 "complete" forces the TWIN TO FOLLOW THE GRAPH - the sr-only list grows 8 -> 20 on code pages, a deliberate visible behaviour change to be recorded like 24.1 recorded the support floor. D3 T