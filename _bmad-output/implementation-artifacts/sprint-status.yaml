  5-2-directory-scoped-settings-with-interactive-and-cli-parity: done # code review 2026-07-25 (bmad-code-review, scoped to git diff 6e12d0d..HEAD restricted to this story's own File List — sibling 5.1/5.3/5.5/5.6 and epic-20/25/26 changes bundled in the same commit range excluded) -> done. 3 adversarial layers found all 4 ACs correctly implemented; 1 decision-needed (owner directed a bigger-than-patch change: .specscribe becomes a FOLDER containing config.json, not a flat file, to leave room for future per-directory state such as incremental-build caching or run-history tracking — see new ADR 0014, extending ADR 0003; walk-up-read anchoring itself kept as-is; read is backward compatible with the pre-ADR-0014 flat file, write migrates it to the folder form in place), 7 patch (all applied — IOException guard on --show-config's Console.Out writes mirroring Story 5.1's PrintMachineSummary fix; CliOverrides.Capture's path/name predicates changed from `{Length:>0}` to `is not null` to agree with SettingsStore.ApplyTo's `??=`, closing an empty-string-CLI-override provenance-misreport edge case; ConfigurePaths now warns when SettingsStore.TrySave fails for a real reason (write-protected/disk-full) instead of silently returning stale provenance, distinguishing that from the expected "nothing worth saving" case; FormatConfigLines escapes an embedded newline in a field value so it can't split the --show-config one-line-per-field contract; the settings walk-up now happens exactly once per SettingsResolver.Load call via a new SettingsStore.TryLoad(startDirectory, out loadedFrom) overload, which ALSO fixes a malformed-nearest-file-shadows-valid-ancestor bug by skipping unparseable candidates and continuing up-tree instead of stopping; added the missing saved.IncludeReadme==true-with-no-CLI-override provenance test), 10 dismissed (CodeUrl Default/auto-detected conflation consistent with every other auto-discovered field; ToDictionary duplicate-key theoretical risk on a fixed 8-entry array; Resolve's caller-sync trust documented as convention; a golden-fingerprint comment nitpick; --show-config's human-block-before-machine-lines ordering confirmed deliberate; the README prompt's boolean mapping verified correct by trace, TTY-only and already flagged for owner verification in Completion Note #9; no invariant-checking constructor on SettingsLoad/ResolvedConfig, a design nitpick; --show-config propagating DirectoryNotFoundException on discovery failure confirmed intentional, Program.cs catches it and exits 1 cleanly; ResolvePath's default-parameter widening has no affected caller outside this story's File List; Completion Note #7's "constant unchanged" wording verified accurate for 5.2's own isolated contribution, the diff's visible constant change is ~5 sibling stories' bundled regenerations on shared main). 10 new/changed tests; SettingsStoreTests/SettingsResolverTests 65 passed/0 failed. Full suite re-verified: golden content-fingerprint and golden output-inventory both pass (regenerated by the concurrent Story 20.5 session on top of this work, see SiteGeneratorAdapterTests.cs's provenance comment); remaining full-suite failures (5-8, varying run to run, "git CLI unavailable on this host" under concurrent load) are the pre-existing git-fixture/concurrency flake this file's other entries already document, none touching this story's files. prior: dev-story 2026-07-24: PARITY+HARDENING; persistence primitives reused, not rebuilt. New SettingsResolver.cs is the ONE seam — generate/watch/bare-default/menu all route through it, closing the primary gap (GenerateCommand/WatchCommand previously called settings.Resolve() directly and NEVER read .specscribe, so configuring interactively then running the CLI silently discarded every saved value). LOAD-BEARING ORDER: CliOverrides.Capture runs BEFORE SettingsStore.ApplyTo (which fills nulls in place — after it, a CLI value is indistinguishable from a restored one); the menu therefore Loads ONCE at entry a