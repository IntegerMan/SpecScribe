  23-6-retire-the-c-sharp-html-writer: in-progress # DEV-STORY 2026-08-03 (session 3, baseline e864133): Tasks 1-7 ALL DONE; suite GREEN at 2932 passed / 0 failed; web/ 161 passed; all gates green (check:parity, check:ir-content, check:a11y, check:links). Task 8 PARTIAL and is the ONLY thing left: the mechanically checkable half is verified (ADR 0022 Decision 6 page-relative rewrite proven across depths 0-5 over 1,240 references with zero root-relative; hierarchy + relgraph + mermaid chrome all present at depth with correct prefixes; the escaped-prose trap confirmed handled on ADR 0034's own page, which mentions data-relgraph and plotly-hierarchy.min.js in prose and ships zero real script tags) but the VISUAL browser pass at depth 0 and depth 3 is NOT done -- CSS containment leaks, sub-pixel collapse and DOM corruption are exactly what CLAUDE.md says the suite structurally cannot see, and Chrome automation was not connected. THREE REAL BUGS were found closing out the 47 red tests, which is the argument for re-pointing assertions rather than deleting them: (1) the epics/ directory wipe WAS load-bearing -- an undrafted story's placeholder has no document, so route eviction never fired and the placeholder survived a story leaving the plan (fixed with RemoveRoutesUnder); (2) test reads were LOCKING THE GENERATOR out of its own chunk files (File.ReadAllText denies a concurrent writer; once pages became IR routes every watch-mode read hit the same few chunks -- SiteRegion now reads FileShare.ReadWrite); (3) WriteStaticPages had become a switch that silently did nothing, still being set by Commands.cs, now deleted. The sanctioned-divergence registry is now EMPTY and that is correct: every entry registered a difference against the C#-rendered page and no C# path renders one -- the webview still cannot run Mermaid, but that is a capability fact for ADR 0005/0032, not a parity divergence, because ADR 0024 makes every surface a projection of one region. GoldenOutputInventory re-pinned as TWO lists (11 files + 29 routes) so a page family cannot vanish from the IR while its assets stay. CI is now GREEN on main at f7e812f (build-test-analyze both jobs + Pages). ADR 0033 Decision 4 DISCHARGED: the Ubuntu portability-probe had been failing at Test every run since Task 1 so the cross-OS step never ran; with the suite green it completed and check:parity is 24/24 byte-identical on Linux. THIRD CI fix: check:ir-content was validating a NARROWER corpus than the one that ships -- extract:ir-content prunes any rule whose selector it cannot find in the IR, publish-docs-live-pages generates --deep-git but build-test-analyze did not, so the gate pruned 182 rules that the published site needs (reproduced both ways locally: +4/-182 shallow, +0/-2 deep). Fixed by aligning the GATE to the published corpus, NOT by regenerating the layer to match the shallow run -- that direction would have silently stripped styling from live surfaces. KNOWN LIMITATION recorded for follow-up: the extractor prunes against ONE corpus, so the shallow run's graceful-degradation rules are pruned by the deep-git extraction just as the 182 were pruned by the shallow one; the layer needs the union. ALSO: check:ir-content cannot be stably green on a PULL REQUEST by construction -- its corpus is git-history-derived and PR builds check out refs/pull/N/merge, a synthetic merge commit existing nowhere else, which shifts the author set; landed on main where the history is real. ADR 0034 amended with Decision 6 (the IR carries site-level chrome) and the corrected 3.4-3.7 ms/route prerender figure.
