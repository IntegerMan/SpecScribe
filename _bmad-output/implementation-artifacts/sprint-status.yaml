ew Findings` story section, the same collision `ArtifactCoverage` has with FR42's "coverage". (2) The AC #1 second-source-class proof is a trap: ~755 of the issues are already `external_roslyn:*` IMPORTS, so demonstrating on them proves Sonar's normalizer works, not source-agnosticism — the proof must use RAW Roslyn SARIF, and `dotnet/roslyn#24319` means a solution-wide `ErrorLog` writes only the last project. SARIF 2.1.0 is an OASIS Standard Roslyn emits natively, so the ADR must answer is/profile-of/diverges-from rather than invent a schema unpriced. (3) SONAR CARRIES TWO SEVERITY AXES THAT DISAGREE (live, 1420 unresolved — up from 25.2's 1360 in ONE day): legacy INFO 771 vs MQR INFO **0**, with those same 771 landing as MEDIUM (935 total) under MQR — 25.2's "the INFO band is one bulk disposition" premise inverts depending on which axis is read; `impacts` is an ARRAY and `flows[]` carried 7 secondary locations on the sampled issue. (4) The attachment join is GATED ON `--deep-git` (`SiteGenerator.cs:357,739`) so a DEFAULT run has no join at all and deep-git can vanish silently at `errors=0`; there is no story->requirement edge (traceability is requirement x EPIC), making AC #1's "requirement" key a two-hop epic-granular derivation or absent. Two channel inversions: an OFFICIAL SonarQube MCP server already exists and supports Claude Code (so AC #3's MCP row is two rows, and the free one delivers SONAR's model), and the Epic 22 IR field MOVES the golden fingerprint that 25.4 AC #2 forbids — so 25.4 and Epic 26 may need different channel answers. ADR numbering: docs/adrs/ ends at 0018 on disk but 0019 (18.3) and 0020 (18.5) are both claimed-but-unwritten, so 0021 is likely; must land RATIFIED, not Proposed, because six stories bind to it. Full detail on the 25-3 key. prior: create-story 18.5 (2026-07-27, baseline 40c7ee9): 18-5-priority-bmad-module-baseline-coverage backlog -> ready-for-dev, AND a new 18-6-module-aware-artifact-coverage-families seated at backlog (own