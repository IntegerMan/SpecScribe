<title>24.6 candidate (c) — Cytoscape.js (dedicated graph library)</title>
<link rel="stylesheet" href="./vendor/specscribe.css" />
<style>
  body { margin: 0; padding: 1rem 1.25rem 4rem; }
  .probe-head h1 { font-size:1.05rem; margin:0 0 .75rem; }
  #chart { width:100%; max-width:1100px; height:640px; }
  .chart-panel { overflow:hidden; border:1px solid var(--border); border-radius:10px; padding:.5rem; }
  .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;

<body>
<div class="probe-head"><h1>Candidate (c) — Cytoscape.js</h1></div>
<div class="chart-panel"><div id="chart"></div></div>
<div data-graph-live aria-live="polite" class="sr-only"></div>

<script type="application/json" id="graph-data">__FIXTURE__</script>
<script nonce="__NONCE__" src="./vendor/cytoscape.min.js"></script>
<script nonce="__NONCE__" src="./harness.js"></script>
<script nonce="__NONCE__">
(function () {
  'use strict'
  var probe = window.__probe
  var data = JSON.parse(document.getElementById('graph-data').textContent)
  var host = document.getElementById('chart')

  probe.engine = { name: 'cytoscape', version: (window.cytoscape && cytoscape.version) || 'unknown',
                   edgeModel: 'none — canvas', renderer: 'canvas' }

  function tok(n, f) { var v = probe.token(n); return v || f }
  var palette = {
    code: tok('--status-done', '#4a8'), proc: tok('--status-review', '#a84'),
    node: tok('--status-active', '#48a'), hub: tok('--status-ready', '#84a'),
    border: tok('--border', '#555'),
  }

  var maxW = data.nodes.reduce(function (m, n) { return Math.max(m, n.w) }, 1)
  var elements = data.nodes.map(function (n) {
    return { data: { id: n.id, label: n.l, w: n.w, path: n.p },
             position: { x: n.x * 1000, y: n.y * 1000 } }
  }).concat(data.edges.map(function (e, i) {
    return { data: { id: 'e' + i, source: data.nodes[e.a].id, target: data.nodes[e.b].id,
                     kind: e.k, xb: e.xb ? 'yes' : 'no', s: e.s } }
  }))

  probe.result = { loaded: false }
  try {
    var cy = cytoscape({
      container: host,
      elements: elements,
      // preset = consume the generation-time coordinates, the same strategy candidate (a) and (b) use
      layout: { name: 'preset' },
      style: [
        { selector: 'node', style: {
            'background-color': palette.node, 'border-color': palette.border, 'border-width': 1,
            'width': function (n) { return 8 + 22 * Math.sqrt(n.data('w') / maxW) },
            'height': function (n) { return 8 + 22 * Math.sqrt(n.data('w') / maxW) } } },
        { selector: 'node[path = "' + data.hub + '"]', style: { 'background-color': palette.hub, 'shape': 'diamond' } },
        // Per-edge non-colour channels ARE expressible in Cytoscape's selector style language.
        { selector: 'edge', style: { 'line-color': palette.code, 'width': 1, 'curve-style': 'straight' } },
        { selector: 'edge[kind = "proc"]', style: { 'line-color': palette.proc, 'line-style': 'dashed' } },
        { selector: 'edge[xb = "yes"]', style: { 'width': 2, 'line-style': 'dotted' } },
      ],
    })
    probe.cy = cy
    probe.result = {
      loaded: true,
      nodes: cy.nodes().length,
      edges: cy.edges().length,
      // THE a11y CRUX for this candidate: what DOM does it emit for a roving-tabindex layer to attach to?
      canvases: host.querySelectorAll('canvas').length,
      svgs: host.querySelectorAll('svg').length,
      perNodeDomElements: host.querySelectorAll('[data-graph-node]').length,
      // Every element Cytoscape emits, so "no per-node DOM" is a count, not an assertion.
      domTagCensus: (function () {
        var census = {}
        host.querySelectorAll('*').forEach(function (el) { census[el.tagName] = (census[el.tagName] || 0) + 1 })
        return census
      })(),
      renderedNodePositionSample: cy.nodes().slice(0, 3).map(function (n) {
        var p = n.renderedPosition(); return [Math.round(p.x), Math.round(p.y)]
      }),
    }
  } catch (err) {
    // A CSP-blocked Function() constructor would land here.
    probe.result = { loaded: false, error: String(err), stack: String(err && err.stack).slice(0, 400) }
  }
  probe.ready = true
})()
</script>
</body>
</html>
