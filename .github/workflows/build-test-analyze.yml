# The repository's FIRST build+test gate (Story 25.1, Epic 25 / NFR11).
#
# Story 16.2 EXTENDS this workflow — branch protection, required-status-check
# configuration, release-branch coverage. It must NOT create a second build+test
# workflow. The required-check string 16.2 needs is the job name, verbatim:
#
#     build-test-analyze
#
# The quality gate itself is Story 25.2's, and 25.2 decided it: the applied gate
# is SonarCloud's built-in `Sonar way` (id 9), kept rather than replaced, and
# `sonar.qualitygate.wait` remains deliberately NOT set, so a failing gate does
# not fail this build. That is a decision with a written precondition for
# reversing it, not an omission — see docs/SonarCloudSetup.md § Quality gate.
name: Build, Test & Analyze

on:
  # Deliberately NO `paths:` filter. A build+test gate that skips on some paths
  # is not a gate. (publish-docs-live-pages.yml correctly *does* filter, because
  # it only republishes docs — a different job with a different contract.)
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  # Least privilege. SonarCloud PR decoration is performed by the SonarQube
  # Cloud GitHub App using its own installation token, not by GITHUB_TOKEN, so
  # `pull-requests: write` is not required here.
  contents: read

concurrency:
  # Must NOT be `pages` — publish-docs-live-pages.yml owns that group, and
  # sharing it would make the two workflows cancel one another.
  # `main` uses its immutable SHA rather than one shared group. GitHub retains
  # at most one pending run per concurrency group, so a shared main group could
  # discard an older queued merge and leave it without Stage A. PRs retain their
  # ref group and cancellation behavior below.
  group: ${{ github.event_name == 'push' && format('build-test-analyze-{0}', github.sha) || format('build-test-analyze-{0}', github.ref) }}
  # Superseded PR pushes are cancelled; `main` runs always complete, because a
  # cancelled run on `main` would leave a commit with no analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-analyze:
    name: build-test-analyze
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # The token is exposed to the job as an environment variable and is only
      # ever referenced as $env:SONAR_TOKEN. It is never interpolated into a
      # `run:` script body, which would inline the value into the rendered
      # command. On pull requests from forks GitHub does not provide secrets,
      # so this resolves to the empty string — see the `if:` guards below.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scanner tool targets an older .NET runtime than this repo's net10.0.
      # Preemptive: lets it roll forward rather than fail to launch on a runner
      # image that only carries the .NET 10 runtime.
      DOTNET_ROLL_FORWARD: Major
      # The pinned scanner version. [Story 17.2 Task 8]
      #
      # ONE definition, used by BOTH the install and the cache key, because the two must move together and
      # the previous arrangement was the worst of both worlds: `dotnet tool update` (no version) installed
      # LATEST on a cache miss, while the cache key `${{ runner.os }}-sonar-scanner` carried no version
      # component at all — so once the cache was populated the binary was frozen indefinitely with no refresh
      # path. Unpinned on first write, pinned forever after, and nobody could say which version was running.
      #
      # Bump this one value to move the scanner; the key changes with it and the next run reinstalls.
      SONAR_SCANNER_VERSION: "11.2.1"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar: "shallow clones should be disabled for a better relevancy of
          # analysis" — blame data drives new-code detection and issue authorship.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Every project in this repo targets net10.0. Do NOT copy the 9.0.x pin
          # from publish-docs-live-pages.yml — SDK 9 cannot build a net10.0
          # project, and that workflow only survives because the hosted runner
          # image happens to ship a .NET 10 SDK alongside it.
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/SpecScribe/SpecScribe.csproj
            tests/SpecScribe.Tests/SpecScribe.Tests.csproj

      - name: Setup Node
        # Story 23.5 AC #8. Until this step existed, NOTHING built or checked `web/` anywhere — not CI, not
        # an MSBuild target, not an npm lifecycle hook — and the consequence was measurable rather than
        # theoretical: `npm run check:ir-content` and `npm run check:assets` were both RED at HEAD when
        # 23.5 first ran them, drifted by a concurrent story and caught by nobody.
        #
        # The version comes from web/.nvmrc (24.11.1), which 23.5 added because the repo pinned Node
        # NOWHERE — no .nvmrc, no engines field, no global.json — while web/CONVENTIONS.md named a version
        # in prose. Nuxt 4 requires ^22.19 || ^24.11 || >=26, so an unpinned runner was a live risk.
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java
        # SonarQube Cloud stopped supporting scanner runtimes below Java 21 on
        # 2026-07-20 — analyses on Java 17 now FAIL rather than warn. JRE
        # auto-provisioning would also cover this, but relying on an undeclared
        # default makes the workflow's correctness invisible. Declared, not
        # inferred. Left ungated so a guard bug can never surface as an obscure
        # Java error at the `begin` step.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          # The version is IN the key so a bump invalidates the cache. Without it the first run to populate
          # the cache pinned the scanner forever. [Story 17.2 Task 8]
          key: ${{ runner.os }}-sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}
          # Deliberately NOT a bare `${{ runner.os }}-sonar-scanner` prefix: a partial restore would seed the
          # directory with a DIFFERENT version's binary. The install step below pins explicitly, so an exact
          # match is the only restore worth having.
          restore-keys: ${{ runner.os }}-sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && env.SONAR_TOKEN != ''
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory -Force | Out-Null
          dotnet tool update dotnet-sonarscanner --version $env:SONAR_SCANNER_VERSION --tool-path .\.sonar\scanner

      # ---------------------------------------------------------------------
      # begin -> build -> test -> end, in this order and no other. The scanner
      # injects MSBuild targets during `begin`; anything built before `begin`
      # produces an empty analysis.
      # ---------------------------------------------------------------------

      - name: SonarScanner begin
        # The exclusion list is deliberately here rather than in the SonarCloud UI: it is reviewable in a diff
        # and versioned with the code. (For the .NET scanner a sonar-project.properties file is not read at all,
        # so the only alternatives were this and server-side settings.) It was WIDENED after the first real
        # analysis: the initial list was written by enumerating directories rather than by measuring, and left
        # ~11.7k lines of non-authored content in scope — `chat.json` at the repo root (4,861 lines), the
        # installed BMad skill packs under `.claude/` and `.agents/` (Python, and duplicated across both), and
        # `_bmad/scripts`. They dominated the findings list on day one, which is exactly what this list exists
        # to prevent. `extension/src` stays IN scope — it is genuine first-party source.
        #
        # continue-on-error (Story 25.1 code review, owner decision 2026-07-26): a SonarCloud outage or auth
        # failure here must not fail this job — Story 16.2 is about to make it a required check, and AC #1 only
        # requires this job to fail on a Build or Test failure. Build and Test below are untouched by this and
        # still gate normally.
        #
        # sonar.coverage.exclusions — NARROWED by Story 23.5 (AC #8), amending Story 25.2's decision 1b.
        #
        # 25.2 excluded the whole of `web/**` from the COVERAGE denominator, and was right to: the only
        # report being uploaded was C#-only OpenCover, which structurally cannot reach a Nuxt/Node subtree,
        # so `web/**` contributed 918 new lines-to-cover, all 918 uncovered, and dragged new_coverage to
        # 59.4% against an 80% threshold while the C# side sat at 94.9%. That exclusion was a workaround
        # for a MISSING REPORT, and 25.2 said so.
        #
        # The report is no longer missing. Story 23.5 stood up Vitest under `web/` and wires
        # `sonar.javascript.lcov.reportPaths` below, so the honest move is to measure `web/` rather than
        # keep hiding it. What remains excluded is only what genuinely cannot be unit-tested.
        #
        # ⚠️ THIS LIST IS NAMED FILE BY FILE, and that is the fix for a real defect. It used to read
        # `web/scripts/**`, one line under a comment asserting that "the three pure LIBRARIES they share
        # (`harness-lib`, `ir-content-lib`, `tokens-lib`) are NOT excluded". They live in `web/scripts/`, so
        # the glob excluded exactly them — the four modules that actually HAVE unit tests were the four
        # removed from Sonar's denominator, leaving only `ir/**` and `server/utils/**` measured. The claim
        # that the glob "deliberately mirrors web/vitest.config.ts so the two cannot drift" was false when
        # written: vitest uses `include: ['scripts/*.mjs']` with a NAMED exclude list. A blanket glob cannot
        # mirror a named list. Now it is the same named list, so a new script is a deliberate two-file
        # decision instead of a silent one. [Story 23.5 code review 2026-08-08]
        #
        #   the 15 named web/scripts files — dev-time HARNESSES. They spawn servers, walk `.output/`, and
        #                        assert on a full site generate: integration drivers, not units. Kept
        #                        byte-identical to `coverage.exclude` in web/vitest.config.ts. The pure
        #                        libraries (`harness-lib`, `ir-content-lib`, `tokens-lib`, `parity-lib`,
        #                        `links-lib`) are NOT here and ARE covered by `web/test/`.
        #   web/server/plugins/** Nitro plugins. `defineNitroPlugin` is a Nitro auto-import that does not
        #                        exist outside the Nitro build, so these modules cannot even be IMPORTED by
        #                        a unit test. 23.5 moved the one piece of real logic out of a plugin into
        #                        `web/server/utils/relative-prefix.ts` precisely so it could be tested, and
        #                        it is at 100%.
        #
        # `web/**/*.vue` IS NO LONGER EXCLUDED [owner decision D3, 2026-08-08]. It was excluded here while
        # `web/vitest.config.ts` globbed `components/**/*.ts` — components are `.vue`, so that glob matched
        # nothing and no `.vue` file reached lcov either. Absent from BOTH denominators, the "honest gap"
        # this comment claimed to document contributed ZERO rather than 0%: adding component tests would
        # have LOWERED the reported percentage, and lifting the exclusion later would have revealed a cliff
        # nobody predicted. Both sides now include `.vue`, so the gap is visible and real.
        #
        # `sonar.test.inclusions` classifies `web/test/**` as TEST code. Without it the scanner has no way to
        # know — it auto-classifies C# test PROJECTS, but a JS directory is just files — so ~600 lines of
        # Vitest specs were analyzed as production source at 0% coverage, dragging new_coverage in exactly
        # the direction this comment pre-declares as expected, which made the wiring defect unfalsifiable
        # from the gate output. `web/test/**` is also in coverage.exclusions as a belt-and-braces measure: if
        # a scan ever reports an indexing conflict, drop the test.inclusions line first, not that one.
        #
        # BE CLEAR ABOUT THE CONSEQUENCE: measured `web/` coverage is well under `Sonar way`'s 80% new-code
        # condition, and including `.vue` lowers it further, so this is EXPECTED to show new_coverage red.
        # That is the correct signal and it is not blocking — `sonar.qualitygate.wait` remains unset (25.2),
        # so a red gate does not fail this build. Do not "fix" it by widening the exclusion back to
        # `web/**`; fix it with component tests.
        #
        # `extension/src/**` is still deliberately NOT excluded (508 lines to cover, 0% covered) — shipped
        # first-party product code whose 0% this project wants visible.
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /o:"integerman-github" `
            /k:"IntegerMan_SpecScribe" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" `
            /d:sonar.javascript.lcov.reportPaths="web/coverage/lcov.info" `
            /d:sonar.test.inclusions="web/test/**" `
            /d:sonar.coverage.exclusions="web/test/**,web/server/plugins/**,web/scripts/check-links.mjs,web/scripts/check-a11y.mjs,web/scripts/measure-parity.mjs,web/scripts/measure-payload.mjs,web/scripts/check-parity.mjs,web/scripts/pin-parity.mjs,web/scripts/render-lib.mjs,web/scripts/experiment-two-ir.mjs,web/scripts/build-package.mjs,web/scripts/sync-runtime-assets.mjs,web/scripts/extract-tokens.mjs,web/scripts/extract-ir-content.mjs,web/scripts/check-tokens.mjs,web/scripts/check-ir-content.mjs,web/scripts/ir-content-build.mjs" `
            /d:sonar.exclusions="src/SpecScribe/assets/prism.js,src/SpecScribe/assets/prism.css,src/SpecScribe/assets/plotly-hierarchy.min.js,spike/**,tools/**,extension/node_modules/**,extension/dist/**,extension/bin/**,web/node_modules/**,web/.output/**,web/.nuxt/**,web/public/**,web/coverage/**,web/measurements/**,web/assets/tokens.css,web/assets/ir-content.css,SpecScribeOutput/**,docs/live/**,artifacts/**,_bmad-output/**,_bmad/**,.claude/**,.agents/**,chat.json"

      - name: Build
        # --no-incremental: an incremental build can skip compilation entirely
        #   and hand the scanner nothing to analyze.
        # --disable-build-servers: stops MSBuild node processes holding the
        #   scanner's DLLs locked, which matters most on Windows runners.
        # No `continue-on-error` and no `if: always()` on Build or Test — a red
        # build or a red test must stop the run. (The two SonarScanner steps do
        # carry `continue-on-error`, deliberately — see the comment there.)
        run: dotnet build SpecScribe.slnx --no-incremental --disable-build-servers

      - name: Test
        # Coverage is emitted as OpenCover, not coverlet's Cobertura default:
        # SonarScanner for .NET reads `sonar.cs.opencover.reportsPaths` and does
        # not document Cobertura support for C#. Produced here — after `build`,
        # before `end` — because a report written after `end` is silently ignored.
        run: dotnet test SpecScribe.slnx --no-build --collect:"XPlat Code Coverage;Format=opencover"

      # ---------------------------------------------------------------------
      # web/ — the Nuxt projection layer (Epic 23). Runs AFTER dotnet test and
      # BEFORE `end`, because SonarScanner ignores any report written after it.
      #
      # Ordering is not arbitrary: `check:ir-content` derives the generated CSS
      # layer from the C# stylesheet AND the emitted IR, so a portal has to
      # exist first. That ordering is inherent to the design (Story 23.3), not
      # an artifact of this workflow.
      # ---------------------------------------------------------------------

      # ⚠️ THE ORDER OF THE NEXT FOUR STEPS IS LOAD-BEARING, AND IT INVERTED IN STORY 23.6.
      #
      # It used to be: generate -> npm ci -> sync -> (no artefact step). The generate had to come FIRST
      # because `postinstall: nuxt prepare` loads web/nuxt.config.ts, which calls loadManifest() and HARD-FAILS
      # with "IR not found at SpecScribeOutput/spa/manifest.json" when the IR is absent — and on a fresh CI
      # checkout it always is, since SpecScribeOutput/ is gitignored.
      #
      # Story 23.6 made `specscribe generate` DRIVE THE PRERENDER (ADR 0022 §Decision 3): it now boots the
      # prebuilt Nitro artefact and issues one request per manifest route. So the generate needs the artefact,
      # the artefact needs `npm ci`, and `npm ci` needed the IR the generate produces — a cycle. The first CI
      # run after 23.6 failed exactly here: no artefact, so every route errored, `errors=1`, non-zero exit.
      #
      # SPECSCRIBE_PACKAGE_BUILD=1 breaks the cycle at the point it was always breakable: that flag stubs the
      # manifest EMPTY (ir/adapter.ts), which is precisely what it exists for, so `npm ci`'s postinstall no
      # longer needs an IR to be present. Install and build the renderer first, then generate.
      #
      # Do NOT reorder these back. A generate with no artefact is a hard failure by design (AC #4) — the whole
      # point is that a missing renderer can never be a silently empty output root.

      - name: Install web dependencies
        working-directory: web
        # `npm ci`, not `npm install`: the lockfile is the pin, and a lockfile-drifting install in CI would
        # make the build unreproducible.
        env:
          # See the ordering note above — this is what lets the install run before any IR exists.
          SPECSCRIBE_PACKAGE_BUILD: "1"
        # Install without lifecycle hooks, then run only this repository's required
        # Nuxt preparation hook explicitly. This prevents dependency lifecycle
        # scripts from gaining an implicit CI execution path.
        run: npm ci --ignore-scripts && npm run postinstall

      - name: Sync runtime assets into web/public
        working-directory: web
        # web/public/ is GITIGNORED by design (web/.gitignore: 1.4 MB of copies whose authoritative source
        # is src/SpecScribe/assets/ in this same repo), so on a fresh CI checkout it does not exist at all
        # and `check:assets` fails with "missing: prism.css / missing: prism.js". Populating it here is not
        # a workaround — it is the same thing `npm run dev`, `npm run build`, and `npm run generate` each do
        # via their own `sync-runtime-assets.mjs` prefix. Reproduced locally by deleting web/public/.
        #
        # It must precede the artefact build below: `build:package` bakes web/public/ into .output/public.
        run: npm run sync:assets

      - name: Build the project-independent renderer artefact
        working-directory: web
        # Story 23.6. BOTH the generate below and `check:parity` (part of `npm run check`) render through this
        # artefact, so it has to exist before either. `build:package` sets SPECSCRIBE_PACKAGE_BUILD=1 itself,
        # so it needs no IR.
        #
        # It MUST be `build:package`, never `build`. A plain `nuxt build` bakes the building project's pages
        # into .output/public, and Nitro serves public/ AHEAD of the SSR route — a package artefact pointed at
        # another IR then returns the baked project's page with HTTP 200, a wrong answer with a success status
        # (Story 23.5 hit exactly that). `render-lib.mjs` asserts the artefact carries no prerendered HTML
        # rather than trusting this step.
        run: npm run build:package

      - name: Generate the IR and prerender the site
        # `--spa` is a deprecated no-op since Story 23.6 (the IR is emitted unconditionally) and is dropped
        # here rather than left to print a deprecation notice on every CI run.
        #
        # This step does TWO things: it emits spa/manifest.json + spa/pages-*.json (the canonical IR,
        # ADR 0016) and then boots the artefact above to render one .html per manifest route. --no-build
        # reuses the Build step's output.
        #
        # ⚠️ `--deep-git` IS REQUIRED, and the reason is `check:ir-content` below — not analytics.
        #
        # `extract:ir-content` PRUNES any rule whose selector names a class it cannot find in the IR, so the
        # generated layer is only ever correct for the corpus it was extracted from. A deep-git run emits
        # surfaces a shallow one does not — the code-insights history/relationships tabs, the relationship-graph
        # swatches, the deep-analytics insight panels — and `publish-docs-live-pages.yml` publishes WITH
        # `--deep-git`, so those surfaces are on the real site and their rules must survive extraction.
        #
        # Without this flag the gate validated a NARROWER corpus than the one that ships: it pruned 182 rules
        # and went red against a layer that is correct for the published site. Measured, not inferred —
        # reproduced locally as `+4 / -182` without the flag and `+0 / -0` with it. Aligning the gate's corpus
        # with the published one is the fix; regenerating the layer to match a shallow CI run would have
        # stripped styling from surfaces the deployed portal actually renders.
        run: dotnet run --project src/SpecScribe --no-build -- generate --deep-git

      - name: Check web drift gates
        working-directory: web
        # The three generated-artifact gates Story 23.2/23.3 wrote and which, until now, nothing ran:
        #   check:tokens      — web/assets/tokens.css vs the C# :root block
        #   check:ir-content  — web/assets/ir-content.css vs the C# stylesheet
        #   check:assets      — web/public/ vs src/SpecScribe/assets/
        #   check:parity      — the pinned corpus vs measurements/parity-pinned.json  [Story 23.6 AC #3]
        #
        # check:parity is the REPLACEMENT for GoldenContentFingerprint, which Story 23.6 retires along with
        # the C# page writer it hashes. It renders a FROZEN 24-route corpus (all 14 surface families) through
        # the artefact and asserts two digests per route: the <main> region still matches the C# lineage Story
        # 23.4 proved, and the WHOLE PAGE still matches the pinned renderer snapshot — the latter being the
        # first gate this project has ever had over <title>, meta, the favicon, the footer, <script src>, the
        # nav toggle, the Mermaid init and the Hierarchy/Graph anti-flash handshakes.
        #
        # Because the corpus is frozen it cannot go red for a reason unrelated to the change under test, which
        # is ADR 0033 §Decision 2 and the property GoldenContentFingerprint never had.
        # No continue-on-error: a drifted generated artifact is a real failure, and the whole point of
        # wiring these is that they now stop a build instead of rotting.
        #
        # BE HONEST ABOUT WHAT EACH ONE ASSERTS HERE. `check:tokens` and `check:ir-content` diff a COMMITTED
        # artifact against the C# source, so they catch real drift in CI. `check:assets` cannot: its subject
        # is gitignored and was recreated from that same source one step ago, making it a tautology in CI.
        # Its real value is LOCAL, where a stale web/public/ can survive a stylesheet change indefinitely.
        # It is left in the run so `npm run check` means the same thing for a developer and for CI.
        run: npm run check

      - name: Check emitted links
        working-directory: web
        # Story 23.5 AC #8 names FOUR gates that "run somewhere automatic": check:tokens, check:ir-content,
        # check:links and measure:parity. The first two are in `npm run check` above. This is the third.
        #
        # It is a separate step rather than part of `npm run check` because its subject is different: the
        # gates above diff COMMITTED artifacts and need no site, whereas this one walks the LIVE emitted
        # portal and so must come after the generate step. Folding it into `npm run check` would make that
        # script unrunnable for a developer who has not generated.
        #
        # measure:parity — THE FOURTH GATE — IS DELIBERATELY NOT WIRED, and this is the record of that
        # decision rather than a silent omission. `check:parity` (in `npm run check` above) supersedes it:
        # Story 23.6 built it over a FROZEN corpus with pinned per-route digests, which is strictly stronger
        # as a gate than measure:parity's live-corpus measurement and, per ADR 0033 §Decision 2, cannot go
        # red for a reason unrelated to the change under test. measure:parity remains available as a
        # MEASUREMENT (`npm run measure:parity`) and is what regenerates web/measurements/parity.*; it is
        # not a gate and is not treated as one. [Story 23.5 code review 2026-08-08, owner decision D2]
        #
        # ⚠️ Unlike check:parity this gate is only PARTIALLY sibling-proof, by necessity — a link gate has to
        # run over the live site, so a sibling story that adds a page with a dangling link WILL turn it red.
        # That is the gate working. Re-pin deliberately with `npm run pin:links`, never reflexively.
        run: npm run check:links

      - name: Test web
        working-directory: web
        # Vitest + v8 coverage -> web/coverage/lcov.info, consumed by
        # sonar.javascript.lcov.reportPaths in the `begin` step above.
        run: npm run test:coverage

      - name: SonarScanner end
        # continue-on-error: see the same note on "SonarScanner begin" above — a scanner-side failure here must
        # not fail a job that only just built and tested successfully.
        #
        # `always()` is load-bearing, not defensive. `begin` has already injected MSBuild targets and OPENED an
        # analysis on SonarCloud; if any step between the two fails, an `if:` without `always()` skips this one
        # and nothing ever submits the analysis. SonarCloud then silently keeps serving the PREVIOUS run's
        # data, with no indication the scan was abandoned — a stale green. Story 23.5 widened that window by
        # inserting four failure-capable steps between `Test` and here, and Story 23.6 added a fifth.
        # [Story 23.5 code review 2026-08-08]
        if: always() && env.SONAR_TOKEN != ''
        continue-on-error: true
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

  # -------------------------------------------------------------------------
  # Portability probe (Story 25.1 AC #4).
  #
  # The ~2,350-test suite has never executed off the owner's Windows machine,
  # and GoldenContentFingerprint is a byte-exact SHA-256 over every generated
  # file with no .gitattributes in this repo to normalize line endings. This
  # job measures that divergence instead of guessing at it.
  #
  # It is INFORMATIONAL: `continue-on-error` is set at the JOB level so a Linux
  # divergence is reported as a finding rather than blocking the gate. That is
  # not a weakening of AC #1 — build-test-analyze above is the gate, and it has
  # no such escape. Story 16.2 must require `build-test-analyze` and must NOT
  # require this job.
  # -------------------------------------------------------------------------
  portability-probe:
    name: portability-probe (ubuntu, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/SpecScribe/SpecScribe.csproj
            tests/SpecScribe.Tests/SpecScribe.Tests.csproj

      - name: Build
        run: dotnet build SpecScribe.slnx --no-incremental --disable-build-servers

      - name: Test
        # No coverage here — this job answers "does the suite pass on Linux",
        # not "what is covered". Analysis is never uploaded from this job.
        run: dotnet test SpecScribe.slnx --no-build

      # -----------------------------------------------------------------------
      # ADR 0033 §Decision 4's cross-OS proof for `check:parity`. [Story 23.6]
      #
      # "Is deterministic across machines and CI before it is pinned … two local
      # runs is a floor, not a proof of portability." Story 23.4's IR fingerprint
      # passed three local runs and still produced three different hashes across
      # this box, CI-Windows and CI-Ubuntu — which is why that gate was removed
      # and why this one has to be MEASURED on Linux rather than assumed.
      #
      # This job is the right place for it precisely because it is non-gating
      # (continue-on-error at the job level): a Linux divergence is reported as a
      # finding, and `build-test-analyze` above is where check:parity gates.
      #
      # No dotnet generate and no IR are needed — the corpus is COMMITTED under
      # web/fixtures/parity-corpus/, which is the property that makes the gate
      # portable in the first place. `.gitattributes` pins the working tree to LF
      # on every platform, so the fixture checks out byte-identically here.
      # -----------------------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        env:
          # This job runs NO dotnet generate, so there is no IR anywhere on disk — and `postinstall:
          # nuxt prepare` loads nuxt.config.ts, which hard-fails without one. The flag stubs the manifest
          # empty, which is exactly what it is for. (Same reason as the gating job above; there the cycle is
          # subtler, here the IR is simply never produced.)
          SPECSCRIBE_PACKAGE_BUILD: "1"
        # Match the gated job's explicit lifecycle policy: dependencies install
        # without hooks, then this repository's Nuxt preparation runs by name.
        run: npm ci --ignore-scripts && npm run postinstall

      - name: Build the project-independent renderer artefact
        working-directory: web
        run: npm run build:package

      - name: Check parity on Linux (ADR 0033 §4 cross-OS proof)
        working-directory: web
        run: npm run check:parity

  # ADR 0040 Stage A is deliberately in this workflow: `needs: build-test-analyze`
  # is the structural release gate. Main runs are never cancelled by the workflow
  # concurrency setting, so a pending merge cannot lose its eventual release.
  stage-a-prepare:
    name: stage-a prepare
    needs: build-test-analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      epoch: ${{ steps.tag.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Prove release guards before allocating a tag
        run: node .github/scripts/release/selftest.mjs
      - id: tag
        name: Allocate and reserve the next preview tag
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          EPOCH=$(git log -1 --format=%ct "$SHA")
          bash .github/scripts/release/assert-source-date-epoch.sh "$EPOCH"
          git fetch --tags --force origin
          # Push a lightweight tag immediately to reserve the slot. If two runs pick
          # the same tag concurrently, only one push succeeds; the other retries with
          # the next available number. Retry up to 5 times before giving up.
          for i in $(seq 1 5); do
            git fetch --tags --force origin
            TAG=$(git tag -l | node .github/scripts/release/next-preview-tag.mjs --base-file .github/release-base)
            git tag "$TAG" "$SHA"
            if git push origin "refs/tags/$TAG"; then
              break
            fi
            git tag -d "$TAG"
            if [ "$i" = 5 ]; then
              echo "::error::Could not reserve a preview tag after 5 attempts."
              exit 1
            fi
          done
          VERSION="${TAG#v}"
          printf 'sha=%s\ntag=%s\nversion=%s\nepoch=%s\n' "$SHA" "$TAG" "$VERSION" "$EPOCH" >> "$GITHUB_OUTPUT"

  stage-a-nupkg:
    name: stage-a nupkg
    needs: stage-a-prepare
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.stage-a-prepare.outputs.epoch }}
      TAG: ${{ needs.stage-a-prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage-a-prepare.outputs.sha }}
          fetch-depth: 0
      - name: Create the local candidate tag for MinVer
        run: git tag --force "$TAG" '${{ needs.stage-a-prepare.outputs.sha }}'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash .github/scripts/release/assert-source-date-epoch.sh "$SOURCE_DATE_EPOCH"
      - working-directory: web
        env: { SPECSCRIBE_PACKAGE_BUILD: "1" }
        run: npm ci --ignore-scripts && npm run postinstall
      - working-directory: web
        run: npm run sync:assets && npm run build:package
      - run: dotnet pack src/SpecScribe/SpecScribe.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: stage-a-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  stage-a-binaries:
    name: stage-a binary (${{ matrix.rid }})
    needs: stage-a-prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, ext: zip }
          - { rid: linux-x64, os: ubuntu-latest, ext: tar.gz }
          - { rid: osx-arm64, os: macos-latest, ext: tar.gz }
    env:
      SOURCE_DATE_EPOCH: ${{ needs.stage-a-prepare.outputs.epoch }}
      TAG: ${{ needs.stage-a-prepare.outputs.tag }}
      VERSION: ${{ needs.stage-a-prepare.outputs.version }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage-a-prepare.outputs.sha }}
          fetch-depth: 0
      - name: Create the local candidate tag for MinVer
        run: git tag --force "$TAG" '${{ needs.stage-a-prepare.outputs.sha }}'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash .github/scripts/release/assert-source-date-epoch.sh "$SOURCE_DATE_EPOCH"
      - working-directory: web
        env: { SPECSCRIBE_PACKAGE_BUILD: "1" }
        run: npm ci --ignore-scripts && npm run postinstall
      - working-directory: web
        run: npm run sync:assets && npm run build:package
      - name: Publish and archive the complete RID payload
        run: |
          set -euo pipefail
          ROOT="specscribe-${VERSION}-${{ matrix.rid }}"
          dotnet publish src/SpecScribe/SpecScribe.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -p:PublishSingleFile=true -o "stage/$ROOT"
          mkdir dist
          if [ '${{ matrix.ext }}' = zip ]; then (cd stage && 7z a -tzip -mx=9 "../dist/$ROOT.zip" "$ROOT" > /dev/null); else tar -czf "dist/$ROOT.tar.gz" -C stage "$ROOT"; fi
          bash .github/scripts/release/assert-archive-renderer.sh "dist/$ROOT.${{ matrix.ext }}" "$ROOT"
      - name: Run the extracted archive from a spaced path against a foreign source tree
        run: |
          set -euo pipefail
          ROOT="specscribe-${VERSION}-${{ matrix.rid }}"
          ARCHIVE="dist/$ROOT.${{ matrix.ext }}"
          PROBE="$RUNNER_TEMP/specscribe archive probe"
          EXTRACT="$PROBE/extracted payload"
          mkdir -p "$EXTRACT" "$PROBE/foreign source"
          cp -R _bmad-output "$PROBE/foreign source/_bmad-output"
          cp -R docs/adrs "$PROBE/foreign source/adrs"
          if [ '${{ matrix.ext }}' = zip ]; then 7z x "$ARCHIVE" "-o$EXTRACT" > /dev/null; else tar -xzf "$ARCHIVE" -C "$EXTRACT"; fi
          EXECUTABLE="$EXTRACT/$ROOT/specscribe"
          [ '${{ matrix.rid }}' != win-x64 ] || EXECUTABLE="$EXECUTABLE.exe"
          unset SPECSCRIBE_RENDERER_DIR
          "$EXECUTABLE" generate --source "$PROBE/foreign source/_bmad-output" --adrs "$PROBE/foreign source/adrs" --output "$PROBE/site output" --project-name "Stage A probe" | tee probe.log
          grep -rl '<main id="main-content"' "$PROBE/site output" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: stage-a-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  stage-a-release:
    name: stage-a prerelease
    needs: [stage-a-prepare, stage-a-nupkg, stage-a-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage-a-prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Create the prerelease with durable handoff assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.stage-a-prepare.outputs.tag }}
          VERSION: ${{ needs.stage-a-prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          find incoming -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.nupkg' \) -exec cp {} dist/ \;
          [ "$(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" = 3 ]
          [ "$(find dist -type f -name '*.nupkg' | wc -l | tr -d ' ')" = 1 ]
          # Every attached asset needs a consumer-verifiable digest. The nupkg is
          # also attached as Stage B's immutable handoff, so it belongs here with
          # the three direct-download archives.
          (cd dist && sha256sum -- ./*.zip ./*.tar.gz ./*.nupkg > ../digests.txt)
          node .github/scripts/release/release-body.mjs --version "$VERSION" --digests digests.txt --repo '${{ github.repository }}' > release-body.md
          # The tag was reserved in stage-a-prepare. Verify our SHA still owns it, then
          # promote it to an annotated tag in place so the release object has a message.
          git fetch --tags --force origin
          REMOTE_SHA=$(git rev-parse "refs/tags/$TAG^{}" 2>/dev/null || true)
          [ "$REMOTE_SHA" = '${{ needs.stage-a-prepare.outputs.sha }}' ] || { echo '::error::Reserved tag is missing or was claimed externally; rerun from main for the next preview number.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a -f "$TAG" '${{ needs.stage-a-prepare.outputs.sha }}' -m "Stage A release $TAG"
          git push --force origin "refs/tags/$TAG"
          gh release create "$TAG" --prerelease --title "$TAG" --notes-file release-body.md --target '${{ needs.stage-a-prepare.outputs.sha }}' ./dist/*
