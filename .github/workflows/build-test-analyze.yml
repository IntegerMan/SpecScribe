# The repository's FIRST build+test gate (Story 25.1, Epic 25 / NFR11).
#
# Story 16.2 EXTENDS this workflow — branch protection, required-status-check
# configuration, release-branch coverage. It must NOT create a second build+test
# workflow. The required-check string 16.2 needs is the job name, verbatim:
#
#     build-test-analyze
#
# The quality gate itself is Story 25.2's, and 25.2 decided it: the applied gate
# is SonarCloud's built-in `Sonar way` (id 9), kept rather than replaced, and
# `sonar.qualitygate.wait` remains deliberately NOT set, so a failing gate does
# not fail this build. That is a decision with a written precondition for
# reversing it, not an omission — see docs/SonarCloudSetup.md § Quality gate.
name: Build, Test & Analyze

on:
  # Deliberately NO `paths:` filter. A build+test gate that skips on some paths
  # is not a gate. (publish-docs-live-pages.yml correctly *does* filter, because
  # it only republishes docs — a different job with a different contract.)
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  # Least privilege. SonarCloud PR decoration is performed by the SonarQube
  # Cloud GitHub App using its own installation token, not by GITHUB_TOKEN, so
  # `pull-requests: write` is not required here.
  contents: read

concurrency:
  # Must NOT be `pages` — publish-docs-live-pages.yml owns that group, and
  # sharing it would make the two workflows cancel one another.
  group: build-test-analyze-${{ github.ref }}
  # Superseded PR pushes are cancelled; `main` runs always complete, because a
  # cancelled run on `main` would leave a commit with no analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-analyze:
    name: build-test-analyze
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # The token is exposed to the job as an environment variable and is only
      # ever referenced as $env:SONAR_TOKEN. It is never interpolated into a
      # `run:` script body, which would inline the value into the rendered
      # command. On pull requests from forks GitHub does not provide secrets,
      # so this resolves to the empty string — see the `if:` guards below.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scanner tool targets an older .NET runtime than this repo's net10.0.
      # Preemptive: lets it roll forward rather than fail to launch on a runner
      # image that only carries the .NET 10 runtime.
      DOTNET_ROLL_FORWARD: Major
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar: "shallow clones should be disabled for a better relevancy of
          # analysis" — blame data drives new-code detection and issue authorship.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Every project in this repo targets net10.0. Do NOT copy the 9.0.x pin
          # from publish-docs-live-pages.yml — SDK 9 cannot build a net10.0
          # project, and that workflow only survives because the hosted runner
          # image happens to ship a .NET 10 SDK alongside it.
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/SpecScribe/SpecScribe.csproj
            tests/SpecScribe.Tests/SpecScribe.Tests.csproj

      - name: Setup Node
        # Story 23.5 AC #8. Until this step existed, NOTHING built or checked `web/` anywhere — not CI, not
        # an MSBuild target, not an npm lifecycle hook — and the consequence was measurable rather than
        # theoretical: `npm run check:ir-content` and `npm run check:assets` were both RED at HEAD when
        # 23.5 first ran them, drifted by a concurrent story and caught by nobody.
        #
        # The version comes from web/.nvmrc (24.11.1), which 23.5 added because the repo pinned Node
        # NOWHERE — no .nvmrc, no engines field, no global.json — while web/CONVENTIONS.md named a version
        # in prose. Nuxt 4 requires ^22.19 || ^24.11 || >=26, so an unpinned runner was a live risk.
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java
        # SonarQube Cloud stopped supporting scanner runtimes below Java 21 on
        # 2026-07-20 — analyses on Java 17 now FAIL rather than warn. JRE
        # auto-provisioning would also cover this, but relying on an undeclared
        # default makes the workflow's correctness invisible. Declared, not
        # inferred. Left ungated so a guard bug can never surface as an obscure
        # Java error at the `begin` step.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && env.SONAR_TOKEN != ''
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory -Force | Out-Null
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      # ---------------------------------------------------------------------
      # begin -> build -> test -> end, in this order and no other. The scanner
      # injects MSBuild targets during `begin`; anything built before `begin`
      # produces an empty analysis.
      # ---------------------------------------------------------------------

      - name: SonarScanner begin
        # The exclusion list is deliberately here rather than in the SonarCloud UI: it is reviewable in a diff
        # and versioned with the code. (For the .NET scanner a sonar-project.properties file is not read at all,
        # so the only alternatives were this and server-side settings.) It was WIDENED after the first real
        # analysis: the initial list was written by enumerating directories rather than by measuring, and left
        # ~11.7k lines of non-authored content in scope — `chat.json` at the repo root (4,861 lines), the
        # installed BMad skill packs under `.claude/` and `.agents/` (Python, and duplicated across both), and
        # `_bmad/scripts`. They dominated the findings list on day one, which is exactly what this list exists
        # to prevent. `extension/src` stays IN scope — it is genuine first-party source.
        #
        # continue-on-error (Story 25.1 code review, owner decision 2026-07-26): a SonarCloud outage or auth
        # failure here must not fail this job — Story 16.2 is about to make it a required check, and AC #1 only
        # requires this job to fail on a Build or Test failure. Build and Test below are untouched by this and
        # still gate normally.
        #
        # sonar.coverage.exclusions — NARROWED by Story 23.5 (AC #8), amending Story 25.2's decision 1b.
        #
        # 25.2 excluded the whole of `web/**` from the COVERAGE denominator, and was right to: the only
        # report being uploaded was C#-only OpenCover, which structurally cannot reach a Nuxt/Node subtree,
        # so `web/**` contributed 918 new lines-to-cover, all 918 uncovered, and dragged new_coverage to
        # 59.4% against an 80% threshold while the C# side sat at 94.9%. That exclusion was a workaround
        # for a MISSING REPORT, and 25.2 said so.
        #
        # The report is no longer missing. Story 23.5 stood up Vitest under `web/` (80 tests) and wires
        # `sonar.javascript.lcov.reportPaths` below, so the honest move is to measure `web/` rather than
        # keep hiding it. What remains excluded is only what genuinely cannot be unit-tested, and the list
        # deliberately mirrors `web/vitest.config.ts`'s own coverage `exclude` so the two cannot drift:
        #
        #   web/scripts/**       dev-time HARNESSES. They spawn servers, walk `.output/`, and assert on a
        #                        full site generate — they are integration drivers, not units. The three
        #                        pure LIBRARIES they share (`harness-lib`, `ir-content-lib`, `tokens-lib`)
        #                        are NOT excluded and are covered by `web/test/`.
        #   web/server/plugins/** Nitro plugins. `defineNitroPlugin` is a Nitro auto-import that does not
        #                        exist outside the Nitro build, so these modules cannot even be IMPORTED by
        #                        a unit test. 23.5 moved the one piece of real logic out of a plugin into
        #                        `web/server/utils/relative-prefix.ts` precisely so it could be tested, and
        #                        it is at 100%.
        #   web/**/*.vue         no component tests yet. This is the honest gap and it has an owner: it is
        #                        named in Story 23.5's report as the follow-up that would lift `web/`
        #                        coverage past the threshold.
        #
        # BE CLEAR ABOUT THE CONSEQUENCE: measured `web/` coverage is ~51% statements / ~53% lines, well
        # under `Sonar way`'s 80% new-code condition, so this change is EXPECTED to show new_coverage red
        # on the first scan that includes it. That is the correct signal and it is not blocking —
        # `sonar.qualitygate.wait` remains unset (25.2), so a red gate does not fail this build. Do not
        # "fix" it by widening the exclusion back to `web/**`; fix it with component tests.
        #
        # `extension/src/**` is still deliberately NOT excluded (508 lines to cover, 0% covered) — shipped
        # first-party product code whose 0% this project wants visible.
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /o:"integerman-github" `
            /k:"IntegerMan_SpecScribe" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" `
            /d:sonar.javascript.lcov.reportPaths="web/coverage/lcov.info" `
            /d:sonar.coverage.exclusions="web/scripts/**,web/server/plugins/**,web/**/*.vue" `
            /d:sonar.exclusions="src/SpecScribe/assets/prism.js,src/SpecScribe/assets/prism.css,src/SpecScribe/assets/plotly-hierarchy.min.js,spike/**,tools/**,extension/node_modules/**,extension/dist/**,extension/bin/**,web/node_modules/**,web/.output/**,web/.nuxt/**,web/public/**,web/coverage/**,web/measurements/**,web/assets/tokens.css,web/assets/ir-content.css,SpecScribeOutput/**,docs/live/**,artifacts/**,_bmad-output/**,_bmad/**,.claude/**,.agents/**,chat.json"

      - name: Build
        # --no-incremental: an incremental build can skip compilation entirely
        #   and hand the scanner nothing to analyze.
        # --disable-build-servers: stops MSBuild node processes holding the
        #   scanner's DLLs locked, which matters most on Windows runners.
        # No `continue-on-error` and no `if: always()` on Build or Test — a red
        # build or a red test must stop the run. (The two SonarScanner steps do
        # carry `continue-on-error`, deliberately — see the comment there.)
        run: dotnet build SpecScribe.slnx --no-incremental --disable-build-servers

      - name: Test
        # Coverage is emitted as OpenCover, not coverlet's Cobertura default:
        # SonarScanner for .NET reads `sonar.cs.opencover.reportsPaths` and does
        # not document Cobertura support for C#. Produced here — after `build`,
        # before `end` — because a report written after `end` is silently ignored.
        run: dotnet test SpecScribe.slnx --no-build --collect:"XPlat Code Coverage;Format=opencover"

      # ---------------------------------------------------------------------
      # web/ — the Nuxt projection layer (Epic 23). Runs AFTER dotnet test and
      # BEFORE `end`, because SonarScanner ignores any report written after it.
      #
      # Ordering is not arbitrary: `check:ir-content` derives the generated CSS
      # layer from the C# stylesheet AND the emitted IR, so a portal has to
      # exist first. That ordering is inherent to the design (Story 23.3), not
      # an artifact of this workflow.
      # ---------------------------------------------------------------------

      - name: Generate the IR
        # `--spa` emits spa/manifest.json + spa/pages-*.json, which IS the canonical IR (ADR 0016) and the
        # input both the drift gate below and the Nuxt build read. --no-build reuses the Build step's output.
        #
        # MUST run BEFORE `npm ci`. web/package.json declares `"postinstall": "nuxt prepare"`, and `npm ci`
        # runs lifecycle scripts — so the install itself loads web/nuxt.config.ts, which calls
        # loadManifest() in web/ir/adapter.ts and HARD-FAILS with "IR not found at
        # SpecScribeOutput/spa/manifest.json" when the IR is absent. On a fresh CI checkout it always is:
        # SpecScribeOutput/ is gitignored. Reproduced locally, then verified fixed by this ordering.
        run: dotnet run --project src/SpecScribe --no-build -- generate --spa

      - name: Install web dependencies
        working-directory: web
        # `npm ci`, not `npm install`: the lockfile is the pin, and a lockfile-
        # drifting install in CI would make the build unreproducible.
        run: npm ci

      - name: Sync runtime assets into web/public
        working-directory: web
        # web/public/ is GITIGNORED by design (web/.gitignore: 1.4 MB of copies whose authoritative source
        # is src/SpecScribe/assets/ in this same repo), so on a fresh CI checkout it does not exist at all
        # and `check:assets` fails with "missing: prism.css / missing: prism.js". Populating it here is not
        # a workaround — it is the same thing `npm run dev`, `npm run build`, and `npm run generate` each do
        # via their own `sync-runtime-assets.mjs` prefix. Reproduced locally by deleting web/public/.
        run: npm run sync:assets

      - name: Check web drift gates
        working-directory: web
        # The three generated-artifact gates Story 23.2/23.3 wrote and which, until now, nothing ran:
        #   check:tokens      — web/assets/tokens.css vs the C# :root block
        #   check:ir-content  — web/assets/ir-content.css vs the C# stylesheet
        #   check:assets      — web/public/ vs src/SpecScribe/assets/
        # No continue-on-error: a drifted generated artifact is a real failure, and the whole point of
        # wiring these is that they now stop a build instead of rotting.
        #
        # BE HONEST ABOUT WHAT EACH ONE ASSERTS HERE. `check:tokens` and `check:ir-content` diff a COMMITTED
        # artifact against the C# source, so they catch real drift in CI. `check:assets` cannot: its subject
        # is gitignored and was recreated from that same source one step ago, making it a tautology in CI.
        # Its real value is LOCAL, where a stale web/public/ can survive a stylesheet change indefinitely.
        # It is left in the run so `npm run check` means the same thing for a developer and for CI.
        run: npm run check

      - name: Test web
        working-directory: web
        # Vitest + v8 coverage -> web/coverage/lcov.info, consumed by
        # sonar.javascript.lcov.reportPaths in the `begin` step above.
        run: npm run test:coverage

      - name: SonarScanner end
        # continue-on-error: see the same note on "SonarScanner begin" above — a scanner-side failure here must
        # not fail a job that only just built and tested successfully.
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

  # -------------------------------------------------------------------------
  # Portability probe (Story 25.1 AC #4).
  #
  # The ~2,350-test suite has never executed off the owner's Windows machine,
  # and GoldenContentFingerprint is a byte-exact SHA-256 over every generated
  # file with no .gitattributes in this repo to normalize line endings. This
  # job measures that divergence instead of guessing at it.
  #
  # It is INFORMATIONAL: `continue-on-error` is set at the JOB level so a Linux
  # divergence is reported as a finding rather than blocking the gate. That is
  # not a weakening of AC #1 — build-test-analyze above is the gate, and it has
  # no such escape. Story 16.2 must require `build-test-analyze` and must NOT
  # require this job.
  # -------------------------------------------------------------------------
  portability-probe:
    name: portability-probe (ubuntu, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/SpecScribe/SpecScribe.csproj
            tests/SpecScribe.Tests/SpecScribe.Tests.csproj

      - name: Build
        run: dotnet build SpecScribe.slnx --no-incremental --disable-build-servers

      - name: Test
        # No coverage here — this job answers "does the suite pass on Linux",
        # not "what is covered". Analysis is never uploaded from this job.
        run: dotnet test SpecScribe.slnx --no-build
