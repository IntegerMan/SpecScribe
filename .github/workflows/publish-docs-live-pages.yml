name: Publish Docs Live to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "_bmad-output/**"
      - "docs/adrs/**"
      - "src/SpecScribe/**"
      - "SpecScribe.slnx"
      - "src/SpecScribe/SpecScribe.csproj"
      # ⚠️ `web/**` IS A PUBLISHED-OUTPUT INPUT NOW. [Story 23.6]
      #
      # Nuxt renders every page of the published site (ADR 0034), so a change to a Vue component, to
      # `web/assets/ir-content.css`, or to the IR adapter changes what Pages serves just as directly as a change
      # under `src/SpecScribe/`. Before the C# writer was deleted this filter was correct — `web/` affected only
      # the experimental renderer and nothing it produced reached this artifact.
      #
      # Omitting it would not have failed loudly: pushes touching only `web/` would simply never republish, and
      # the live site would quietly drift behind main until some unrelated commit under one of the other paths
      # happened to trigger a rebuild. That is the same silent-degrade shape as the missing artefact below.
      - "web/**"
      - ".github/workflows/publish-docs-live-pages.yml"
  workflow_dispatch:

# Permissions are declared per JOB, not here at workflow level (Story 25.2,
# githubactions:S8233 x2 + S8264 x1). Workflow-level grants apply to every job,
# so the build job would otherwise carry `pages: write` and `id-token: write`
# that only the deploy job needs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Checkout + generate + upload the artifact. No write scope of any kind.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (not the default shallow depth-1 clone) so the dashboard's
          # git metrics — commit count, the Commit Activity heatmap, and the opt-in
          # deep analytics (hotspots + change coupling, enabled via --deep-git below) —
          # reflect the real project history instead of just the tip commit.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: src/SpecScribe/SpecScribe.csproj

      # ── The renderer artefact must exist BEFORE the generate. [Story 23.6] ──────────────────────────────
      #
      # Since Story 23.6 no C# code path writes a content `.html`. `generate` emits the IR and then boots the
      # prebuilt Nitro artefact, issuing one request per manifest route (ADR 0022 §Decision 3, ADR 0034). With
      # no artefact present every route errors, `errors=1`, and the run exits non-zero having published nothing.
      #
      # ⚠️ THIS JOB REGRESSED EXACTLY THAT WAY AND IT IS WORTH RECORDING WHY IT WAS MISSED. The same ordering
      # fix was applied to `build-test-analyze.yml` when Task 3 landed, but this workflow was not: it had no
      # Node steps at all, so nothing here LOOKED like it depended on the artefact. Before the writer was
      # deleted a missing artefact was survivable — C# still wrote every page, so the generate reported an
      # error but the output root was populated and Pages published anyway. Task 6 turned a degraded run into
      # an empty one. The lesson generalizes past this file: when a step acquires a new dependency, audit
      # EVERY workflow that runs it, not just the one whose failure you happened to see.
      #
      # Do NOT reorder these back, and do not "fix" a future failure here by relaxing the generate's error
      # handling — a missing renderer being a hard failure rather than a silently empty output root is AC #4.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        # `npm ci`, not `npm install`: the lockfile is the pin.
        env:
          # `postinstall: nuxt prepare` loads nuxt.config.ts, which hard-fails without an IR — and this job has
          # not generated one yet. The flag stubs the manifest empty, which is precisely what it exists for, and
          # is what breaks the install-needs-IR / IR-needs-artefact cycle.
          SPECSCRIBE_PACKAGE_BUILD: "1"
        run: npm ci

      - name: Sync runtime assets into web/public
        working-directory: web
        # web/public/ is gitignored (copies whose authoritative source is src/SpecScribe/assets/), so it does
        # not exist on a fresh checkout. Must precede build:package, which bakes it into .output/public.
        run: npm run sync:assets

      - name: Build the project-independent renderer artefact
        working-directory: web
        # MUST be `build:package`, never `build`: a plain `nuxt build` bakes the building project's pages into
        # .output/public, and Nitro serves public/ AHEAD of the SSR route — pointed at another IR it returns
        # the baked project's page with HTTP 200, a wrong answer with a success status (Story 23.5).
        run: npm run build:package

      - name: Build static files
        id: build
        run: |
          dotnet run --project src/SpecScribe -- generate \
            --source _bmad-output \
            --adrs docs/adrs \
            --output SpecScribeOutput \
            --project-name SpecScribe \
            --deep-git

      - name: Validate generated output
        # `index.html` is now written by the PRERENDER, not by C#, so this check doubles as proof the artefact
        # actually rendered. The route-count assertion is the part that would have caught the regression this
        # job just hit: a run that emits the IR but renders nothing still leaves SpecScribeOutput/ populated
        # with spa/ and the shared assets, so `test -d` alone passes on an unbrowsable site.
        run: |
          test -d SpecScribeOutput
          test -s SpecScribeOutput/index.html
          pages=$(find SpecScribeOutput -name '*.html' -not -path 'SpecScribeOutput/spa/*' | wc -l)
          echo "rendered $pages .html page(s)"
          test "$pages" -gt 100

      - name: Upload static files as artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: SpecScribeOutput

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      # actions/deploy-pages@v5 requires `pages: write` to create the deployment and
      # `id-token: write` for its OIDC verification of the artifact. `contents: read`
      # is not enforced by the action itself; it's kept as the job's explicit,
      # minimal default rather than inheriting a broader top-level grant.
      contents: read
      pages: write
      id-token: write
    steps:
      # GitHub's Pages backend intermittently returns "Deployment failed, try
      # again later." at the status-polling stage. The first attempt is allowed
      # to fail without failing the job; the guarded retry re-invokes the deploy
      # (no rebuild) only when that transient error actually occurs.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
