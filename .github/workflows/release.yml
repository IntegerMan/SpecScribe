name: Promote Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Stage A prerelease tag to promote"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promote-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGE_ID: SpecScribe

defaults:
  run:
    shell: bash

jobs:
  promote:
    name: promote Stage A release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Validate the Stage A tag and prerelease release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$ ]] || { echo '::error::Tag must be vMAJOR.MINOR.PATCH-preview.N.'; exit 1; }
          git rev-parse "refs/tags/$TAG" >/dev/null
          gh release view "$TAG" --json isPrerelease,assets --jq 'select(.isPrerelease == true)' > stage-a-release.json
          jq -e '[.assets[].name | select(endswith(".zip") or endswith(".tar.gz"))] | length == 3' stage-a-release.json >/dev/null
          jq -e '[.assets[].name | select(endswith(".nupkg"))] | length == 1' stage-a-release.json >/dev/null
      - name: Resolve tagged version and preflight registry state
        id: version
        run: |
          set -euo pipefail
          VERSION=$(dotnet msbuild src/SpecScribe/SpecScribe.csproj -t:MinVer -getProperty:MinVerVersion | tr -d '[:space:]')
          EXPECTED='${{ inputs.tag }}'; EXPECTED="${EXPECTED#v}"
          [ "$VERSION" = "$EXPECTED" ] || { echo '::error::MinVer did not resolve the requested tag.'; exit 1; }
          bash .github/scripts/release/assert-version-unpublished.sh "$NUGET_PACKAGE_ID" "$VERSION"
          [ -n '${{ vars.NUGET_USER }}' ] || { echo '::error::NUGET_USER is not configured.'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download the immutable Stage A nupkg handoff asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir pkg
          gh release download "$TAG" --pattern '*.nupkg' --dir pkg
          [ "$(find pkg -name '*.nupkg' | wc -l | tr -d ' ')" = 1 ]
      - name: Exchange OIDC immediately before NuGet push
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the Stage A package to nuget.org
        run: dotnet nuget push pkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Append changelog notes above Stage A digest body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > stage-a-body.md
          node .github/scripts/release/release-body.mjs --version '${{ steps.version.outputs.version }}' --changelog CHANGELOG.md --append-to stage-a-body.md > promoted-body.md
          gh release edit "$TAG" --notes-file promoted-body.md